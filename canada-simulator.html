/* ============================================================================
  LOSE MULTIPLIER — CRITICAL JOKE ENGINE
  SEARCH STRING: CANADA_LOSE_MULTIPLIER
  FUNCTION: denyCanadianGoal(teamAttacking)
  Also called from: awardGoal()

  If the player picked Team Canada, the scoreboard MUST NEVER award a
  Canadian goal. Shots are visibly attempted, then diverted / swallowed /
  ruled "no goal". USA goals still count. Effort is visible; outcome is not.
============================================================================ */
const CANADA_LOSE_MULTIPLIER = 0; // 0 = Canadian goals never count. Do not raise above 0 for Level 1.

/**
 * denyCanadianGoal — hard gate on Canadian scoring.
 * Returns true if the goal must be denied (Canada team selected + Canada attack).
 * Always returns false for USA goals / when playing as USA.
 */
function denyCanadianGoal(teamAttacking) {
  // CANADA_LOSE_MULTIPLIER gate:
  if (state.playerTeam === "CANADA" && teamAttacking === "CANADA") {
    if (CANADA_LOSE_MULTIPLIER <= 0) return true; // always deny
    return Math.random() > CANADA_LOSE_MULTIPLIER;
  }
  return false;
}

function wantsMobileUI() {
  try {
    if (window.matchMedia("(pointer: coarse)").matches) return true;
    if (window.matchMedia("(hover: none)").matches) return true;
    if (window.matchMedia("(max-width: 900px)").matches) return true;
  } catch (_) {}
  return ("ontouchstart" in window) || (navigator.maxTouchPoints > 0);
}

function clientToCanvas(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  return {
    x: (clientX - r.left) * (canvas.width / r.width),
    y: (clientY - r.top) * (canvas.height / r.height),
  };
}

function syncMobileChrome() {
  const show = wantsMobileUI();
  if (mobileControls) {
    const playing = state.level === "rink" && state.phase === "play";

    mobileControls.setAttribute("aria-hidden", show && playing ? "false" : "true");

function fitCanvas() {
  const narrow = wantsMobileUI() || window.innerWidth <= 900;
  const maxW = narrow ? window.innerWidth : window.innerWidth * 0.96;
  const reserved = narrow ? 185 : window.innerHeight * 0.30;
  const maxH = Math.max(160, window.innerHeight - reserved);
  const scale = Math.min(maxW / canvas.width, maxH / canvas.height, 1);
  const w = Math.max(1, Math.floor(canvas.width * scale));
  const h = Math.max(1, Math.floor(canvas.height * scale));
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";
}

function refreshTouchSkate() {
  let any = false;
  for (const t of activeTouches.values()) {
    if (t.skating) {
      touchSkate.active = true;
      touchSkate.x = t.x;
      touchSkate.y = t.y;
      mouse.x = t.x;
      mouse.y = t.y;
      any = true;
      break;
    }
  }
  if (!any) touchSkate.active = false;
}

function onTouchStart(e) {
  if (state.level === "snc") {
    e.preventDefault();
    const touch = e.changedTouches[0];
    if (!touch) return;
    const p = clientToCanvas(touch.clientX, touch.clientY);
    mouse.x = p.x; mouse.y = p.y;
    sncOnPointer(p.x, p.y, "down");
    return;
  }
  if (state.level === "driveway") {
    e.preventDefault();
    const touch = e.changedTouches[0];
    if (!touch) return;
    const p = clientToCanvas(touch.clientX, touch.clientY);
    mouse.x = p.x; mouse.y = p.y;
    drivewayOnPointer(p.x, p.y, "down");
    return;
  }
  if (state.level === "lake" || state.level === "quebec" || state.level === "parliament") {
    e.preventDefault();
    const touch = e.changedTouches[0];
    if (!touch) return;
    const p = clientToCanvas(touch.clientX, touch.clientY);
    mouse.x = p.x; mouse.y = p.y;
    if (state.level === "lake") lakeOnPointer(p.x, p.y, "down");
    else if (state.level === "quebec") quebecOnPointer(p.x, p.y, "down");
    else parliamentOnPointer(p.x, p.y, "down");
    return;
  }
  if (state.level !== "rink" || state.phase !== "play") return;
  e.preventDefault();
  const now = performance.now();
  for (const touch of e.changedTouches) {
    const p = clientToCanvas(touch.clientX, touch.clientY);
    activeTouches.set(touch.identifier, {
      sx: touch.clientX, sy: touch.clientY,
      x: p.x, y: p.y, t0: now, skating: false,
    });
    mouse.x = p.x; mouse.y = p.y;
  }
}

function onTouchMove(e) {
  if (state.level === "driveway") {
    e.preventDefault();
    const touch = e.changedTouches[0];
    if (!touch) return;
    const p = clientToCanvas(touch.clientX, touch.clientY);
    mouse.x = p.x; mouse.y = p.y;
    drivewayOnPointer(p.x, p.y, "move");
    return;
  }
  if (state.level !== "rink" || state.phase !== "play") return;
  e.preventDefault();
  for (const touch of e.changedTouches) {
    const rec = activeTouches.get(touch.identifier);
    if (!rec) continue;
    const p = clientToCanvas(touch.clientX, touch.clientY);
    rec.x = p.x; rec.y = p.y;
    const moved = Math.hypot(touch.clientX - rec.sx, touch.clientY - rec.sy);
    if (moved >= TAP_MOVE_PX) rec.skating = true;
    mouse.x = p.x; mouse.y = p.y;
  }
  refreshTouchSkate();
}

function onTouchEnd(e) {
  e.preventDefault();
  if (state.level === "snc") {
    const touch = e.changedTouches[0];
    if (touch) {
      const p = clientToCanvas(touch.clientX, touch.clientY);
      sncOnPointer(p.x, p.y, "up");
    }
    return;
  }
  if (state.level === "driveway") {
    const touch = e.changedTouches[0];
    if (touch) {
      const p = clientToCanvas(touch.clientX, touch.clientY);
      drivewayOnPointer(p.x, p.y, "up");
    }
    return;
  }
  const now = performance.now();
  for (const touch of e.changedTouches) {
    const rec = activeTouches.get(touch.identifier);
    if (!rec) continue;
    activeTouches.delete(touch.identifier);
    if (state.level !== "rink" || state.phase !== "play") continue;
    const moved = Math.hypot(touch.clientX - rec.sx, touch.clientY - rec.sy);
    const dtMs = now - rec.t0;
    if (!rec.skating && moved < TAP_MOVE_PX && dtMs <= TAP_MAX_MS) {
      mouse.x = rec.x; mouse.y = rec.y;
      if (nearOpponent()) fightQueued = true;
      else shootQueued = true;
    }
  }
  refreshTouchSkate();
}

function checkGoals() {
  if (puck.x - puck.r < leftGoal.x + leftGoal.w &&
      puck.y > leftGoal.y && puck.y < leftGoal.y + leftGoal.h &&
      puck.vx <= 0) {
    awardGoal("USA");
    return;
  }
  if (puck.x + puck.r > rightGoal.x &&
      puck.y > rightGoal.y && puck.y < rightGoal.y + rightGoal.h &&
      puck.vx >= 0) {
    awardGoal("CANADA");
  }
}

      { x: player.x, y: player.y - 10, vx: rand(-90, -40), vy: rand(-220, -130), rot: 0 },
      { x: opponent.x, y: opponent.y - 10, vx: rand(40, 90), vy: rand(-220, -130), rot: 0 },
    ],
    punchFlash: 0,
    line: pick(CANADA_FIGHT_LINES),
    refLine: pick(REF_LINES),
    playerWins: state.playerTeam === "USA",
  };
  floatText((player.x + opponent.x) / 2, Math.min(player.y, opponent.y) - 40, "FIGHT!", "#ffd166", 1);
}

function updateFight(dt) {
  const f = state.fight;
  if (!f) return;
  f.t += dt;

  for (const h of f.helmets) {
    h.vy += 420 * dt;
    h.x += h.vx * dt;
    h.y += h.vy * dt;
    h.rot += 5 * dt;
  }

  if (f.stage === "grab" && f.t > 0.55) {
    f.stage = "punch";
    f.punchFlash = 0.4;
  }
  if (f.stage === "punch") {
    f.punchFlash -= dt;
    if (f.t > 1.15) {
      f.stage = "ko";
      if (!f.playerWins) {
        player.leafStamp = 5;
        player.stunned = 2.4;
        state.fightLosses += 1;
        state.hate += 5;
        floatText(player.x, player.y - 50, "+5 Hate", "#ff6b6b", 1.6);
        floatText(player.x, player.y - 72, f.line, "#ffd166", 2.2);
        addBurst(player.x, player.y, "#ff4d4d", 22);
        updateHud();
        announce("fightLose");
        crowdBoo();
        crowdGroan();
      } else {
        f.opponent.stunned = 2;
        floatText(f.opponent.x, f.opponent.y - 50, "USA WINS THE SCRUM", "#4da6ff", 1.8);
        state.hate += 1;
        updateHud();
      }
    }
  }
  if (f.stage === "ko" && f.t > 2.1) f.stage = "wake";
  if (f.stage === "wake" && f.t > 2.8) f.stage = "ref";
  if (f.stage === "ref" && f.t > 4.1) {
    floatText(RINK.x + RINK.w / 2, RINK.y + 60, f.refLine, "#fff", 2.2);
    floatText(RINK.x + RINK.w / 2, RINK.y + 90, "(Penalty does nothing. Classic.)", "#8aa4c0", 2);
    const opp = f.opponent;
    const dx = player.x - opp.x || 1;
    player.x += Math.sign(dx) * 36;
    opp.x -= Math.sign(dx) * 36;
    state.phase = "play";
    state.fight = null;
    syncMobileChrome();
  }
}

/* ---------- PHYSICS / AI ---------- */
function rinkClamp(e) {
  e.x = clamp(e.x, RINK.x + e.r + 4, RINK.x + RINK.w - e.r - 4);
  e.y = clamp(e.y, RINK.y + e.r + 4, RINK.y + RINK.h - e.r - 4);
}


function syncAngle(sk) {
  const sp = Math.hypot(sk.vx, sk.vy);
  if (sp > 18) {
    const target = Math.atan2(sk.vy, sk.vx);
    let d = target - (sk.angle || 0);
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    // stiff rod-pivot feel (bubble hockey slots)
    sk.angle = (sk.angle || 0) + d * 0.28;
    sk.facing = Math.cos(sk.angle) >= 0 ? 1 : -1;
  }
}

function addIceSpray(sk) {
  const sp = Math.hypot(sk.vx, sk.vy);
  if (sp < 80) return;
  if (Math.random() > 0.45) return;
  state.iceSpray.push({
    x: sk.x - Math.sign(sk.vx || sk.facing) * 8,
    y: sk.y + 10,
    vx: -sk.vx * 0.15 + rand(-30, 30),
    vy: rand(-20, 10),
    life: rand(0.2, 0.45),
    r: rand(2, 5),
  });
}

function movePlayer(dt) {
  if (player.leafStamp > 0) player.leafStamp -= dt;
  if (player.stunned > 0) {
    player.stunned -= dt;
    player.vx *= 0.88; player.vy *= 0.88;
    player.x += player.vx * dt;
    player.y += player.vy * dt;
    rinkClamp(player);
    return;
  }
  let ax = 0, ay = 0;
  if (keys["KeyW"] || keys["ArrowUp"]) ay -= 1;
  if (keys["KeyS"] || keys["ArrowDown"]) ay += 1;
  if (keys["KeyA"] || keys["ArrowLeft"]) ax -= 1;
  if (keys["KeyD"] || keys["ArrowRight"]) ax += 1;
  if (touchSkate.active && !(ax || ay)) {
    const dx = touchSkate.x - player.x;
    const dy = touchSkate.y - player.y;
    const d = Math.hypot(dx, dy);
    if (d > 12) { ax = dx / d; ay = dy / d; }
  }
  if (ax || ay) {
    const len = Math.hypot(ax, ay) || 1;
    ax /= len; ay /= len;
    const accel = state.playerTeam === "CANADA" ? 520 : 700;
    player.vx += ax * accel * dt;
    player.vy += ay * accel * dt;
  }
  const friction = 3.2;
  player.vx -= player.vx * friction * dt;
  player.vy -= player.vy * friction * dt;
  const maxSpd = state.playerTeam === "CANADA" ? 215 : 270;
  const sp = Math.hypot(player.vx, player.vy);
  if (sp > maxSpd) { player.vx *= maxSpd / sp; player.vy *= maxSpd / sp; }
  player.x += player.vx * dt;
  player.y += player.vy * dt;
  syncAngle(player);
  addIceSpray(player);
  rinkClamp(player);
}

function aiSkate(e, dt, targetX, targetY, speed) {
  if (e.stunned > 0) {
    e.stunned -= dt;
    e.vx *= 0.9; e.vy *= 0.9;
    e.x += e.vx * dt; e.y += e.vy * dt;
    rinkClamp(e);
    return;
  }
  if (e.leafStamp > 0) e.leafStamp -= dt;
  const dx = targetX - e.x, dy = targetY - e.y;
  const d = Math.hypot(dx, dy) || 1;
  e.vx += (dx / d) * speed * dt;
  e.vy += (dy / d) * speed * dt;
  e.vx -= e.vx * 3 * dt;
  e.vy -= e.vy * 3 * dt;
  e.x += e.vx * dt;
  e.y += e.vy * dt;
  syncAngle(e);
  addIceSpray(e);
  rinkClamp(e);
}

function updateAI(dt) {
  if (teammate) {
    const tx = puck.x + (teammate.team === "CANADA" ? -50 : 50);
    const ty = puck.y + Math.sin(performance.now() / 700) * 36;
    aiSkate(teammate, dt, tx, ty, 380);
  }
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    let tx = puck.x, ty = puck.y;
    if (i === 1) { tx = player.x; ty = player.y; }
    if (i === 2) { tx = (puck.x + RINK.x + RINK.w / 2) / 2; ty = puck.y; }
    const spd = e.team === "USA" ? 480 : 350;
    aiSkate(e, dt, tx, ty, spd);

    if (e.team === "USA" && e.hasPuck && Math.random() < 0.015) {
      shootFrom(e, leftGoal.x + 8, leftGoal.y + leftGoal.h / 2 + rand(-10, 10), true);
    }
    if (e.team === "CANADA" && e.hasPuck && Math.random() < 0.01) {
      shootFrom(e, rightGoal.x, rightGoal.y + rightGoal.h / 2 + rand(-20, 20), false);
    }
  }
  updateGoalie(goalieCan, dt, true);
  updateGoalie(goalieUsa, dt, false);
}

function updateGoalie(g, dt, isCanada) {
  const creaseY = clamp(puck.y, RINK.y + RINK.h / 2 - 75, RINK.y + RINK.h / 2 + 75);
  if (isCanada) {
    state.phoneCheck += dt;
    const distracted = Math.sin(state.phoneCheck * 1.25) > 0.7;
    const lag = distracted ? 0.4 : 2.0;
    g.y += (creaseY - g.y) * lag * dt;
  } else {
    g.y += (creaseY - g.y) * 9 * dt;
  }
  g.y = clamp(g.y, RINK.y + 55, RINK.y + RINK.h - 55);

  if (dist(g, puck) < g.r + puck.r + 8) {
    const saveChance = isCanada ? 0.22 : 0.85;
    if (Math.random() < saveChance || (isCanada && state.playerTeam === "CANADA" && Math.random() < 0.55)) {
      puck.vx = isCanada ? Math.abs(puck.vx) * 0.5 + 55 : -Math.abs(puck.vx) * 0.75 - 60;
      puck.vy = rand(-90, 90);
      if (puck.owner) { puck.owner.hasPuck = false; puck.owner = null; }
      floatText(g.x, g.y - 28, isCanada ? "missed it…" : "GLOVE!", isCanada ? "#ff8fa3" : "#4da6ff", 0.8);
    }
  }
}

function tryPickup(sk) {
  if (puck.owner) return;
  if (dist(sk, puck) < sk.r + puck.r + 6) {
    puck.owner = sk;
    sk.hasPuck = true;
  }
}

function releasePuckOwner() {
  if (puck.owner) {
    puck.owner.hasPuck = false;
    puck.owner = null;
  }
}

function shootFrom(sk, aimX, aimY, isStrong) {
  if (puck.owner !== sk && dist(sk, puck) > sk.r + 24) return;
  releasePuckOwner();
  const dx = aimX - sk.x, dy = aimY - sk.y;
  const d = Math.hypot(dx, dy) || 1;
  let power = sk.team === "CANADA" ? (isStrong ? 210 : 150) : (isStrong ? 540 : 420);
  if (sk.isPlayer && state.playerTeam === "CANADA") power *= 0.5;
  puck.vx = (dx / d) * power;
  puck.vy = (dy / d) * power;
  puck.lastShooter = sk;
  puck.x = sk.x + (dx / d) * (sk.r + 10);
  puck.y = sk.y + (dy / d) * (sk.r + 10);
  if (sk.team === "CANADA") {
    puck.vx *= 0.72;
    puck.vy *= 0.72;
    puck.vy += rand(-50, 50);
  }
}

function playerShoot() {
  if (state.phase !== "play" || player.stunned > 0) return;
  const need = state.playerTeam === "CANADA" ? 0.38 : 0.06;
  state.windup += 0.1;
  if (state.windup < need) {
    if (state.playerTeam === "CANADA") {
      floatText(player.x, player.y - 26, "winding up…", "#ccc", 0.35);
    }
    return;
  }
  state.windup = 0;
  if (puck.owner === player || dist(player, puck) < 62) {
    shootFrom(player, mouse.x, mouse.y, true);
  }
}

function updatePuck(dt) {
  if (puck.owner) {
    const o = puck.owner;
    const ox = Math.cos(o.angle || 0);
    const oy = Math.sin(o.angle || 0);
    puck.x = o.x + ox * (o.r + 8);
    puck.y = o.y + oy * (o.r + 8) + 2;
    puck.vx = o.vx; puck.vy = o.vy;
    state.puckTrail = [];
    return;
  }
  // High damping for Canada feel (underwater puck)
  const damp = state.playerTeam === "CANADA" ? 1.4 : 0.38;
  puck.vx -= puck.vx * damp * dt;
  puck.vy -= puck.vy * damp * dt;
  puck.x += puck.vx * dt;
  puck.y += puck.vy * dt;

  if (Math.hypot(puck.vx, puck.vy) > 40) {
    state.puckTrail.push({ x: puck.x, y: puck.y, life: 0.28 });
    if (state.puckTrail.length > 10) state.puckTrail.shift();
  }

  if (puck.x < RINK.x + puck.r) { puck.x = RINK.x + puck.r; puck.vx *= -0.72; }
  if (puck.x > RINK.x + RINK.w - puck.r) { puck.x = RINK.x + RINK.w - puck.r; puck.vx *= -0.72; }
  if (puck.y < RINK.y + puck.r) { puck.y = RINK.y + puck.r; puck.vy *= -0.72; }
  if (puck.y > RINK.y + RINK.h - puck.r) { puck.y = RINK.y + RINK.h - puck.r; puck.vy *= -0.72; }

  checkGoals();
}

function collideSkaters(a, b) {
  const d = dist(a, b);
  const min = a.r + b.r;
  if (d > 0 && d < min) {
    const nx = (b.x - a.x) / d, ny = (b.y - a.y) / d;
    const overlap = min - d;
    a.x -= nx * overlap * 0.5; a.y -= ny * overlap * 0.5;
    b.x += nx * overlap * 0.5; b.y += ny * overlap * 0.5;
    const impact = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
    if (impact > 0) {
      a.vx -= impact * nx; a.vy -= impact * ny;
      b.vx += impact * nx; b.vy += impact * ny;
    }
    return true;
  }
  return false;
}

function stealChecks() {
  const all = [player, teammate, ...enemies].filter(Boolean);
  for (const sk of all) {
    if (puck.owner && puck.owner !== sk && dist(sk, puck.owner) < sk.r + puck.owner.r + 4) {
      if (Math.random() < (sk.team === "USA" ? 0.045 : 0.016)) {
        puck.owner.hasPuck = false;
        puck.owner = sk;
        sk.hasPuck = true;
      }
    }
    tryPickup(sk);
  }
}

function canadaMatchScript(dt) {
  if (state.playerTeam !== "CANADA") return;
  state.usaPressure += dt;
  if (state.usaPressure > 20 && state.scoreUsa <= state.scoreCan) {
    state.usaPressure = 0;
    releasePuckOwner();
    puck.x = leftGoal.x + 28;
    puck.y = leftGoal.y + leftGoal.h / 2;
    puck.vx = -80;
    awardGoal("USA");
    floatText(RINK.x + RINK.w / 2, RINK.y + 120, "Breakaway. Of course.", "#4da6ff", 1.8);
  }
  if (state.timeLeft < 9 && state.scoreUsa <= state.scoreCan) {
    releasePuckOwner();
    puck.x = leftGoal.x + 28;
    puck.y = leftGoal.y + leftGoal.h / 2;
    puck.vx = -80;
    awardGoal("USA");
  }
}

function endMatch() {
  if (state.buzzerDone) return;
  state.buzzerDone = true;
  state.phase = "results";
  state.zamboni = null;
  try { speechSynthesis.cancel(); } catch (_) {}
  announce("buzzer");
  crowdBoo();
  crowdGroan();

  if (state.playerTeam === "CANADA" && state.scoreUsa <= state.scoreCan) {
    state.scoreUsa = state.scoreCan + 1 + ((Math.random() * 2) | 0);
  }
  updateHud();

  const verdict = pick(RESULT_VERDICTS);
  const teamLabel = state.playerTeam === "CANADA" ? "Team Canada" : "Team USA";
  const toneClass = state.playerTeam === "CANADA" ? "red" : "blue";

  showOverlay(`
    <div class="poster-tag">POST-GAME SHOW</div>
    <h2 class="${toneClass}">BUZZER</h2>
    <div class="broadcast">FINAL &nbsp; CAN ${state.scoreCan} &nbsp;—&nbsp; USA ${state.scoreUsa}<br/>
    ${teamLabel} · Fights lost: ${state.fightLosses} · Hate Index: ${state.hate}</div>
    <div class="verdict">${verdict}</div>
    <p class="tiny">You wanted Canada to win. The systems disagreed.</p>
    <div class="btns">
      ${state.playAll
        ? '<button class="btn-go" id="nextLvl">Next ▶ Boardroom</button><button class="btn-dim" id="mainMenu">Main Menu</button>'
        : '<button class="btn-go" id="again">Play again</button><button class="btn-dim" id="menu">Change team</button><button class="btn-dim" id="mainMenu">Main Menu</button>'}
    </div>
  `);
  if (state.playAll) {
    document.getElementById("nextLvl").onclick = () => advanceCampaign();
  } else {
    document.getElementById("again").onclick = () => setupMatch();
    document.getElementById("menu").onclick = () => showTeamPick();
  }
  document.getElementById("mainMenu").onclick = () => showMainMenu();
  touchSkate.active = false;
  activeTouches.clear();
  syncMobileChrome();
}


/* ---------- DRAW (Super Chexx / bubble hockey) ---------- */
function roundRectPath(x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

function drawMapleLeaf(x, y, s, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, -s);
  ctx.lineTo(s * 0.35, -s * 0.25);
  ctx.lineTo(s, -s * 0.45);
  ctx.lineTo(s * 0.4, s * 0.05);
  ctx.lineTo(s * 0.65, s * 0.7);
  ctx.lineTo(0, s * 0.35);
  ctx.lineTo(-s * 0.65, s * 0.7);
  ctx.lineTo(-s * 0.4, s * 0.05);
  ctx.lineTo(-s, -s * 0.45);
  ctx.lineTo(-s * 0.35, -s * 0.25);
  ctx.closePath();
  ctx.fill();
  ctx.fillRect(-1.5, s * 0.3, 3, s * 0.45);
  ctx.restore();
}

function drawStar(x, y, r, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + (i * 2 * Math.PI) / 5;
    const px = Math.cos(a) * r;
    const py = Math.sin(a) * r;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawCanadianFlag(x, y, w, h, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha == null ? 0.22 : alpha;
  const band = w * 0.25;
  ctx.fillStyle = "#ff0000";
  ctx.fillRect(x, y, band, h);
  ctx.fillRect(x + w - band, y, band, h);
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(x + band, y, w - band * 2, h);
  drawMapleLeaf(x + w / 2, y + h / 2, Math.min(w, h) * 0.28, "#ff0000");
  ctx.strokeStyle = "rgba(0,0,0,0.25)";
  ctx.lineWidth = 2;
  ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
  ctx.restore();
}

function drawAmericanFlag(x, y, w, h, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha == null ? 0.22 : alpha;
  const stripeH = h / 13;
  for (let i = 0; i < 13; i++) {
    ctx.fillStyle = i % 2 === 0 ? "#b22234" : "#ffffff";
    ctx.fillRect(x, y + i * stripeH, w, stripeH + 0.6);
  }
  const cantonW = w * 0.4;
  const cantonH = stripeH * 7;
  ctx.fillStyle = "#3c3b6e";
  ctx.fillRect(x, y, cantonW, cantonH);
  ctx.fillStyle = "#ffffff";
  for (let row = 0; row < 5; row++) {
    for (let col = 0; col < 6; col++) {
      const sx = x + 6 + col * (cantonW - 10) / 5.5;
      const sy = y + 5 + row * (cantonH - 8) / 4.2;
      ctx.beginPath();
      ctx.arc(sx, sy, 1.8, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.strokeStyle = "rgba(0,0,0,0.25)";
  ctx.lineWidth = 2;
  ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
  ctx.restore();
}

/** Deterministic scratched / played-on ice wear (no flicker). */
function drawIceWear() {
  const wear = clamp(1 - (state.iceFresh || 0), 0.08, 1);
  // wet/fresh sheen when Zamboni recently passed
  if (state.iceFresh > 0.05) {
    ctx.fillStyle = "rgba(200,230,255," + (state.iceFresh * 0.28) + ")";
    ctx.fillRect(RINK.x, RINK.y, RINK.w, RINK.h);
  }
  ctx.save();
  ctx.globalAlpha = wear;
  // dull patches
  for (let i = 0; i < 18; i++) {
    const px = RINK.x + 40 + ((i * 97) % (RINK.w - 80));
    const py = RINK.y + 30 + ((i * 61) % (RINK.h - 60));
    const rw = 40 + (i % 5) * 18;
    const rh = 18 + (i % 4) * 10;
    ctx.fillStyle = i % 3 === 0 ? "rgba(160,180,200,0.22)" : "rgba(190,205,220,0.18)";
    ctx.beginPath();
    ctx.ellipse(px, py, rw, rh, (i % 7) * 0.2, 0, Math.PI * 2);
    ctx.fill();
  }
  // skate blade scratch marks
  ctx.lineCap = "round";
  for (let i = 0; i < 90; i++) {
    const x0 = RINK.x + 20 + ((i * 73) % (RINK.w - 40));
    const y0 = RINK.y + 16 + ((i * 47) % (RINK.h - 32));
    const len = 18 + (i % 9) * 8;
    const ang = ((i * 37) % 360) * Math.PI / 180;
    ctx.strokeStyle = i % 4 === 0 ? "rgba(120,140,160,0.28)" : "rgba(255,255,255,0.35)";
    ctx.lineWidth = i % 5 === 0 ? 1.6 : 0.9;
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x0 + Math.cos(ang) * len, y0 + Math.sin(ang) * len * 0.35);
    ctx.stroke();
  }
  // scuff clusters near boards
  for (let i = 0; i < 28; i++) {
    const along = (i * 0.07) % 1;
    const edge = i % 4;
    let sx, sy;
    if (edge === 0) { sx = RINK.x + 30 + along * (RINK.w - 60); sy = RINK.y + 18 + (i % 3) * 6; }
    else if (edge === 1) { sx = RINK.x + 30 + along * (RINK.w - 60); sy = RINK.y + RINK.h - 22 - (i % 3) * 6; }
    else if (edge === 2) { sx = RINK.x + 18 + (i % 3) * 7; sy = RINK.y + 40 + along * (RINK.h - 80); }
    else { sx = RINK.x + RINK.w - 22 - (i % 3) * 7; sy = RINK.y + 40 + along * (RINK.h - 80); }
    ctx.fillStyle = "rgba(100,120,140,0.2)";
    ctx.beginPath();
    ctx.arc(sx, sy, 2 + (i % 3), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawBoardAd(x, y, w, h, bg, text, fg) {
  ctx.fillStyle = bg;
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = "rgba(255,255,255,0.25)";
  ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  ctx.fillStyle = fg;
  ctx.font = "bold 9px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(text, x + w / 2, y + h / 2);
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
}

function drawRink() {
  const g = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, 80, canvas.width / 2, canvas.height / 2, 560);
  g.addColorStop(0, "#243044");
  g.addColorStop(1, "#0a1018");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#152033";
  roundRectPath(18, 10, canvas.width - 36, canvas.height - 20, 28);
  ctx.fill();

  for (let i = 0; i < 70; i++) {
    const side = i % 4;
    let cx, cy;
    if (side === 0) { cx = 30 + ((i * 47) % (canvas.width - 60)); cy = 14 + (i % 3) * 7; }
    else if (side === 1) { cx = 30 + ((i * 53) % (canvas.width - 60)); cy = canvas.height - 36 + (i % 3) * 6; }
    else if (side === 2) { cx = 22 + (i % 4) * 7; cy = 50 + ((i * 37) % (canvas.height - 100)); }
    else { cx = canvas.width - 52 + (i % 4) * 7; cy = 50 + ((i * 41) % (canvas.height - 100)); }
    const cols = ["#3b4a63", "#4a5a78", "#2a384e", "#c81e1e", "#1d4e89", "#6b7280"];
    ctx.fillStyle = cols[i % cols.length];
    ctx.beginPath();
    ctx.arc(cx, cy, 3 + (i % 3), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = "#1d4e89";
  ctx.fillRect(canvas.width - 78, 16, 42, 14);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 8px sans-serif";
  ctx.fillText("U-S-A", canvas.width - 72, 26);
  ctx.fillStyle = "#c81e1e";
  ctx.fillRect(36, canvas.height - 30, 48, 14);
  ctx.fillStyle = "#fff";
  ctx.fillText("SORRY?", 42, canvas.height - 20);

  // Thick rails / boards
  ctx.fillStyle = "#8b1a1a";
  roundRectPath(RINK.x - 22, RINK.y - 22, RINK.w + 44, RINK.h + 44, 56);
  ctx.fill();
  ctx.fillStyle = "#0c2348";
  roundRectPath(RINK.x - 16, RINK.y - 16, RINK.w + 32, RINK.h + 32, 50);
  ctx.fill();
  ctx.strokeStyle = "#e8b84a";
  ctx.lineWidth = 5;
  roundRectPath(RINK.x - 10, RINK.y - 10, RINK.w + 20, RINK.h + 20, 46);
  ctx.stroke();

  const ice = ctx.createLinearGradient(RINK.x, RINK.y, RINK.x, RINK.y + RINK.h);
  ice.addColorStop(0, "#e8f0f8");
  ice.addColorStop(0.35, "#d4e0ec");
  ice.addColorStop(0.7, "#c8d6e4");
  ice.addColorStop(1, "#b8c8d8");
  ctx.fillStyle = ice;
  roundRectPath(RINK.x, RINK.y, RINK.w, RINK.h, 42);
  ctx.fill();

  ctx.save();
  roundRectPath(RINK.x, RINK.y, RINK.w, RINK.h, 42);
  ctx.clip();

  // Big national flags painted under the ice markings (left CAN / right USA)
  const flagW = RINK.w * 0.34;
  const flagH = RINK.h * 0.42;
  drawCanadianFlag(RINK.x + RINK.w * 0.08, RINK.y + RINK.h * 0.29, flagW, flagH, 0.28);
  drawAmericanFlag(RINK.x + RINK.w * 0.58, RINK.y + RINK.h * 0.29, flagW, flagH, 0.28);
  // Board-side flag banners (large & readable)
  drawCanadianFlag(RINK.x + 24, RINK.y + 8, 150, 52, 0.55);
  drawAmericanFlag(RINK.x + RINK.w - 174, RINK.y + 8, 150, 52, 0.55);
  drawCanadianFlag(RINK.x + 24, RINK.y + RINK.h - 60, 130, 46, 0.45);
  drawAmericanFlag(RINK.x + RINK.w - 154, RINK.y + RINK.h - 60, 130, 46, 0.45);

  drawIceWear();

  ctx.fillStyle = "rgba(255,255,255,0.18)";
  ctx.beginPath();
  ctx.ellipse(RINK.x + RINK.w * 0.35, RINK.y + 70, 220, 28, -0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "rgba(140,160,180,0.16)";
  ctx.fillRect(RINK.x + 40, RINK.y + RINK.h - 90, 280, 18);

  ctx.strokeStyle = "#c81e1e";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(RINK.x + RINK.w / 2, RINK.y + 6);
  ctx.lineTo(RINK.x + RINK.w / 2, RINK.y + RINK.h - 6);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(RINK.x + RINK.w / 2, RINK.y + RINK.h / 2, 62, 0, Math.PI * 2);
  ctx.stroke();
  ctx.fillStyle = "rgba(200,30,30,0.12)";
  ctx.beginPath();
  ctx.arc(RINK.x + RINK.w / 2, RINK.y + RINK.h / 2, 40, 0, Math.PI * 2);
  ctx.fill();
  drawMapleLeaf(RINK.x + RINK.w / 2 - 10, RINK.y + RINK.h / 2, 14, "rgba(200,30,30,0.55)");
  drawStar(RINK.x + RINK.w / 2 + 14, RINK.y + RINK.h / 2, 8, "rgba(29,78,137,0.55)");
  ctx.fillStyle = "#c81e1e";
  ctx.beginPath();
  ctx.arc(RINK.x + RINK.w / 2, RINK.y + RINK.h / 2, 5, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = "#1d4e89";
  ctx.lineWidth = 4;
  const bl = RINK.w * 0.25;
  ctx.beginPath();
  ctx.moveTo(RINK.x + bl, RINK.y + 6);
  ctx.lineTo(RINK.x + bl, RINK.y + RINK.h - 6);
  ctx.moveTo(RINK.x + RINK.w - bl, RINK.y + 6);
  ctx.lineTo(RINK.x + RINK.w - bl, RINK.y + RINK.h - 6);
  ctx.stroke();

  const dots = [
    [RINK.x + bl - 70, RINK.y + 110],
    [RINK.x + bl - 70, RINK.y + RINK.h - 110],
    [RINK.x + RINK.w - bl + 70, RINK.y + 110],
    [RINK.x + RINK.w - bl + 70, RINK.y + RINK.h - 110],
  ];
  for (const [dx, dy] of dots) {
    ctx.fillStyle = "rgba(150,165,180,0.35)";
    ctx.beginPath();
    ctx.ellipse(dx, dy, 34, 30, 0.1, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "rgba(160,40,40,0.55)";
    ctx.lineWidth = 3;
    ctx.setLineDash([7, 5]);
    ctx.beginPath();
    ctx.arc(dx, dy, 28, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = "#c81e1e";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(dx, dy, 26, 0.2, Math.PI * 1.6);
    ctx.stroke();
    ctx.fillStyle = "#c81e1e";
    ctx.beginPath();
    ctx.arc(dx, dy, 4, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.strokeStyle = "#c81e1e";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(leftGoal.x + leftGoal.w, RINK.y + RINK.h / 2, 48, -Math.PI / 2, Math.PI / 2);
  ctx.stroke();
  ctx.strokeStyle = "#1d4e89";
  ctx.beginPath();
  ctx.arc(rightGoal.x, RINK.y + RINK.h / 2, 48, Math.PI / 2, -Math.PI / 2);
  ctx.stroke();

  ctx.fillStyle = "#0f172a";
  ctx.fillRect(leftGoal.x, leftGoal.y, leftGoal.w, leftGoal.h);
  ctx.fillRect(rightGoal.x, rightGoal.y, rightGoal.w, rightGoal.h);
  ctx.strokeStyle = "#ff4d4d";
  ctx.lineWidth = 3;
  ctx.strokeRect(leftGoal.x, leftGoal.y, leftGoal.w, leftGoal.h);
  ctx.strokeStyle = "#4da6ff";
  ctx.strokeRect(rightGoal.x, rightGoal.y, rightGoal.w, rightGoal.h);
  ctx.strokeStyle = "rgba(255,255,255,0.2)";
  ctx.lineWidth = 1;
  for (let i = 0; i < 6; i++) {
    const yy = leftGoal.y + 6 + i * 12;
    ctx.beginPath();
    ctx.moveTo(leftGoal.x, yy); ctx.lineTo(leftGoal.x + leftGoal.w, yy); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(rightGoal.x, yy); ctx.lineTo(rightGoal.x + rightGoal.w, yy); ctx.stroke();
  }

  ctx.fillStyle = "rgba(15,23,42,0.35)";
  ctx.fillRect(RINK.x + 180, RINK.y + 4, 160, 10);
  ctx.fillRect(RINK.x + RINK.w - 340, RINK.y + RINK.h - 14, 160, 10);
  ctx.restore();

  drawBoardAd(RINK.x + 80, RINK.y - 20, 110, 14, "#111827", "TIM'S NOT HERE", "#fbbf24");
  drawBoardAd(RINK.x + 220, RINK.y - 20, 100, 14, "#1e3a8a", "FREEDOM SLAPS", "#fff");
  drawBoardAd(RINK.x + 350, RINK.y - 20, 120, 14, "#7f1d1d", "SORRY BEER", "#fecaca");
  drawBoardAd(RINK.x + 500, RINK.y - 20, 110, 14, "#0f172a", "LAKE FOR SALE", "#93c5fd");
  drawBoardAd(RINK.x + 640, RINK.y - 20, 100, 14, "#1d4e89", "U-S-A INC.", "#fff");
  drawBoardAd(RINK.x + 120, RINK.y + RINK.h + 6, 120, 14, "#7f1d1d", "MAPLE DEFENSE", "#fff");
  drawBoardAd(RINK.x + 280, RINK.y + RINK.h + 6, 130, 14, "#0c2348", "FOUR-ARM GLOVE", "#93c5fd");
  drawBoardAd(RINK.x + 450, RINK.y + RINK.h + 6, 120, 14, "#111827", "WET CARDBOARD", "#fcd34d");
  drawBoardAd(RINK.x + 600, RINK.y + RINK.h + 6, 110, 14, "#c81e1e", "HATE INDEX+", "#fff");

  ctx.strokeStyle = "rgba(255,255,255,0.18)";
  ctx.lineWidth = 2;
  roundRectPath(RINK.x + 4, RINK.y + 4, RINK.w - 8, RINK.h - 8, 38);
  ctx.stroke();

  if (state.crowdFlash > 0) {
    ctx.fillStyle = "rgba(77,166,255,0.14)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#4da6ff";
    ctx.font = "bold 26px sans-serif";
    ctx.textAlign = "center";
    ctx.shadowColor = "#1d4e89";
    ctx.shadowBlur = 12;
    ctx.fillText("U-S-A! U-S-A!", canvas.width / 2, 34);
    ctx.shadowBlur = 0;
    ctx.textAlign = "left";
  }
  if (state.goalFlash > 0) {
    ctx.fillStyle = "rgba(255,209,102," + (state.goalFlash * 0.45) + ")";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
}

/** 1970s bubble-hockey hair (no helmets). */
function drawSeventiesHair(scale, style, isCan) {
  const hairCol = isCan ? "#3b2314" : "#1a120c";
  const hairHi = isCan ? "#5c3a22" : "#2a1c14";
  ctx.fillStyle = hairCol;
  // thick top mop
  ctx.beginPath();
  ctx.ellipse(0, -22 * scale, 11 * scale, 8 * scale, 0, 0, Math.PI * 2);
  ctx.fill();
  if (style === "mullet" || style === "swoop") {
    ctx.beginPath();
    ctx.ellipse(0, -14 * scale, 8 * scale, 10 * scale, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-6 * scale, -12 * scale);
    ctx.quadraticCurveTo(0, 2 * scale, 6 * scale, -12 * scale);
    ctx.quadraticCurveTo(0, -2 * scale, -6 * scale, -12 * scale);
    ctx.fill();
  }
  if (style === "afro") {
    ctx.beginPath();
    ctx.arc(0, -20 * scale, 13 * scale, 0, Math.PI * 2);
    ctx.fill();
  }
  if (style === "sideburns" || style === "beard" || style === "mullet") {
    ctx.fillRect(-11 * scale, -18 * scale, 3.5 * scale, 10 * scale);
    ctx.fillRect(7.5 * scale, -18 * scale, 3.5 * scale, 10 * scale);
  }
  if (style === "beard" || style === "mullet") {
    ctx.fillStyle = hairHi;
    ctx.beginPath();
    ctx.ellipse(0, -10 * scale, 7 * scale, 4.5 * scale, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  // stubble always
  ctx.fillStyle = "rgba(40,28,20,0.35)";
  ctx.beginPath();
  ctx.ellipse(0, -11 * scale, 6.5 * scale, 3.2 * scale, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawSeventiesFace(scale, isCan) {
  const skin = "#e8b896";
  ctx.fillStyle = skin;
  ctx.strokeStyle = "#0a0f18";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(0, -16 * scale, 8.5 * scale, 8 * scale, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  // eyes
  ctx.fillStyle = "#111";
  ctx.beginPath();
  ctx.arc(-3 * scale, -17 * scale, 1.4 * scale, 0, Math.PI * 2);
  ctx.arc(3 * scale, -17 * scale, 1.4 * scale, 0, Math.PI * 2);
  ctx.fill();
  // bushy brows
  ctx.strokeStyle = "#2a1810";
  ctx.lineWidth = 2.2 * scale;
  ctx.beginPath();
  ctx.moveTo(-5.5 * scale, -20 * scale); ctx.lineTo(-1 * scale, -19.5 * scale);
  ctx.moveTo(1 * scale, -19.5 * scale); ctx.lineTo(5.5 * scale, -20 * scale);
  ctx.stroke();
  // nose
  ctx.strokeStyle = "#c48a6a";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(0, -17 * scale); ctx.lineTo(1.5 * scale, -14 * scale);
  ctx.stroke();
  // mouth
  ctx.strokeStyle = "#7a3b2e";
  ctx.beginPath();
  ctx.arc(0, -12.5 * scale, 2.2 * scale, 0.15, Math.PI - 0.15);
  ctx.stroke();
}

/** Chunky Super Chexx / 1970s tabletop plastic men — NO HELMETS. */
function drawPlasticPlayer(sk, opts) {
  opts = opts || {};
  const isCan = sk.team === "CANADA";
  const jersey = isCan ? "#d62828" : "#f1f5f9";
  const jerseyDark = isCan ? "#9b1c1c" : "#1e3a8a";
  const pants = isCan ? "#111827" : "#1e3a8a";
  const outline = "#0a0f18";
  const scale = (sk.r / 16) * (opts.big ? 1.25 : 1);
  const ang = sk.angle != null ? sk.angle : (sk.facing >= 0 ? 0 : Math.PI);
  const hair = sk.hair || "mullet";
  const hasPuck = !!(sk.hasPuck || (puck && puck.owner === sk));
  const pulse = 1 + Math.sin(performance.now() / 160) * 0.08;

  // Possession glow ring under skates (owner highlight)
  if (hasPuck) {
    ctx.save();
    ctx.translate(sk.x, sk.y);
    const rg = ctx.createRadialGradient(0, 4, 2, 0, 4, sk.r * 1.8 * pulse);
    rg.addColorStop(0, isCan ? "rgba(255,80,80,0.55)" : "rgba(80,160,255,0.55)");
    rg.addColorStop(0.55, isCan ? "rgba(255,200,80,0.25)" : "rgba(200,230,255,0.22)");
    rg.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.ellipse(0, 6, sk.r * 1.55 * pulse, sk.r * 0.7 * pulse, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = isCan ? "rgba(255,209,102,0.9)" : "rgba(147,197,253,0.9)";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(0, 6, sk.r * 1.35, sk.r * 0.55, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  ctx.save();
  ctx.translate(sk.x, sk.y);
  ctx.rotate(ang);

  ctx.fillStyle = "rgba(15,23,42,0.28)";
  ctx.beginPath();
  ctx.ellipse(0, 6 * scale, 14 * scale, 5 * scale, 0, 0, Math.PI * 2);
  ctx.fill();

  // stick — highlight when possessing
  ctx.strokeStyle = hasPuck ? "#ffd166" : "#5c3d2e";
  ctx.lineWidth = (hasPuck ? 4.2 : 3.4) * scale;
  ctx.lineCap = "round";
  ctx.shadowColor = hasPuck ? "rgba(255,209,102,0.85)" : "transparent";
  ctx.shadowBlur = hasPuck ? 10 : 0;
  ctx.beginPath();
  ctx.moveTo(2 * scale, 2 * scale);
  if (isCan) ctx.quadraticCurveTo(18 * scale, 8 * scale, 28 * scale, 12 * scale);
  else ctx.lineTo(30 * scale, 8 * scale);
  ctx.stroke();
  ctx.lineWidth = 3.8 * scale;
  ctx.beginPath();
  ctx.moveTo(26 * scale, 10 * scale);
  ctx.lineTo(32 * scale, 17 * scale);
  ctx.stroke();
  ctx.shadowBlur = 0;

  // skates
  ctx.fillStyle = "#111";
  ctx.strokeStyle = outline;
  ctx.lineWidth = 1.5;
  roundRectPath(-11 * scale, 8 * scale, 8 * scale, 5 * scale, 1.5); ctx.fill(); ctx.stroke();
  roundRectPath(3 * scale, 8 * scale, 8 * scale, 5 * scale, 1.5); ctx.fill(); ctx.stroke();

  // pants
  ctx.fillStyle = pants;
  roundRectPath(-11 * scale, 0, 22 * scale, 13 * scale, 3);
  ctx.fill();
  ctx.strokeStyle = outline;
  ctx.lineWidth = 2;
  ctx.stroke();

  // jersey body (chunky plastic)
  ctx.fillStyle = jersey;
  roundRectPath(-13 * scale, -14 * scale, 26 * scale, 18 * scale, 5);
  ctx.fill();
  ctx.strokeStyle = outline;
  ctx.lineWidth = 2.4;
  ctx.stroke();
  ctx.fillStyle = jerseyDark;
  ctx.fillRect(-13 * scale, -4 * scale, 26 * scale, 4.5 * scale);

  if (isCan) drawMapleLeaf(0, -8 * scale, 6.5 * scale, "#fff");
  else {
    ctx.fillStyle = "#1d4e89";
    ctx.fillRect(-13 * scale, -14 * scale, 26 * scale, 5 * scale);
    drawStar(0, -8 * scale, 5 * scale, "#1d4e89");
  }

  // arms
  ctx.fillStyle = jersey;
  ctx.strokeStyle = outline;
  ctx.lineWidth = 1.8;
  roundRectPath(-20 * scale, -10 * scale, 9 * scale, 7 * scale, 2); ctx.fill(); ctx.stroke();
  roundRectPath(11 * scale, -8 * scale, 11 * scale, 6 * scale, 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = isCan ? "#111" : "#dc2626";
  ctx.beginPath();
  ctx.arc(-20 * scale, -6.5 * scale, 3.4 * scale, 0, Math.PI * 2);
  ctx.arc(22 * scale, -5 * scale, 3.4 * scale, 0, Math.PI * 2);
  ctx.fill();

  // face + hair (NO HELMET)
  drawSeventiesFace(scale, isCan);
  drawSeventiesHair(scale, hair, isCan);

  // jersey number
  ctx.fillStyle = isCan ? "#fff" : "#1d4e89";
  ctx.font = "bold " + Math.floor(9 * scale) + "px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(String(sk.num != null ? sk.num : (sk.isPlayer ? 19 : 9)), 0, 9 * scale);
  ctx.restore();

  // name tag under player
  if (sk.name) {
    ctx.save();
    ctx.font = "bold 10px sans-serif";
    ctx.textAlign = "center";
    const label = (sk.shortName || sk.name).toUpperCase();
    const tw = ctx.measureText(label).width + 10;
    ctx.fillStyle = "rgba(10,14,22,0.72)";
    roundRectPath(sk.x - tw / 2, sk.y + sk.r + 2, tw, 14, 4);
    ctx.fill();
    ctx.fillStyle = isCan ? "#fecaca" : "#bfdbfe";
    ctx.fillText(label, sk.x, sk.y + sk.r + 12);
    ctx.restore();
  }

  if (sk.isPlayer) {
    ctx.save();
    ctx.translate(sk.x, sk.y);
    ctx.fillStyle = "#ffd166";
    ctx.strokeStyle = "#0a0f18";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -sk.r - 26);
    ctx.lineTo(8, -sk.r - 14);
    ctx.lineTo(-8, -sk.r - 14);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.strokeStyle = "rgba(255,209,102,0.65)";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, sk.r + 10 + Math.sin(performance.now() / 180) * 2, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();

    if (hasPuck) {
      ctx.save();
      const chip = "YOU HAVE THE PUCK";
      ctx.font = "bold 11px sans-serif";
      ctx.textAlign = "center";
      const cw = ctx.measureText(chip).width + 16;
      const cy = sk.y - sk.r - 38;
      ctx.fillStyle = "rgba(255,209,102,0.95)";
      roundRectPath(sk.x - cw / 2, cy - 12, cw, 18, 6);
      ctx.fill();
      ctx.strokeStyle = "#0a0f18";
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = "#0a0f18";
      ctx.fillText(chip, sk.x, cy);
      ctx.restore();
    }
  }
  if (sk.leafStamp > 0) drawMapleLeaf(sk.x, sk.y - sk.r - 6, 12, "#c1121f");
  if (sk.stunned > 0) {
    ctx.fillStyle = "#ffd166";
    ctx.font = "bold 14px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("* *", sk.x, sk.y - sk.r - 28);
    ctx.textAlign = "left";
  }
}

function drawSkater(sk) { drawPlasticPlayer(sk, { big: false }); }

function drawGoalie(g) {
  const isCan = g.team === "CANADA";
  const facing = isCan ? 1 : -1;
  const s = 1.25;
  ctx.save();
  ctx.translate(g.x, g.y);
  ctx.scale(facing * s, s);

  ctx.fillStyle = "rgba(15,23,42,0.3)";
  ctx.beginPath();
  ctx.ellipse(0, 10, 16, 6, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = isCan ? "#7f1d1d" : "#1e3a8a";
  ctx.strokeStyle = "#0a0f18";
  ctx.lineWidth = 2;
  roundRectPath(-14, 2, 12, 18, 3); ctx.fill(); ctx.stroke();
  roundRectPath(2, 2, 12, 18, 3); ctx.fill(); ctx.stroke();

  ctx.fillStyle = isCan ? "#c81e1e" : "#f8fafc";
  roundRectPath(-13, -14, 26, 20, 5);
  ctx.fill(); ctx.stroke();

  if (isCan) drawMapleLeaf(0, -6, 6, "#fff");
  else drawStar(0, -6, 5, "#1d4e89");

  // 1970s face + hair (mask gag optional — still show face/hair)
  drawSeventiesFace(1, isCan);
  drawSeventiesHair(1, g.hair || "mullet", isCan);

  if (isCan && g.phone) {
    ctx.fillStyle = "#111";
    ctx.fillRect(10, -10, 10, 16);
    ctx.fillStyle = "#4ade80";
    ctx.fillRect(11, -8, 8, 10);
    ctx.fillStyle = "#94a3b8";
    ctx.fillRect(13, 4, 4, 1);
    ctx.strokeStyle = "#c81e1e";
    ctx.lineWidth = 4;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(8, -2); ctx.lineTo(14, -2);
    ctx.stroke();
    ctx.fillStyle = "#fff";
    ctx.font = "bold 8px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("...", 0, -34);
  }

  if (!isCan && g.arms >= 4) {
    ctx.strokeStyle = "#93c5fd";
    ctx.lineWidth = 4;
    ctx.lineCap = "round";
    const arms = [[8,-8,22,-18],[8,0,24,-4],[8,4,24,8],[8,10,20,18]];
    for (const [ax, ay, bx, by] of arms) {
      ctx.beginPath();
      ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
      ctx.fillStyle = "#dc2626";
      ctx.beginPath();
      ctx.arc(bx, by, 3.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = "#1d4e89";
    ctx.font = "bold 9px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("x4", 0, 28);
  }
  ctx.restore();

  if (g.name) {
    ctx.font = "bold 10px sans-serif";
    ctx.textAlign = "center";
    ctx.fillStyle = "rgba(10,14,22,0.7)";
    const lab = (g.shortName || g.name).toUpperCase();
    const tw = ctx.measureText(lab).width + 8;
    roundRectPath(g.x - tw / 2, g.y + 34, tw, 13, 3);
    ctx.fill();
    ctx.fillStyle = isCan ? "#fecaca" : "#bfdbfe";
    ctx.fillText(lab, g.x, g.y + 43);
  }

  if (isCan && g.phone && Math.sin(state.phoneCheck * 1.25) > 0.7) {
    ctx.fillStyle = "#ff8fa3";
    ctx.font = "bold 10px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("on phone", g.x, g.y - 42);
    ctx.textAlign = "left";
  }
}

function drawPuck() {
  if (!puck) return;
  const t = performance.now() / 1000;
  const pulse = 1 + Math.sin(t * 6) * 0.12;

  // bright halo / glow so puck never lost on scratched ice
  const halo = ctx.createRadialGradient(puck.x, puck.y, puck.r * 0.2, puck.x, puck.y, puck.r * 3.2 * pulse);
  halo.addColorStop(0, "rgba(255,230,120,0.75)");
  halo.addColorStop(0.35, "rgba(255,180,40,0.35)");
  halo.addColorStop(0.7, "rgba(255,80,40,0.12)");
  halo.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(puck.x, puck.y, puck.r * 3.2 * pulse, 0, Math.PI * 2);
  ctx.fill();

  for (let i = 0; i < state.puckTrail.length; i++) {
    const tr = state.puckTrail[i];
    const a = (i + 1) / (state.puckTrail.length + 1) * 0.4;
    ctx.globalAlpha = a;
    ctx.fillStyle = "#111";
    ctx.beginPath();
    ctx.ellipse(tr.x, tr.y, puck.r * 0.95, puck.r * 0.55, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  ctx.fillStyle = "rgba(0,0,0,0.4)";
  ctx.beginPath();
  ctx.ellipse(puck.x + 3, puck.y + 5, puck.r * 1.15, puck.r * 0.5, 0, 0, Math.PI * 2);
  ctx.fill();

  const pg = ctx.createRadialGradient(puck.x - 3, puck.y - 3, 1, puck.x, puck.y, puck.r);
  pg.addColorStop(0, "#52525b");
  pg.addColorStop(0.45, "#27272a");
  pg.addColorStop(1, "#09090b");
  ctx.fillStyle = pg;
  ctx.beginPath();
  ctx.ellipse(puck.x, puck.y, puck.r, puck.r * 0.72, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#fbbf24";
  ctx.lineWidth = 2.5;
  ctx.stroke();
  ctx.strokeStyle = "rgba(255,255,255,0.45)";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.ellipse(puck.x, puck.y - 2, puck.r * 0.65, puck.r * 0.32, 0, Math.PI, Math.PI * 2);
  ctx.stroke();

  // pulsing ring
  ctx.strokeStyle = "rgba(255,209,102," + (0.55 + Math.sin(t * 8) * 0.25) + ")";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(puck.x, puck.y, puck.r + 6 + Math.sin(t * 5) * 3, 0, Math.PI * 2);
  ctx.stroke();

  // off-near-boards spotlight / arrow
  const margin = 55;
  const nearL = puck.x < RINK.x + margin;
  const nearR = puck.x > RINK.x + RINK.w - margin;
  const nearT = puck.y < RINK.y + margin;
  const nearB = puck.y > RINK.y + RINK.h - margin;
  if ((nearL || nearR || nearT || nearB) && !puck.owner) {
    ctx.save();
    ctx.fillStyle = "rgba(255,209,102,0.9)";
    ctx.strokeStyle = "#0a0f18";
    ctx.lineWidth = 2;
    let ax = puck.x, ay = puck.y - puck.r - 22;
    if (nearT) ay = puck.y + puck.r + 28;
    ctx.beginPath();
    ctx.moveTo(ax, ay - 10);
    ctx.lineTo(ax + 9, ay + 4);
    ctx.lineTo(ax - 9, ay + 4);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // spotlight cone
    ctx.fillStyle = "rgba(255,240,150,0.18)";
    ctx.beginPath();
    ctx.moveTo(puck.x, puck.y);
    ctx.arc(puck.x, puck.y, 48, -Math.PI / 2 - 0.5, -Math.PI / 2 + 0.5);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
}

let audioCtx = null;
function ensureAudio() {
  if (audioCtx) return audioCtx;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch (_) { audioCtx = null; }
  return audioCtx;
}

function toneBurst(freq, dur, type, gainVal) {
  const ac = ensureAudio();
  if (!ac) return;
  try {
    if (ac.state === "suspended") ac.resume();
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type || "sawtooth";
    o.frequency.value = freq;
    g.gain.value = gainVal == null ? 0.04 : gainVal;
    o.connect(g); g.connect(ac.destination);
    const now = ac.currentTime;
    g.gain.setValueAtTime(g.gain.value, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    o.start(now); o.stop(now + dur + 0.02);
  } catch (_) {}
}

function noiseBurst(dur, gainVal) {
  const ac = ensureAudio();
  if (!ac) return;
  try {
    if (ac.state === "suspended") ac.resume();
    const len = Math.max(1, (ac.sampleRate * dur) | 0);
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = ac.createBufferSource();
    const g = ac.createGain();
    src.buffer = buf;
    g.gain.value = gainVal == null ? 0.05 : gainVal;
    src.connect(g); g.connect(ac.destination);
    src.start();
  } catch (_) {}
}

function crowdBoo() {
  noiseBurst(0.45, 0.07);
  toneBurst(90, 0.35, "sawtooth", 0.03);
  toneBurst(70, 0.4, "triangle", 0.025);
  floatText(RINK.x + RINK.w / 2 + rand(-80, 80), RINK.y + 70 + rand(0, 40), pick(["BOOOO", "BOOO!", "GROAN", "OH NO"]), "#ff6b6b", 1.4);
}

function crowdCheerHope() {

  floatText(RINK.x + RINK.w / 2 + rand(-60, 60), RINK.y + 64, pick(["YAAY?", "GO?", "HOPE!", "…yay?"]), "#a7f3d0", 1.1);
  // hopeful cheer dies into boos shortly

function crowdGroan() {

function pickAnnouncerVoice() {
  try {
    const voices = speechSynthesis.getVoices() || [];
    const fr = voices.find((v) => /fr[-_]?CA|French.*Canada|Québec|Quebec/i.test(v.name + v.lang));
    if (fr) return fr;
    const anyFr = voices.find((v) => /^fr/i.test(v.lang) || /French/i.test(v.name));
    return anyFr || null;
  } catch (_) { return null; }
}

function announce(kind, overrideText) {
  const pool = ANNOUNCER_LINES[kind] || ANNOUNCER_LINES.faceoff;
  const text = overrideText || pick(pool);
  state.announcerCaption = { text, life: 3.2, max: 3.2 };
  try {
    if (!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.12;
    u.pitch = 1.25;
    u.volume = 1;
    const v = pickAnnouncerVoice();
    if (v) u.voice = v;
    // theatrical nasal outrage even on English voices
    u.lang = (v && v.lang) ? v.lang : "fr-CA";
    speechSynthesis.speak(u);
  } catch (_) {}
}

function getActionHint() {
  if (state.phase !== "play" || !player || !puck) return "";

    return "Fight!";
  }
  if (puck.owner === player) return "Shoot · Drag to move · Fight if near foe";
  if (puck.owner && puck.owner.team !== player.team) return "Chase it · Fight for the puck";
  return "Skate to the puck · Chase it";
}

function assignRosterNames() {
  const canPool = CANADA_SKATER_NAMES.slice();
  const usaPool = USA_SKATER_NAMES.slice();
  function take(pool, team) {
    if (!pool.length) return team === "CANADA" ? "Guy" : "Chad";
    const i = (Math.random() * pool.length) | 0;
    return pool.splice(i, 1)[0];
  }
  const canNums = [19, 27, 4, 9, 1];
  const usaNums = [88, 16, 7, 22, 31];
  let ci = 0, ui = 0;
  function tag(sk) {
    if (!sk) return;
    if (sk.team === "CANADA") {
      sk.name = take(canPool, "CANADA");
      // short tag: first token or quoted nickname
      const nick = sk.name.match(/'([^']+)'/);
      sk.shortName = nick ? nick[1] : sk.name.split(/\s+/)[0];
      sk.num = canNums[ci++ % canNums.length];
    } else {
      sk.name = take(usaPool, "USA");
      sk.shortName = sk.name;
      sk.num = usaNums[ui++ % usaNums.length];
    }
  }
  tag(player); tag(teammate);
  for (const e of enemies) tag(e);
  if (goalieCan) {
    goalieCan.name = take(canPool, "CANADA");
    const nick = goalieCan.name.match(/'([^']+)'/);
    goalieCan.shortName = nick ? nick[1] : goalieCan.name.split(/\s+/)[0];
    goalieCan.num = 1;
  }
  if (goalieUsa) {
    goalieUsa.name = take(usaPool, "USA");
    goalieUsa.shortName = goalieUsa.name;
    goalieUsa.num = 31;
  }
  // Jumbotron flash of your skater
  if (player && player.name) {
    floatText(RINK.x + RINK.w / 2, RINK.y + 86, "NOW ON ICE: " + player.name, player.team === "CANADA" ? "#fecaca" : "#bfdbfe", 2.4);
  }
}

function spawnZamboni() {
  const fromLeft = Math.random() < 0.5;
  const y = RINK.y + RINK.h * rand(0.28, 0.72);
  state.zamboni = {
    x: fromLeft ? RINK.x - 80 : RINK.x + RINK.w + 80,
    y,
    vx: fromLeft ? rand(140, 190) : -rand(140, 190),
    vy: rand(-12, 12),
    w: 92,
    h: 48,
    life: 0,
    maxLife: rand(5.5, 7.5),
    hit: new Set(),
  };
  floatText(RINK.x + RINK.w / 2, RINK.y + 56, pick(ZAMBONI_LINES), "#a7f3d0", 2.2);
  announce("zamboni");
}

function updateZamboni(dt) {
  // rebuild scratches slowly
  if (state.iceFresh > 0) state.iceFresh = Math.max(0, state.iceFresh - dt * 0.07);

  if (!state.zamboni) {
    state.zamboniCooldown -= dt;
    if (state.zamboniCooldown <= 0 && state.timeLeft > 12 && state.timeLeft < MATCH_SECONDS - 8) {
      spawnZamboni();
      state.zamboniCooldown = rand(25, 45);
    }
    return;
  }
  const z = state.zamboni;
  z.life += dt;
  z.x += z.vx * dt;
  z.y += z.vy * dt;
  z.y = clamp(z.y, RINK.y + 40, RINK.y + RINK.h - 40);

  // flood ice globally a bit + wet trail
  state.iceFresh = Math.min(1, state.iceFresh + dt * 0.55);

  // bump players
  const bodies = [player, teammate, ...(enemies || [])].filter(Boolean);
  for (const sk of bodies) {
    if (!sk) continue;
    const dx = sk.x - z.x;
    const dy = sk.y - z.y;
    if (Math.abs(dx) < z.w * 0.55 && Math.abs(dy) < z.h * 0.55) {
      const id = sk.name || (sk.isPlayer ? "P" : "x") + sk.x.toFixed(0);
      if (!z.hit.has(id)) {
        z.hit.add(id);
        const push = Math.sign(z.vx || 1) * rand(220, 340);
        sk.vx += push;
        sk.vy += rand(-120, 120);
        sk.stunned = Math.max(sk.stunned, rand(0.45, 0.85));
        floatText(sk.x, sk.y - 30, pick(["oof", "SORRY!", "bonk", "excusez!"]), "#fff", 0.9);
        if (sk.hasPuck || (puck && puck.owner === sk)) {
          if (puck.owner) puck.owner.hasPuck = false;
          puck.owner = null;
          puck.vx = push * 0.4;
          puck.vy = rand(-80, 80);
        }
      }
    }
  }
  // bump puck
  if (puck && Math.abs(puck.x - z.x) < z.w * 0.55 && Math.abs(puck.y - z.y) < z.h * 0.5) {
    if (puck.owner) { puck.owner.hasPuck = false; puck.owner = null; }
    puck.vx += Math.sign(z.vx || 1) * 180;
    puck.vy += rand(-100, 100);
  }

  const off = z.x < RINK.x - 120 || z.x > RINK.x + RINK.w + 120 || z.life > z.maxLife;
  if (off) {
    state.iceFresh = Math.max(state.iceFresh, 0.85);
    state.zamboni = null;
  }
}

function drawZamboni() {
  const z = state.zamboni;
  if (!z) return;
  ctx.save();
  ctx.translate(z.x, z.y);

  // blade

  ctx.font = "bold 11px sans-serif";

  ctx.restore();
}

let _lastPuckOwner = null;

function drawFightOverlay() {

  drawPlasticPlayer({ x: f.opponent.x + 8, y: f.opponent.y, r: 22, team: f.opponent.team, angle: Math.PI - 0.3, facing: -1, isPlayer: false, leafStamp: 0, stunned: 0 }, { big: true });

    ctx.fillStyle = "#ffd166";
    ctx.font = "bold 36px sans-serif";
    ctx.textAlign = "center";
    ctx.strokeStyle = "#0a0f18";
    ctx.lineWidth = 4;
    ctx.strokeText("POW!", px, py);
    ctx.fillText("POW!", px, py);
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2 + performance.now() / 120;
      const rr = 28 + (i % 2) * 10;
      drawStar(px + Math.cos(a) * rr, py + 8 + Math.sin(a) * rr, 6, i % 2 ? "#fff" : "#ffd166");
    }
    ctx.textAlign = "left";
  }

  if ((f.stage === "ko" || f.stage === "wake" || f.stage === "ref") && !f.playerWins) {
    drawMapleLeaf(player.x, player.y - 36, 18, "#c1121f");
    ctx.fillStyle = "#fff";
    ctx.font = "bold 22px sans-serif";
    ctx.textAlign = "center";
    ctx.strokeStyle = "#0a0f18";
    ctx.lineWidth = 3;
    ctx.strokeText("KO", player.x, player.y + 6);
    ctx.fillText("KO", player.x, player.y + 6);
    ctx.textAlign = "left";
  }

  if (f.stage === "ref") {
    const rx = RINK.x + RINK.w / 2, ry = RINK.y + 80;
    ctx.fillStyle = "#111";
    ctx.beginPath();
    ctx.arc(rx, ry, 16, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.fillRect(rx - 10, ry - 6, 20, 8);
    ctx.strokeStyle = "#111";
    for (let i = -8; i <= 8; i += 4) {
      ctx.beginPath();
      ctx.moveTo(rx + i, ry - 6);
      ctx.lineTo(rx + i, ry + 2);
      ctx.stroke();
    }
    ctx.font = "bold 12px sans-serif";
    ctx.textAlign = "center";
    ctx.fillStyle = "#fff";
    ctx.fillText("REF", rx, ry + 30);
    ctx.fillStyle = "#ffd166";
    ctx.fillText("(decorative penalty)", rx, ry + 46);
