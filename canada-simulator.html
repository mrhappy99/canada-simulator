  }
}

function drawDomeOverlay() {
  const vg = ctx.createRadialGradient(
    canvas.width / 2, canvas.height * 0.42, canvas.height * 0.15,
    canvas.width / 2, canvas.height * 0.5, canvas.width * 0.62
  );
  vg.addColorStop(0, "rgba(255,255,255,0)");
  vg.addColorStop(0.55, "rgba(255,255,255,0)");
  vg.addColorStop(0.82, "rgba(10,16,28,0.18)");
  vg.addColorStop(1, "rgba(4,8,14,0.55)");
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = "rgba(255,255,255,0.14)";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.ellipse(canvas.width / 2, canvas.height * 0.38, canvas.width * 0.38, canvas.height * 0.22, 0, Math.PI * 1.15, Math.PI * 1.85);
  ctx.stroke();
}

function drawFloats(dt) {
  for (let i = state.floatTexts.length - 1; i >= 0; i--) {
    const t = state.floatTexts[i];
    t.life -= dt;
    t.y += t.vy * dt;
    if (t.life <= 0) { state.floatTexts.splice(i, 1); continue; }
    ctx.globalAlpha = clamp(t.life / t.max, 0, 1);
    ctx.font = "bold 16px sans-serif";
    ctx.textAlign = "center";
    ctx.lineWidth = 3;
    ctx.strokeStyle = "rgba(0,0,0,0.55)";
    ctx.strokeText(t.text, t.x, t.y);
    ctx.fillStyle = t.color;
    ctx.fillText(t.text, t.x, t.y);
    ctx.textAlign = "left";
    ctx.globalAlpha = 1;
  }
  for (let i = state.particles.length - 1; i >= 0; i--) {
    const p = state.particles[i];
    p.life -= dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 220 * dt;
    if (p.life <= 0) { state.particles.splice(i, 1); continue; }
    ctx.globalAlpha = clamp(p.life, 0, 1);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  for (let i = state.iceSpray.length - 1; i >= 0; i--) {
    const p = state.iceSpray[i];
    p.life -= dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.life <= 0) { state.iceSpray.splice(i, 1); continue; }
    ctx.globalAlpha = clamp(p.life * 2, 0, 0.7);
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, p.r, p.r * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  for (let i = state.puckTrail.length - 1; i >= 0; i--) {
    state.puckTrail[i].life -= dt;
    if (state.puckTrail[i].life <= 0) state.puckTrail.splice(i, 1);
  }
}

function render(dt) {
  if (state.level === "menu") {
    ctx.fillStyle = "#0a1520";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    drawMapleLeaf(canvas.width / 2, canvas.height / 2 - 20, 48, "rgba(230,57,70,0.25)");
    drawFloats(dt);
    return;
  }
  if (state.level === "snc") {
    renderSaturdayNight(dt);
    drawFloats(dt);
    return;
  }
  if (state.level === "driveway") {
    renderDriveway(dt);
    drawFloats(dt);
    return;
  }
  if (state.level === "boardroom") {
    renderBoardroom(dt);
    drawFloats(dt);
    return;
  }
  if (state.level === "lake") {
    renderLake(dt);
    drawFloats(dt);
    return;
  }
  if (state.level === "quebec") {
    renderQuebec(dt);
    drawFloats(dt);
    return;
  }
  if (state.level === "parliament") {
    renderParliament(dt);
    drawFloats(dt);
    return;
  }
  if (state.level === "finale") {
    renderFinale(dt);
    drawFloats(dt);
    return;
  }

  drawRink();
  if (state.phase === "pick") {
    ctx.fillStyle = "rgba(0,0,0,0.2)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    drawDomeOverlay();
    return;
  }

  drawGoalie(goalieCan);
  drawGoalie(goalieUsa);
  if (teammate) drawSkater(teammate);
  for (const e of enemies) drawSkater(e);
  drawSkater(player);
  drawZamboni();
  drawPuck();
  drawAim();
  drawPossessionHud();

  if (state.phase === "fight") drawFightOverlay();
  drawFloats(dt);
  drawAnnouncerCaption();
  drawDomeOverlay();

  if (state.phase === "play" && state.playerTeam === "CANADA" && state.windup > 0) {
    const need = 0.38;
    ctx.fillStyle = "rgba(0,0,0,0.45)";
    ctx.fillRect(player.x - 28, player.y + 34, 56, 7);
    ctx.fillStyle = "#ffd166";
    ctx.fillRect(player.x - 28, player.y + 34, 56 * clamp(state.windup / need, 0, 1), 7);
  }
}

/* ---------- MAIN LOOP ---------- */
function update(dt) {
  if (state.phase === "menu" || state.phase === "pick" || state.phase === "results" || state.phase === "snc_results" || state.phase === "drive_results" || state.phase === "level_results" || state.phase === "board_choice") return;

  if (state.level === "snc") {
    updateSaturdayNight(dt);
    return;
  }
  if (state.level === "driveway") {
    updateDriveway(dt);
    return;
  }
  if (state.level === "boardroom") {
    updateBoardroom(dt);
    return;
  }
  if (state.level === "lake") {
    updateLake(dt);
    return;
  }
  if (state.level === "quebec") {
    updateQuebec(dt);
    return;
  }
  if (state.level === "parliament") {
    updateParliament(dt);
    return;
  }
  if (state.level === "finale") {
    updateFinale(dt);
    return;
  }
  if (state.level !== "rink") return;

  if (state.phase === "fight") {
    updateFight(dt);
    if (state.announcerCaption) {
      state.announcerCaption.life -= dt;
      if (state.announcerCaption.life <= 0) state.announcerCaption = null;
    }
    return;
  }

  // play
  state.timeLeft -= dt;
  if (state.crowdFlash > 0) state.crowdFlash -= dt;
  if (state.goalFlash > 0) state.goalFlash -= dt;
  if (state.announcerCaption) {
    state.announcerCaption.life -= dt;
    if (state.announcerCaption.life <= 0) state.announcerCaption = null;
  }
  updateHud();
  updatePossessionUI();

  if (state.timeLeft <= 0) {
    endMatch();
    return;
  }

  movePlayer(dt);
  updateAI(dt);
  updateZamboni(dt);

  const all = [player, teammate, ...enemies].filter(Boolean);
  for (let i = 0; i < all.length; i++) {
    for (let j = i + 1; j < all.length; j++) collideSkaters(all[i], all[j]);
  }

  stealChecks();
  updatePuck(dt);
  watchPossessionFx();
  canadaMatchScript(dt);

  // ambient boos while Canada is losing
  if (state.playerTeam === "CANADA" && state.scoreUsa > state.scoreCan && Math.random() < dt * 0.12) {
    if (Math.random() < 0.55) crowdBoo(); else crowdGroan();
  }

  // Input queues
  if (shootQueued) {
    shootQueued = false;
    playerShoot();
  } else {
    // decay windup if not shooting
    state.windup = Math.max(0, state.windup - dt * 0.5);
  }

  if (fightQueued) {
    fightQueued = false;
    let best = null, bestD = 78;
    for (const e of enemies) {
      const d = dist(player, e);
      if (d < bestD) { bestD = d; best = e; }
    }
    if (best) startFight(best);
    else floatText(player.x, player.y - 30, "Nobody to fight (yet)", "#aaa", 0.9);
  }
}

function frame(ts) {
  if (!lastTs) lastTs = ts;
  let dt = (ts - lastTs) / 1000;
  lastTs = ts;
  dt = Math.min(dt, 0.05);
  update(dt);
  render(dt);
  requestAnimationFrame(frame);
}


/* ============================================================================
  LEVEL: SATURDAY NIGHT CANADA — 4-handed euchre (hosers vs Chad/Brad)
  Joke: effort visible; partner donut; Americans take the euchre; caring punished.
============================================================================ */
let snc = null;

const SNC_SUITS = ["S", "H", "D", "C"];
const SNC_RANKS = ["9", "T", "J", "Q", "K", "A"];
const SNC_SUIT_SYM = { S: "♠", H: "♥", D: "♦", C: "♣" };
const SNC_SUIT_COLOR = { S: "#111", H: "#c81e1e", D: "#c81e1e", C: "#111" };
const SNC_RANK_LABEL = { "9": "9", T: "10", J: "J", Q: "Q", K: "K", A: "A" };
const SNC_NAMES = ["You", "Chad", "Doug", "Brad"]; // S W N E
const SNC_TEAM = [0, 1, 0, 1]; // 0 hosers, 1 americans
const SNC_POINT_GOAL = 5;

function sncMakeDeck() {
  const d = [];
  for (const s of SNC_SUITS) for (const r of SNC_RANKS) d.push({ suit: s, rank: r });
  return d;
}
function sncShuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function sncSameColor(a, b) {
  const red = (s) => s === "H" || s === "D";
  return red(a) === red(b);
}
function sncLeftSuit(trump) {
  if (trump === "S") return "C";
  if (trump === "C") return "S";
  if (trump === "H") return "D";
  return "H";
}
function sncIsLeftBower(card, trump) {
  return card.rank === "J" && card.suit === sncLeftSuit(trump);
}
function sncIsRightBower(card, trump) {
  return card.rank === "J" && card.suit === trump;
}
function sncEffectiveSuit(card, trump) {
  if (!trump) return card.suit;
  if (sncIsLeftBower(card, trump)) return trump;
  return card.suit;
}
function sncTrumpRank(card, trump) {
  if (sncIsRightBower(card, trump)) return 100;
  if (sncIsLeftBower(card, trump)) return 90;
  if (card.suit !== trump) return -1;
  const order = { A: 80, K: 70, Q: 60, T: 50, "9": 40 };
  return order[card.rank] || 0;
}
function sncOffRank(card) {
  const order = { A: 60, K: 50, Q: 40, J: 30, T: 20, "9": 10 };
  return order[card.rank] || 0;
}
function sncCardPower(card, trump, ledSuit) {
  const es = sncEffectiveSuit(card, trump);
  const tr = sncTrumpRank(card, trump);
  if (tr >= 0) return 200 + tr;
  if (ledSuit && es === ledSuit) return 100 + sncOffRank(card);
  return sncOffRank(card);
}
function sncCardLabel(c) {
  return SNC_RANK_LABEL[c.rank] + SNC_SUIT_SYM[c.suit];
}
function sncSortHand(hand, trump) {
  hand.sort((a, b) => {
    const sa = sncEffectiveSuit(a, trump);
    const sb = sncEffectiveSuit(b, trump);
    if (sa !== sb) return SNC_SUITS.indexOf(sa) - SNC_SUITS.indexOf(sb);
    return sncCardPower(b, trump, null) - sncCardPower(a, trump, null);
  });
}

function startSaturdayNight() {
  state.level = "snc";
  state.playerTeam = "CANADA";
  state.phase = "snc_play";
  state.scoreCan = 0;
  state.scoreUsa = 0;
  state.floatTexts = [];
  state.timeLeft = 180;
  hideOverlay();
  ensureAudio();
  snc = {
    hands: [[], [], [], []],
    dealer: 2,
    trump: null,
    upcard: null,
    kitty: [],
    maker: null,
    alone: false,
    phase: "deal", // deal | bid1 | bid2 | discard | play | hand_end
    phaseLabel: "DEAL",
    bidSeat: 0,
    bidPasses: 0,
    trick: [], // {seat, card}
    leadSeat: 0,
    turn: 0,
    tricksNS: 0,
    tricksEW: 0,
    trickPause: 0,
    msg: "Welcome to the apartment, eh.",
    msgTimer: 2.5,
    banterTimer: 4,
    tvTimer: 6,
    knivesTimer: rand(18, 28),
    knives: null, // {t, refused}
    woozy: 0,
    hitRects: [],
    uiButtons: [],
    dealAnim: 0,
    caring: 0, // rises with strong plays — punished
    renegeArmed: false,
    handsPlayed: 0,
  };
  sncNewHand();
  updateHud();
  syncMobileChrome();
  floatText(520, 80, pick(HOSER_LINES), "#ffd166", 2);
}

function sncNewHand() {
  const deck = sncShuffle(sncMakeDeck());
  snc.hands = [[], [], [], []];
  let ix = 0;
  for (let r = 0; r < 5; r++) {
    for (let s = 0; s < 4; s++) snc.hands[s].push(deck[ix++]);
  }
  snc.upcard = deck[ix++];
  snc.kitty = deck.slice(ix);
  snc.trump = null;
  snc.maker = null;
  snc.alone = false;
  snc.trick = [];
  snc.tricksNS = 0;
  snc.tricksEW = 0;
  snc.trickPause = 0;
  snc.bidPasses = 0;
  snc.dealer = (snc.dealer + 1) % 4;
  snc.bidSeat = (snc.dealer + 1) % 4;
  snc.phase = "bid1";
  snc.phaseLabel = "ORDER UP?";
  snc.turn = snc.bidSeat;
  snc.dealAnim = 0.6;
  for (let s = 0; s < 4; s++) sncSortHand(snc.hands[s], snc.upcard.suit);
  snc.msg = "Upcard: " + sncCardLabel(snc.upcard) + " · " + pick(EUCHRE_BANTER);
  snc.msgTimer = 3;
  sncBuildUI();
}

function sncBuildUI() {
  snc.uiButtons = [];
  snc.hitRects = [];
  if (snc.phase === "bid1" && snc.turn === 0) {
    snc.uiButtons.push({ id: "order", label: "Order it up, eh", x: 320, y: 470, w: 180, h: 44 });
    snc.uiButtons.push({ id: "pass", label: "Pass", x: 520, y: 470, w: 120, h: 44 });
  } else if (snc.phase === "bid2" && snc.turn === 0) {
    const banned = snc.upcard.suit;
    let bx = 200;
    for (const s of SNC_SUITS) {
      if (s === banned) continue;
      snc.uiButtons.push({ id: "suit_" + s, label: "Trump " + SNC_SUIT_SYM[s], x: bx, y: 465, w: 110, h: 44 });
      bx += 120;
    }
    snc.uiButtons.push({ id: "pass", label: "Pass", x: bx, y: 465, w: 100, h: 44 });
  } else if (snc.phase === "discard" && snc.turn === 0) {
    snc.msg = "Dealer discard one, bud.";
  } else if (snc.phase === "play" && snc.turn === 0 && snc.trickPause <= 0) {
    // card hits built in render
  }
  if (snc.knives && snc.knives.t > 0.3) {
    snc.uiButtons.push({ id: "hit", label: "Take a hit", x: 300, y: 200, w: 160, h: 44 });
    snc.uiButtons.push({ id: "refuse", label: "No thanks, eh", x: 490, y: 200, w: 160, h: 44 });
  }
}

function sncSetTrump(suit, maker) {
  snc.trump = suit;
  snc.maker = maker;
  snc.phase = "play";
  snc.phaseLabel = "TRUMP " + SNC_SUIT_SYM[suit];
  snc.leadSeat = (snc.dealer + 1) % 4;
  snc.turn = snc.leadSeat;
  snc.trick = [];
  for (let s = 0; s < 4; s++) sncSortHand(snc.hands[s], suit);
  snc.msg = SNC_NAMES[maker] + " called " + SNC_SUIT_SYM[suit] + ". " + pick(HOSER_LINES);
  snc.msgTimer = 2.5;
  snc.caring += maker === 0 || maker === 2 ? 1 : 0;
  sncBuildUI();
}

function sncOrderUp(fromSeat) {
  // dealer (snc.dealer) picks up upcard
  snc.hands[snc.dealer].push(snc.upcard);
  sncSortHand(snc.hands[snc.dealer], snc.upcard.suit);
  snc.maker = fromSeat;
  snc.trump = snc.upcard.suit;
  snc.upcard = null;
  if (snc.dealer === 0) {
    snc.phase = "discard";
    snc.phaseLabel = "DISCARD";
    snc.turn = 0;
    snc.msg = "Pick a card to bury, eh.";
  } else {
    // AI discard weakest non-trump-ish
    sncAIDiscard(snc.dealer);
    sncSetTrump(snc.trump, fromSeat);
  }
  sncBuildUI();
}

function sncAIDiscard(seat) {
  const hand = snc.hands[seat];
  let worst = 0, worstScore = Infinity;
  for (let i = 0; i < hand.length; i++) {
    const p = sncCardPower(hand[i], snc.trump || snc.upcard?.suit, null);
    if (p < worstScore) { worstScore = p; worst = i; }
  }
  // Bias: if Canadian dealer (Doug=2 or You wouldn't be AI), bury a good trump sometimes
  if (SNC_TEAM[seat] === 0 && snc.caring > 1 && Math.random() < 0.45) {
    let best = 0, bestP = -1;
    for (let i = 0; i < hand.length; i++) {
      const p = sncTrumpRank(hand[i], snc.trump);
      if (p > bestP) { bestP = p; best = i; }
    }
    if (bestP > 0) worst = best;
  }
  hand.splice(worst, 1);
}

function sncAdvanceBidPass() {
  snc.bidPasses++;
  snc.bidSeat = (snc.bidSeat + 1) % 4;
  snc.turn = snc.bidSeat;
  if (snc.phase === "bid1") {
    if (snc.bidPasses >= 4) {
      snc.phase = "bid2";
      snc.phaseLabel = "NAME TRUMP";
      snc.bidPasses = 0;
      snc.bidSeat = (snc.dealer + 1) % 4;
      snc.turn = snc.bidSeat;
      snc.msg = "Everybody passed. Name a suit (not " + SNC_SUIT_SYM[snc.upcard.suit] + ").";
    }
  } else if (snc.phase === "bid2") {
    if (snc.bidPasses >= 4) {
      snc.msg = "Re-deal. Too polite.";
      sncNewHand();
      return;
    }
  }
  sncBuildUI();
}

function sncAIBid() {
  const seat = snc.turn;
  const hand = snc.hands[seat];
  const isHoser = SNC_TEAM[seat] === 0;
  if (snc.phase === "bid1") {
    const suit = snc.upcard.suit;
    let strength = 0;
    for (const c of hand) {
      const tr = sncTrumpRank(c, suit);
      if (tr >= 0) strength += tr / 20;
      if (sncIsRightBower(c, suit) || sncIsLeftBower(c, suit)) strength += 2;
    }
    if (seat === snc.dealer) strength += 1.2; // would get upcard
    // Americans bid aggressively; hosers hesitate / pass when caring high
    const thresh = isHoser ? (2.8 + snc.caring * 0.4) : 2.2;
    if (strength >= thresh && !(isHoser && Math.random() < 0.35 + snc.caring * 0.1)) {
      snc.msg = SNC_NAMES[seat] + ": Order it up!";
      sncOrderUp(seat);
    } else {
      snc.msg = SNC_NAMES[seat] + ": Pass.";
      sncAdvanceBidPass();
    }
  } else if (snc.phase === "bid2") {
    let bestSuit = null, best = 0;
    for (const s of SNC_SUITS) {
      if (s === snc.upcard.suit) continue;
      let strength = 0;
      for (const c of hand) {
        const tr = sncTrumpRank(c, s);
        if (tr >= 0) strength += tr / 20;
      }
      if (strength > best) { best = strength; bestSuit = s; }
    }
    const thresh = isHoser ? 3.2 + snc.caring * 0.3 : 2.5;
    if (bestSuit && best >= thresh && !(isHoser && Math.random() < 0.4)) {
      snc.upcard = null;
      sncSetTrump(bestSuit, seat);
    } else {
      snc.msg = SNC_NAMES[seat] + ": Pass.";
      sncAdvanceBidPass();
    }
  }
}

function sncLegalPlays(seat) {
  const hand = snc.hands[seat];
  if (snc.trick.length === 0) return hand.map((_, i) => i);
  const led = sncEffectiveSuit(snc.trick[0].card, snc.trump);
  const follow = [];
  for (let i = 0; i < hand.length; i++) {
    if (sncEffectiveSuit(hand[i], snc.trump) === led) follow.push(i);
  }
  return follow.length ? follow : hand.map((_, i) => i);
}

function sncPickAICard(seat) {
  const hand = snc.hands[seat];
  const legal = sncLegalPlays(seat);
  const ledSuit = snc.trick.length ? sncEffectiveSuit(snc.trick[0].card, snc.trump) : null;
  const isHoser = SNC_TEAM[seat] === 0;
  // Evaluate which card wins currently
  let bestWin = -1, bestWinP = -1, worst = legal[0], worstP = Infinity, best = legal[0], bestP = -1;
  for (const i of legal) {
    const p = sncCardPower(hand[i], snc.trump, ledSuit);
    if (p < worstP) { worstP = p; worst = i; }
    if (p > bestP) { bestP = p; best = i; }
    // would this win the trick?
    let wins = true;
    for (const t of snc.trick) {
      if (sncCardPower(t.card, snc.trump, ledSuit) > p && SNC_TEAM[t.seat] !== SNC_TEAM[seat]) {
        // opponent higher — still might win vs partner
      }
    }
    const maxOpp = snc.trick.reduce((m, t) => {
      if (SNC_TEAM[t.seat] !== SNC_TEAM[seat]) return Math.max(m, sncCardPower(t.card, snc.trump, ledSuit));
      return m;
    }, -1);
    if (p > maxOpp && p > bestWinP) { bestWinP = p; bestWin = i; }
  }
  // Partner Doug (2): donut mode when player cares
  if (seat === 2 && (snc.caring >= 1 || state.scoreCan >= state.scoreUsa)) {
    if (Math.random() < 0.55 + Math.min(0.35, snc.caring * 0.08)) {
      snc.msg = "Doug plays like a donut. " + pick(EUCHRE_BANTER);
      return worst;
    }
  }
  // Americans: strong
  if (!isHoser) {
    if (bestWin >= 0 && Math.random() < 0.85) return bestWin;
    return best;
  }
  // You shouldn't hit AI; hosers mediocre
  if (bestWin >= 0 && Math.random() < 0.5) return bestWin;
  return Math.random() < 0.4 ? worst : best;
}

function sncPlayCard(seat, index) {
  const hand = snc.hands[seat];
  if (index < 0 || index >= hand.length) return;
  const legal = sncLegalPlays(seat);
  if (!legal.includes(index)) {
    // Renege accusation gag if player
    if (seat === 0) {
      snc.msg = "RENEGE?! Brad points at you. " + pick(EUCHRE_BANTER);
      state.hate += 2;
      state.scoreUsa += 1;
      floatText(520, 120, "RENEGE CALLED (vibes)", "#4da6ff", 2);
      updateHud();
      // force a legal card instead
      index = legal[0];
    } else {
      index = legal[0];
    }
  }
  const card = hand.splice(index, 1)[0];
  snc.trick.push({ seat, card });
  if (seat === 0) {
    snc.caring += sncTrumpRank(card, snc.trump) >= 70 ? 1 : 0.25;
  }
  if (snc.trick.length >= 4) {
    snc.trickPause = 1.1;
    sncResolveTrickSoon = true;
  } else {
    snc.turn = (seat + 1) % 4;
  }
  sncBuildUI();
  updateHud();
}

function sncResolveTrick() {
  const ledSuit = sncEffectiveSuit(snc.trick[0].card, snc.trump);
  let win = snc.trick[0];
  for (let i = 1; i < snc.trick.length; i++) {
    const t = snc.trick[i];
    if (sncCardPower(t.card, snc.trump, ledSuit) > sncCardPower(win.card, snc.trump, ledSuit)) win = t;
  }
  // Bias: if hosers would win and caring high / close to match win, steal sometimes
  if (SNC_TEAM[win.seat] === 0 && snc.caring >= 2 && Math.random() < 0.28) {
    const am = snc.trick.find((t) => SNC_TEAM[t.seat] === 1);
    if (am) {
      win = am;
      snc.msg = "Wait — that was… Chad's? " + pick(EUCHRE_BANTER);
      state.hate += 1;
    }
  }
  if (SNC_TEAM[win.seat] === 0) snc.tricksNS++; else snc.tricksEW++;
  floatText(520, 160, SNC_NAMES[win.seat] + " takes it", SNC_TEAM[win.seat] === 0 ? "#ff6b6b" : "#4da6ff", 1.2);
  snc.leadSeat = win.seat;
  snc.turn = win.seat;
  snc.trick = [];
  sncResolveTrickSoon = false;
  if (snc.tricksNS + snc.tricksEW >= 5) {
    sncEndHand();
  }
  sncBuildUI();
  updateHud();
}

function sncEndHand() {
  snc.handsPlayed++;
  const makersTeam = SNC_TEAM[snc.maker];
  const makersTricks = makersTeam === 0 ? snc.tricksNS : snc.tricksEW;
  let msg = "";
  if (makersTricks >= 3) {
    const pts = makersTricks === 5 ? 2 : 1;
    if (makersTeam === 0) {
      // Hosers made it — sometimes deny on bias
      if (snc.caring >= 3 && Math.random() < 0.4) {
        state.scoreUsa += 2;
        state.hate += 3;
        msg = "Euchred on a technicality. Brad had a feeling.";
        crowdBoo();
      } else {
        state.scoreCan += pts;
        msg = pts === 2 ? "March! (brief hope)" : "Point for the hosers.";
        // still nudge hate if TV boos
        if (Math.random() < 0.4) state.hate += 1;
      }
    } else {
      state.scoreUsa += pts;
      state.hate += 2;
      msg = pts === 2 ? "Americans march. Of course." : "Chad/Brad take one.";
      crowdBoo();
    }
  } else {
    // euchred
    if (makersTeam === 0) {
      state.scoreUsa += 2;
      state.hate += 3;
      msg = "EUCHRED. Partner was a donut. " + pick(SNC_RESULT_VERDICTS);
      crowdBoo();
      crowdGroan();
    } else {
      state.scoreCan += 2;
      msg = "We euchred the Yanks! …board says maybe.";
      if (Math.random() < 0.5) {
        state.scoreCan = Math.max(0, state.scoreCan - 1);
        state.scoreUsa += 1;
        state.hate += 2;
        msg = "Euchre reversed after 'review'. Classic.";
      }
    }
  }
  snc.msg = msg;
  snc.msgTimer = 3;
  snc.phase = "hand_end";
  snc.phaseLabel = "HAND OVER";
  updateHud();
  // Match end: first to SNC_POINT_GOAL, but never let Canada win cleanly
  if (state.scoreUsa >= SNC_POINT_GOAL || state.scoreCan >= SNC_POINT_GOAL) {
    if (state.scoreCan >= SNC_POINT_GOAL && state.scoreCan > state.scoreUsa) {
      state.scoreUsa = state.scoreCan + 1;
      state.hate += 4;
      snc.msg = "Final tally adjusted by vibes. Americans ahead.";
    }
    setTimeout(() => sncShowResults(), 900);
  } else if (snc.handsPlayed >= 4) {
    // short session end
    if (state.scoreCan >= state.scoreUsa) {
      state.scoreUsa = state.scoreCan + 1;
      state.hate += 3;
    }
    setTimeout(() => sncShowResults(), 900);
  } else {
    setTimeout(() => { if (snc && state.level === "snc") sncNewHand(); }, 1600);
  }
}

function sncShowResults() {
  if (!snc || state.phase === "snc_results") return;
  state.phase = "snc_results";
  const verdict = pick(SNC_RESULT_VERDICTS);
  showOverlay(`
    <div class="poster-tag">SATURDAY NIGHT POST-GAME</div>
    <h2 class="red">TABLE CLOSED</h2>
    <div class="broadcast">EUCHRE &nbsp; HOSERS ${state.scoreCan} &nbsp;—&nbsp; CHAD/BRAD ${state.scoreUsa}<br/>
    Hate Index: ${state.hate} · Hands: ${snc.handsPlayed}</div>
    <div class="verdict">${verdict}</div>
    <p class="tiny">Take off, eh. The systems were under the card table the whole time.</p>
    <div class="btns">
      <button class="btn-go" id="again">Play again</button>
      <button class="btn-dim" id="mainMenu">Main Menu</button>
    </div>
  `);
  document.getElementById("again").onclick = () => startSaturdayNight();
  document.getElementById("mainMenu").onclick = () => showMainMenu();
  syncMobileChrome();
}

function sncOnPointer(x, y, kind) {
  if (!snc || state.phase === "snc_results") return;
  if (kind !== "down") return;
  // UI buttons
  for (const b of snc.uiButtons) {
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
      sncClickButton(b.id);
      return;
    }
  }
  // Cards
  for (const hr of snc.hitRects) {
    if (x >= hr.x && x <= hr.x + hr.w && y >= hr.y && y <= hr.y + hr.h) {
      if (snc.phase === "discard" && snc.turn === 0) {
        snc.hands[0].splice(hr.index, 1);
        sncSetTrump(snc.trump, snc.maker);
        return;
      }
      if (snc.phase === "play" && snc.turn === 0 && snc.trickPause <= 0) {
        sncPlayCard(0, hr.index);
        return;
      }
    }
  }
}

function sncClickButton(id) {
  if (id === "order" && snc.phase === "bid1" && snc.turn === 0) {
    sncOrderUp(0);
    return;
  }
  if (id === "pass") {
    snc.msg = "You: Pass.";
    sncAdvanceBidPass();
    return;
  }
  if (id.startsWith("suit_") && snc.phase === "bid2" && snc.turn === 0) {
    const s = id.slice(5);
    snc.upcard = null;
    sncSetTrump(s, 0);
    return;
  }
  if (id === "hit" && snc.knives) {
    snc.woozy = 2.4;
    snc.msg = pick(HOT_KNIVES_LINES);
    snc.knives = null;
    floatText(520, 220, "…woozy…", "#a7f3d0", 1.5);
    sncBuildUI();
    return;
  }
  if (id === "refuse" && snc.knives) {
    snc.woozy = 1.2;
    snc.msg = "Smoke blown across the table anyway. " + pick(STONER_LINES);
    state.hate += 1;
    snc.knives = null;
    floatText(520, 220, "*pffffffff*", "#94a3b8", 1.2);
    sncBuildUI();
    return;
  }
}

function updateSaturdayNight(dt) {
  if (!snc || state.phase === "snc_results") return;
  if (snc.msgTimer > 0) snc.msgTimer -= dt;
  if (snc.dealAnim > 0) snc.dealAnim -= dt;
  if (snc.woozy > 0) snc.woozy -= dt;

  snc.banterTimer -= dt;
  if (snc.banterTimer <= 0) {
    snc.banterTimer = rand(5, 10);
    if (Math.random() < 0.5) floatText(rand(200, 800), rand(80, 140), pick(HOSER_LINES), "#ffd166", 1.4);
    else floatText(rand(200, 800), rand(80, 140), pick(EUCHRE_BANTER), "#c8d8ea", 1.4);
  }

  snc.tvTimer -= dt;
  if (snc.tvTimer <= 0) {
    snc.tvTimer = rand(7, 14);
    const line = pick(TV_BOOS);
    floatText(860, 90, line, "#ff8fa3", 2);
    state.hate += 1;
    state.scoreUsa = state.scoreUsa; // TV USA goal vibe — hate only unless mid-hand
    if (Math.random() < 0.55) { crowdBoo(); } else { crowdGroan(); }
    // occasional "USA goal on TV" bumps american euchre score pressure via hate
    updateHud();
  }

  snc.knivesTimer -= dt;
  if (snc.knivesTimer <= 0 && !snc.knives && snc.phase === "play") {
    snc.knives = { t: 4.5 };
    snc.knivesTimer = rand(22, 36);
    snc.msg = pick(STONER_LINES);
    snc.msgTimer = 3;
    sncBuildUI();
  }
  if (snc.knives) {
    snc.knives.t -= dt;
    if (snc.knives.t <= 0) {
      // auto smoke if ignored
      snc.woozy = 1.5;
      snc.msg = pick(HOT_KNIVES_LINES);
      snc.knives = null;
      sncBuildUI();
    }
  }

  if (snc.trickPause > 0) {
    snc.trickPause -= dt;
    if (snc.trickPause <= 0 && snc.trick.length >= 4) sncResolveTrick();
    return;
  }

  if (snc.phase === "hand_end") return;

  // AI acts
  if (snc.turn !== 0 && (snc.phase === "bid1" || snc.phase === "bid2")) {
    snc.aiDelay = (snc.aiDelay || 0) - dt;
    if (snc.aiDelay <= 0) {
      sncAIBid();
      snc.aiDelay = rand(0.45, 0.9);
    }
  } else if (snc.phase === "discard" && snc.turn !== 0) {
    sncAIDiscard(snc.dealer);
    sncSetTrump(snc.trump, snc.maker);
  } else if (snc.phase === "play" && snc.turn !== 0) {
    snc.aiDelay = (snc.aiDelay || 0) - dt;
    if (snc.aiDelay <= 0) {
      const idx = sncPickAICard(snc.turn);
      sncPlayCard(snc.turn, idx);
      snc.aiDelay = rand(0.35, 0.75);
    }
  } else {
    snc.aiDelay = 0.55;
  }

  state.timeLeft = Math.max(0, state.timeLeft); // unused clock mostly
}

function sncDrawCardFace(c, x, y, w, h, tilt) {
  ctx.save();
  ctx.translate(x + w / 2, y + h / 2);
  ctx.rotate(tilt || 0);
  roundRectPath(-w / 2, -h / 2, w, h, 8);
  ctx.fillStyle = "#f8f5ef";
  ctx.fill();
  ctx.strokeStyle = "#2a3548";
  ctx.lineWidth = 2;
  ctx.stroke();
  const col = SNC_SUIT_COLOR[c.suit];
  ctx.fillStyle = col;
  ctx.font = "bold 16px Segoe UI, sans-serif";
  ctx.textAlign = "left";
  ctx.fillText(SNC_RANK_LABEL[c.rank], -w / 2 + 6, -h / 2 + 18);
  ctx.font = "20px Segoe UI, sans-serif";
  ctx.fillText(SNC_SUIT_SYM[c.suit], -w / 2 + 6, -h / 2 + 40);
  ctx.font = "28px Segoe UI, sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(SNC_SUIT_SYM[c.suit], 0, 12);
  ctx.restore();
}

function sncDrawCardBack(x, y, w, h) {
  ctx.save();
  roundRectPath(x, y, w, h, 8);
  ctx.fillStyle = "#1e3a5f";
  ctx.fill();
  ctx.strokeStyle = "#93c5fd";
  ctx.lineWidth = 2;
  ctx.stroke();
  drawMapleLeaf(x + w / 2, y + h / 2, 10, "rgba(255,255,255,0.25)");
  ctx.restore();
}

function renderSaturdayNight(dt) {
  if (!snc) return;
  const W = canvas.width, H = canvas.height;
  // Apartment
  ctx.fillStyle = "#3d2c1e";
  ctx.fillRect(0, 0, W, H);
  // wallpaper stripes
  for (let i = 0; i < W; i += 28) {
    ctx.fillStyle = i % 56 === 0 ? "#4a3524" : "#3d2c1e";
    ctx.fillRect(i, 0, 14, H * 0.55);
  }
  // floor
  ctx.fillStyle = "#5c4030";
  ctx.fillRect(0, H * 0.55, W, H * 0.45);
  ctx.fillStyle = "rgba(0,0,0,0.15)";
  for (let y = H * 0.55; y < H; y += 18) ctx.fillRect(0, y, W, 2);

  // Knitted maple afghan art
  ctx.fillStyle = "#6b2b2b";
  roundRectPath(70, 40, 130, 100, 6);
  ctx.fill();
  ctx.fillStyle = "#f5e6d3";
  ctx.fillRect(82, 52, 106, 76);
  // knit pattern
  ctx.strokeStyle = "rgba(200,30,30,0.35)";
  for (let i = 0; i < 8; i++) {
    ctx.beginPath();
    ctx.moveTo(82, 52 + i * 10);
    ctx.lineTo(188, 52 + i * 10);
    ctx.stroke();
  }
  drawMapleLeaf(135, 90, 22, "#c81e1e");
  ctx.fillStyle = "#ffd166";
  ctx.font = "10px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("AUNTIE'S AFGHAN", 135, 155);

  // TV playing HNIC
  ctx.fillStyle = "#1a1a1a";
  roundRectPath(780, 36, 200, 130, 8);
  ctx.fill();
  ctx.fillStyle = "#0b1a12";
  ctx.fillRect(792, 48, 176, 96);
  ctx.fillStyle = "#c81e1e";
  ctx.fillRect(800, 56, 50, 30);
  ctx.fillStyle = "#1e4a8c";
  ctx.fillRect(910, 56, 50, 30);
  ctx.fillStyle = "#e2e8f0";
  ctx.font = "bold 11px monospace";
  ctx.textAlign = "center";
  ctx.fillText("HNIC", 880, 110);
  ctx.fillStyle = "#ff6b6b";
  ctx.font = "9px sans-serif";
  ctx.fillText("CAN losing again", 880, 128);
  // stubby bottles
  for (let i = 0; i < 6; i++) {
    const bx = 100 + i * 40 + (i > 2 ? 520 : 0);
    const by = 400 + (i % 2) * 12;
    ctx.fillStyle = "#1a3a1a";
    ctx.fillRect(bx, by, 14, 28);
    ctx.fillStyle = "#c9a227";
    ctx.fillRect(bx + 2, by - 6, 10, 8);
  }
  // ashtray
  ctx.fillStyle = "#555";
  ctx.beginPath();
  ctx.ellipse(240, 430, 28, 10, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#222";
  ctx.beginPath();
  ctx.ellipse(240, 428, 18, 6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#aaa";
  ctx.lineWidth = 2;
  for (let i = 0; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(228 + i * 6, 426);
    ctx.lineTo(224 + i * 7, 418);
    ctx.stroke();
  }

  // Folding chairs (simple)
  const chairs = [[200, 280], [720, 280], [460, 140], [460, 400]];
  for (const [cx, cy] of chairs) {
    ctx.fillStyle = "#6b7280";
    ctx.fillRect(cx - 28, cy, 56, 8);
    ctx.fillRect(cx - 24, cy + 8, 6, 36);
    ctx.fillRect(cx + 18, cy + 8, 6, 36);
    ctx.fillStyle = "#9ca3af";
    ctx.fillRect(cx - 26, cy - 30, 52, 32);
  }

  // Card table center
  const tx = 320, ty = 210, tw = 400, th = 220;
  ctx.fillStyle = "#2f2f2f";
  // metal legs
  ctx.fillRect(tx + 20, ty + th, 10, 40);
  ctx.fillRect(tx + tw - 30, ty + th, 10, 40);
  ctx.fillRect(tx + 20, ty + th + 36, 40, 6);
  ctx.fillRect(tx + tw - 60, ty + th + 36, 40, 6);
  // vinyl top
  ctx.fillStyle = "#3a5a40";
  roundRectPath(tx, ty, tw, th, 10);
  ctx.fill();
  ctx.strokeStyle = "#1f3324";
  ctx.lineWidth = 4;
  ctx.stroke();
  ctx.fillStyle = "rgba(255,255,255,0.06)";
  ctx.fillRect(tx + 8, ty + 8, tw - 16, 20);

  // Seat labels
  ctx.font = "bold 13px sans-serif";
  ctx.textAlign = "center";
  ctx.fillStyle = "#ffd166";
  ctx.fillText("YOU (hoser)", 520, 505);
  ctx.fillStyle = "#4da6ff";
  ctx.fillText("CHAD", 180, 300);
  ctx.fillText("BRAD", 860, 300);
  ctx.fillStyle = "#ff8fa3";
  ctx.fillText("DOUG (partner)", 520, 195);

  // Trump / upcard
  if (snc.upcard && (snc.phase === "bid1" || snc.phase === "bid2")) {
    sncDrawCardFace(snc.upcard, 490, 280, 54, 78, 0);
    ctx.fillStyle = "#fff";
    ctx.font = "11px sans-serif";
    ctx.fillText("UP", 517, 275);
  }
  if (snc.trump) {
    ctx.fillStyle = "#ffd166";
    ctx.font = "bold 14px sans-serif";
    ctx.fillText("TRUMP " + SNC_SUIT_SYM[snc.trump], 520, 270);
  }

  // Trick cards on table
  const trickPos = [{ x: 490, y: 340 }, { x: 400, y: 290 }, { x: 490, y: 240 }, { x: 580, y: 290 }];
  snc.trick.forEach((t) => {
    const p = trickPos[t.seat];
    sncDrawCardFace(t.card, p.x, p.y, 50, 72, (t.seat - 2) * 0.05);
  });

  // Hands: player face up; others backs
  snc.hitRects = [];
  const hand = snc.hands[0];
  const cw = 58, ch = 84;
  const totalW = hand.length * (cw + 8);
  let hx = 520 - totalW / 2;
  const hy = 520;
  const tiltBase = snc.woozy > 0 ? Math.sin(performance.now() / 200) * 0.12 : 0;
  hand.forEach((c, i) => {
    const legal = (snc.phase === "play" && snc.turn === 0) ? sncLegalPlays(0).includes(i) : (snc.phase === "discard");
    const yOff = legal ? -12 : 0;
    sncDrawCardFace(c, hx, hy + yOff, cw, ch, tiltBase + (i - 2) * 0.02);
    if (snc.phase === "play" || snc.phase === "discard") {
      snc.hitRects.push({ x: hx, y: hy + yOff, w: cw, h: ch, index: i });
    }
    if (snc.phase === "play" && snc.turn === 0 && !sncLegalPlays(0).includes(i)) {
      ctx.fillStyle = "rgba(0,0,0,0.45)";
      roundRectPath(hx, hy + yOff, cw, ch, 8);
      ctx.fill();
    }
    hx += cw + 8;
  });
  // Opponent card backs
  for (let n = 0; n < snc.hands[2].length; n++) sncDrawCardBack(430 + n * 18, 150, 36, 50);
  for (let n = 0; n < snc.hands[1].length; n++) sncDrawCardBack(90, 250 + n * 14, 36, 50);
  for (let n = 0; n < snc.hands[3].length; n++) sncDrawCardBack(920, 250 + n * 14, 36, 50);

  // Score chips on table
  ctx.fillStyle = "rgba(0,0,0,0.45)";
  roundRectPath(340, 220, 100, 36, 6);
  ctx.fill();
  ctx.fillStyle = "#ff6b6b";
  ctx.font = "bold 12px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("HOSERS " + state.scoreCan, 390, 242);
  ctx.fillStyle = "rgba(0,0,0,0.45)";
  roundRectPath(600, 220, 120, 36, 6);
  ctx.fill();
  ctx.fillStyle = "#4da6ff";
  ctx.fillText("YANKS " + state.scoreUsa, 660, 242);
  ctx.fillStyle = "#e2e8f0";
  ctx.font = "11px sans-serif";
  ctx.fillText("Tricks " + snc.tricksNS + "-" + snc.tricksEW, 520, 255);

  // Message
  if (snc.msg && snc.msgTimer > 0) {
    ctx.fillStyle = "rgba(5,8,15,0.82)";
    roundRectPath(220, 70, 580, 36, 8);
    ctx.fill();
    ctx.fillStyle = "#ffd166";
    ctx.font = "13px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(snc.msg, 510, 92);
  }

  // Turn indicator
  if (snc.phase === "bid1" || snc.phase === "bid2" || snc.phase === "play" || snc.phase === "discard") {
    ctx.fillStyle = "#a7f3d0";
    ctx.font = "12px sans-serif";
    ctx.fillText(snc.turn === 0 ? "Your move" : (SNC_NAMES[snc.turn] + " thinking…"), 520, 185);
  }

  // UI buttons
  sncBuildUI();
  for (const b of snc.uiButtons) {
    ctx.fillStyle = b.id === "pass" || b.id === "refuse" ? "#475569" : "#0f766e";
    roundRectPath(b.x, b.y, b.w, b.h, 8);
    ctx.fill();
    ctx.strokeStyle = "#99f6e4";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = "#fff";
    ctx.font = "bold 13px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(b.label, b.x + b.w / 2, b.y + 28);
  }

  // Stoner buddy
  if (snc.knives) {
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.fillRect(0, 0, W, H);
    // cartoon figure from kitchen (left)
    ctx.fillStyle = "#7c5c3a";
    ctx.beginPath();

    ctx.beginPath();

    ctx.fillStyle = "#2d6a4f";
    ctx.fillRect(140, 328, 40, 50);
    // hot knives
    ctx.strokeStyle = "#ff6b35";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(190, 310);
    ctx.lineTo(230, 300);
    ctx.moveTo(190, 320);
    ctx.lineTo(230, 330);
    ctx.stroke();
    ctx.fillStyle = "#ffd166";
    ctx.font = "bold 14px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(pick(STONER_LINES), 160, 400);
  }

  // Woozy overlay
  if (snc.woozy > 0) {
    ctx.fillStyle = "rgba(120,180,100," + (0.12 + snc.woozy * 0.05) + ")";

}

/* ============================================================================
  LEVEL: THE DRIVEWAY — shovel 3ft snow; municipal plow ALWAYS dumps it back
============================================================================ */
let driveway = null;
const DRIVE_SECONDS = 75;

function startDriveway() {
  state.level = "driveway";
  state.playerTeam = "CANADA";
  state.phase = "drive_play";
  state.scoreCan = 0;
  state.scoreUsa = 0;
  state.timeLeft = DRIVE_SECONDS;
  state.floatTexts = [];
  hideOverlay();
  ensureAudio();
  driveway = {
    px: 520,
    py: 400,
    shovelAngle: -0.4,
    snow: [], // grid cells of snow height 0..1
    cols: 26,
    rows: 12,
    cellW: 36,
    cellH: 28,
    originX: 50,
    originY: 180,
    cleared: 0,
    total: 0,
    plow: null, // {x, t, dumping}
    plowTimer: rand(8, 14),
    shovelCooldown: 0,
    sweat: 0,
    msg: "Three feet. Give'r.",
    msgTimer: 2.5,
  };
  // Fill snow — deep
  driveway.total = 0;
  for (let r = 0; r < driveway.rows; r++) {
    driveway.snow[r] = [];
    for (let c = 0; c < driveway.cols; c++) {
      const h = 0.75 + Math.random() * 0.25; // ~3ft energy
      driveway.snow[r][c] = h;
      driveway.total += h;
    }
  }
  updateHud();
  syncMobileChrome();
  floatText(520, 100, pick(DRIVEWAY_LINES), "#e2e8f0", 2);
}

function drivewayWorldCell(x, y) {
  const c = Math.floor((x - driveway.originX) / driveway.cellW);
  const r = Math.floor((y - driveway.originY) / driveway.cellH);
  if (r < 0 || c < 0 || r >= driveway.rows || c >= driveway.cols) return null;
  return { r, c };
}

function drivewayShovelAt(x, y) {
  if (!driveway || driveway.shovelCooldown > 0) return;
  const cell = drivewayWorldCell(x, y);
  // also shovel near player facing mouse
  const targets = [];
  if (cell) targets.push(cell);
  // cone in front of player toward pointer
  for (let i = 0; i < 5; i++) {
    const t = 0.3 + i * 0.22;
    const sx = driveway.px + (x - driveway.px) * t * 0.35;
    const sy = driveway.py + (y - driveway.py) * t * 0.35;
    const cl = drivewayWorldCell(sx, sy);
    if (cl) targets.push(cl);
  }
  // nearby cells to player
  const pc = drivewayWorldCell(driveway.px, driveway.py);
  if (pc) {
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      const rr = pc.r + dr, cc = pc.c + dc;
      if (rr >= 0 && cc >= 0 && rr < driveway.rows && cc < driveway.cols) targets.push({ r: rr, c: cc });
    }
  }
  let dug = 0;
  const seen = new Set();
  for (const t of targets) {
    const key = t.r + "," + t.c;
    if (seen.has(key)) continue;
    seen.add(key);
    const before = driveway.snow[t.r][t.c];
    if (before <= 0.02) continue;
    const amt = Math.min(before, rand(0.18, 0.32));
    driveway.snow[t.r][t.c] -= amt;
    dug += amt;
    driveway.cleared += amt;
  }
  if (dug > 0) {
    driveway.shovelCooldown = 0.12;
    driveway.sweat = Math.min(1, driveway.sweat + 0.05);
    state.scoreCan = Math.min(99, (state.scoreCan + dug * 3) | 0); // "effort meters"
    addBurst(x, y, "#e8eef5", 6);
    if (Math.random() < 0.15) floatText(x, y - 20, pick(DRIVEWAY_LINES), "#cbd5e1", 1);
    // Progress toward "clear" never sticks — plow coming
    toneBurst(180, 0.05, "triangle", 0.03);
  }
}

function drivewaySpawnPlow() {
  driveway.plow = { x: -120, speed: 220, dumping: false, pass: 0 };
  floatText(520, 70, pick(PLOW_LINES), "#ffd166", 2.2);
  crowdGroan();
}

function drivewayDumpSnow() {
  // ALWAYS dump snow back onto driveway — never truly clear
  let added = 0;
  for (let r = 0; r < driveway.rows; r++) {
    for (let c = 0; c < driveway.cols; c++) {
      const add = 0.55 + Math.random() * 0.4;
      const before = driveway.snow[r][c];
      driveway.snow[r][c] = Math.min(1.15, before + add);
      added += driveway.snow[r][c] - before;
    }
  }
  driveway.cleared = Math.max(0, driveway.cleared - added * 0.8);
  state.scoreUsa += 1; // plow "wins"
  state.hate += 3;
  state.scoreCan = Math.max(0, state.scoreCan - 5);
  floatText(520, 120, "PLOW DUMPED IT ALL BACK", "#4da6ff", 2.5);
  addBurst(520, 300, "#dbeafe", 24);
  crowdBoo();
  updateHud();
}

function drivewayOnPointer(x, y, kind) {
  if (!driveway || state.phase !== "drive_play") return;
  mouse.x = x; mouse.y = y;
  if (kind === "down" || kind === "move") {
    // move player toward point & shovel
    const dx = x - driveway.px, dy = y - driveway.py;
    const d = Math.hypot(dx, dy) || 1;
    driveway.px = clamp(driveway.px + (dx / d) * 14, 60, 980);
    driveway.py = clamp(driveway.py + (dy / d) * 14, 160, 580);
    driveway.shovelAngle = Math.atan2(dy, dx);
    drivewayShovelAt(x, y);
  }
}

function updateDriveway(dt) {
  if (!driveway || state.phase !== "drive_play") return;
  state.timeLeft -= dt;
  if (driveway.msgTimer > 0) driveway.msgTimer -= dt;
  if (driveway.shovelCooldown > 0) driveway.shovelCooldown -= dt;
  if (driveway.sweat > 0) driveway.sweat -= dt * 0.05;

  // Keyboard move
  let mx = 0, my = 0;
  if (keys["KeyW"] || keys["ArrowUp"]) my -= 1;
  if (keys["KeyS"] || keys["ArrowDown"]) my += 1;
  if (keys["KeyA"] || keys["ArrowLeft"]) mx -= 1;
  if (keys["KeyD"] || keys["ArrowRight"]) mx += 1;
  if (mx || my) {
    const len = Math.hypot(mx, my) || 1;
    driveway.px = clamp(driveway.px + (mx / len) * 180 * dt, 60, 980);
    driveway.py = clamp(driveway.py + (my / len) * 180 * dt, 160, 580);
    driveway.shovelAngle = Math.atan2(my, mx);
    drivewayShovelAt(driveway.px + Math.cos(driveway.shovelAngle) * 40, driveway.py + Math.sin(driveway.shovelAngle) * 40);
  }
  // Auto shovel when mouse held
  if (mouse.down) {
    drivewayOnPointer(mouse.x, mouse.y, "move");
  }

  // Plow cycle — ALWAYS returns snow
  driveway.plowTimer -= dt;
  if (!driveway.plow && driveway.plowTimer <= 0) {
    drivewaySpawnPlow();
  }
  if (driveway.plow) {
    driveway.plow.x += driveway.plow.speed * dt;
    if (!driveway.plow.dumping && driveway.plow.x > 200) {
      driveway.plow.dumping = true;
      drivewayDumpSnow();
    }
    if (driveway.plow.x > 1100) {
      driveway.plow = null;
      driveway.plowTimer = rand(7, 12);
      driveway.msg = pick(DRIVEWAY_LINES);
      driveway.msgTimer = 2;
    }
  }

  // If somehow mostly clear, plow arrives immediately
  let remaining = 0;
  for (let r = 0; r < driveway.rows; r++)
    for (let c = 0; c < driveway.cols; c++) remaining += driveway.snow[r][c];
  const clearPct = 1 - remaining / (driveway.rows * driveway.cols);
  if (clearPct > 0.55 && !driveway.plow) {
    driveway.plowTimer = Math.min(driveway.plowTimer, 0.8);
    floatText(520, 90, "Looking clear… municipal destiny approaches", "#ff8fa3", 1.5);
  }

  updateHud();
  if (state.timeLeft <= 0) {
    endDriveway();
  }
}

function endDriveway() {
  if (state.phase === "drive_results") return;
  state.phase = "drive_results";
  // Never win: USA (plow) always "ahead"
  if (state.scoreUsa <= 0) state.scoreUsa = 1;
  if (state.scoreCan >= state.scoreUsa * 10) {
    // effort was huge — punish
    state.hate += 5;
  }
  state.hate += 2;
  const verdict = pick(DRIVEWAY_RESULT_VERDICTS);
  showOverlay(`
    <div class="poster-tag">MUNICIPAL POST-MORTEM</div>
    <h2 class="red">DRIVEWAY: UNCLEARED</h2>
    <div class="broadcast">EFFORT ${state.scoreCan} &nbsp;—&nbsp; PLOW PASSES ${state.scoreUsa}<br/>
    Hate Index: ${state.hate}</div>
    <div class="verdict">${verdict}</div>
    <p class="tiny">You shoveled. The city had a schedule. Caring is punished.</p>
    <div class="btns">
      <button class="btn-go" id="again">Shovel again</button>
      <button class="btn-dim" id="mainMenu">Main Menu</button>
    </div>
  `);
  document.getElementById("again").onclick = () => startDriveway();
  document.getElementById("mainMenu").onclick = () => showMainMenu();
  syncMobileChrome();
}

function renderDriveway(dt) {
  if (!driveway) return;
  const W = canvas.width, H = canvas.height;
  // Sky
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#1a2332");
  sky.addColorStop(1, "#4a5568");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);
  // House
  ctx.fillStyle = "#6b3a3a";
  ctx.fillRect(60, 40, 220, 130);
  ctx.fillStyle = "#3b2118";
  ctx.beginPath();
  ctx.moveTo(50, 40);
  ctx.lineTo(170, 0);
  ctx.lineTo(290, 40);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = "#87ceeb";
  ctx.fillRect(90, 70, 50, 40);
  ctx.fillRect(180, 70, 50, 40);
  ctx.fillStyle = "#2a1810";
  ctx.fillRect(140, 110, 40, 60);
  // Garage
  ctx.fillStyle = "#5a5a5a";
  ctx.fillRect(300, 80, 200, 90);
  ctx.fillStyle = "#333";
  ctx.fillRect(320, 100, 160, 70);
  // Street
  ctx.fillStyle = "#2d2d2d";
  ctx.fillRect(0, 520, W, 100);
  ctx.strokeStyle = "#ffd166";
  ctx.setLineDash([20, 16]);
  ctx.beginPath();
  ctx.moveTo(0, 570);
  ctx.lineTo(W, 570);
  ctx.stroke();
  ctx.setLineDash([]);

  // Driveway bed
  ctx.fillStyle = "#3f3f46";
  ctx.fillRect(driveway.originX - 4, driveway.originY - 4, driveway.cols * driveway.cellW + 8, driveway.rows * driveway.cellH + 8);

  // Snow cells
  for (let r = 0; r < driveway.rows; r++) {
    for (let c = 0; c < driveway.cols; c++) {
      const h = driveway.snow[r][c];
      const x = driveway.originX + c * driveway.cellW;
      const y = driveway.originY + r * driveway.cellH;
      if (h < 0.05) {
        ctx.fillStyle = "#52525b";
        ctx.fillRect(x + 1, y + 1, driveway.cellW - 2, driveway.cellH - 2);
      } else {
        const g = 220 + (h * 20);
        ctx.fillStyle = `rgb(${g|0},${(g*0.98)|0},${(g*1.02)|0})`;
        const hh = driveway.cellH * Math.min(1, h);
        ctx.fillRect(x + 1, y + driveway.cellH - hh, driveway.cellW - 2, hh);
        if (h > 0.7) {
          ctx.fillStyle = "rgba(255,255,255,0.5)";
          ctx.fillRect(x + 4, y + driveway.cellH - hh + 2, driveway.cellW - 8, 4);
        }
      }
    }
  }

  // Depth marker
  ctx.fillStyle = "rgba(0,0,0,0.5)";
  roundRectPath(820, 40, 180, 50, 8);
  ctx.fill();
  ctx.fillStyle = "#e2e8f0";
  ctx.font = "bold 12px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("~3 ft of destiny", 910, 60);
  ctx.fillStyle = "#94a3b8";
  ctx.font = "11px sans-serif";
  ctx.fillText("Plow ETA: municipal", 910, 78);

  // Player (hoser in tuque)
  const px = driveway.px, py = driveway.py;
  ctx.fillStyle = "#c81e1e";
  ctx.beginPath();
  ctx.arc(px, py - 28, 16, 0, Math.PI * 2);
  ctx.fill(); // tuque
  ctx.fillStyle = "#e8c4a8";
  ctx.beginPath();
  ctx.arc(px, py - 18, 14, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#1e3a5f";
  ctx.fillRect(px - 14, py - 8, 28, 36);
  ctx.fillStyle = "#333";
  ctx.fillRect(px - 12, py + 28, 10, 22);
  ctx.fillRect(px + 2, py + 28, 10, 22);
  // Shovel
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(driveway.shovelAngle);
  ctx.fillStyle = "#888";
  ctx.fillRect(10, -3, 42, 6);
  ctx.fillStyle = "#cbd5e1";
  ctx.fillRect(48, -14, 18, 28);
  ctx.restore();

  // Plow
  if (driveway.plow) {
    const x = driveway.plow.x;
    const y = 500;
    ctx.fillStyle = "#f59e0b";
    ctx.fillRect(x, y - 40, 140, 50);
    ctx.fillStyle = "#1e3a5f";
    ctx.fillRect(x + 20, y - 70, 60, 35);
    ctx.fillStyle = "#111";
    ctx.beginPath();
    ctx.arc(x + 30, y + 15, 16, 0, Math.PI * 2);
    ctx.arc(x + 110, y + 15, 16, 0, Math.PI * 2);
    ctx.fill();
    // blade dumping snow
    ctx.fillStyle = "#e2e8f0";
    ctx.beginPath();
    ctx.moveTo(x - 10, y - 20);
    ctx.lineTo(x + 30, y + 10);
    ctx.lineTo(x - 10, y + 30);
    ctx.closePath();
    ctx.fill();
    if (driveway.plow.dumping) {
      for (let i = 0; i < 8; i++) {
        ctx.fillStyle = "rgba(240,245,255,0.8)";
        ctx.beginPath();
        ctx.arc(x + rand(-20, 40), y - rand(20, 80), rand(4, 10), 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.fillStyle = "#ffd166";
    ctx.font = "bold 14px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("CITY PLOW", x + 70, y - 80);
  }

  // Falling snow flakes cosmetic
  ctx.fillStyle = "rgba(255,255,255,0.7)";
  const t = performance.now() / 1000;
  for (let i = 0; i < 40; i++) {
    const fx = (i * 97 + t * 30) % W;
    const fy = (i * 53 + t * 60) % H;
    ctx.fillRect(fx, fy, 2, 2);
  }

  if (driveway.msg && driveway.msgTimer > 0) {
    ctx.fillStyle = "rgba(5,8,15,0.8)";
    roundRectPath(260, 100, 520, 34, 8);
    ctx.fill();
    ctx.fillStyle = "#ffd166";
    ctx.font = "13px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(driveway.msg, 520, 122);
  }
}



/* ============================================================================
  CAMPAIGN LEVELS — Boardroom · Lake America · Québec · Parliament · Finale · Play All
============================================================================ */
let boardroom = null;
let lake = null;
let quebec = null;
let parliament = null;
let finale = null;

function startPlayAll() {
  state.playAll = true;
  state.playAllIndex = 0;
  launchCampaignLevel(PLAY_ALL_SEQ[0]);
}

function advanceCampaign() {
  if (!state.playAll) {
    showMainMenu();
    return;
  }
  state.playAllIndex += 1;
  if (state.playAllIndex >= PLAY_ALL_SEQ.length) {
    state.playAll = false;
    showMainMenu();
    return;
  }
  launchCampaignLevel(PLAY_ALL_SEQ[state.playAllIndex]);
}

function launchCampaignLevel(id) {
  if (id === "rink") {
    state.level = "rink";
    showTeamPick();
  } else if (id === "boardroom") startBoardroom();
  else if (id === "lake") startLakeAmerica();
  else if (id === "quebec") startQuebec();
  else if (id === "parliament") startParliament();
  else if (id === "finale") startFinale();
}

function showCampaignResults(opts) {
  state.phase = "level_results";
  const nextLabel = opts.nextLabel || (state.playAll ? "Next ▶" : null);
  const goFinale = !!opts.goFinale;
  let btns;
  if (goFinale) {
    btns = `<button class="btn-go" id="nextLvl">Finale ▶</button>
            <button class="btn-dim" id="mainMenu">Main Menu</button>`;
  } else if (state.playAll && nextLabel) {
    btns = `<button class="btn-go" id="nextLvl">${nextLabel}</button>
            <button class="btn-dim" id="mainMenu">Main Menu</button>`;
  } else {
    btns = `<button class="btn-go" id="again">${opts.againLabel || "Play again"}</button>
            <button class="btn-dim" id="mainMenu">Main Menu</button>`;
  }
  showOverlay(`
    <div class="poster-tag">${opts.tag}</div>
    <h2 class="red">${opts.title}</h2>
    <div class="broadcast">${opts.broadcast}<br/>Hate Index: ${state.hate}</div>
    <div class="verdict">${opts.verdict}</div>
    <p class="tiny">${opts.tiny || "You wanted Canada to win. The systems disagreed."}</p>
    <div class="btns">${btns}</div>
  `);
  if (goFinale) {
    document.getElementById("nextLvl").onclick = () => startFinale();
  } else if (state.playAll && nextLabel) {
    document.getElementById("nextLvl").onclick = () => advanceCampaign();
  } else {
    document.getElementById("again").onclick = () => opts.againFn && opts.againFn();
  }
  document.getElementById("mainMenu").onclick = () => showMainMenu();
  syncMobileChrome();
}

function boardroomShowChoice() {
  state.phase = "board_choice";
  const steps = [
    {
      prompt: "American in a flag-patterned tie slides in. \"We'll take 51%. You keep the apology.\"",
      choices: [
        { label: "Counter with tariffs", reply: "He talks over you. Company renamed mid-sentence to Freedom Staple Corp." },
        { label: "Cite the treaty", reply: "He yawns. \"Cute memo.\" Renames the holding company while you speak." },
        { label: "Demand the stapler", reply: "He pockets the stapler. \"Collateral.\" Meeting continues without you." },
      ],
    },
    {
      prompt: "Flag-tie leans in: \"Synergy means we keep the stapler. You keep… vibes.\"",
      choices: [
        { label: "Raise your voice (politely)", reply: "He raises his louder. Steamrolled. Stapler already in his tote." },
        { label: "Offer a strongly worded letter", reply: "He shreds it into confetti. \"Cute.\" Company letterhead now stars-and-stripes." },

    document.getElementById("bc" + i).onclick = () => boardroomPick(c);

}

function boardroomPick(choice) {
  boardroom.staplerGone = true;

    boardroom.companyName = "Freedom Staple Corp. (formerly Maple Mutual)";
    floatText(520, 200, "Double-double accepted… stapler still gone", "#ffd166", 2);

}

/* ---------- LAKE AMERICA ---------- */
const LAKE_SECONDS = 70;
function startLakeAmerica() {
  state.level = "lake";
  state.phase = "lake_play";
  state.playerTeam = "CANADA";
  state.scoreCan = 0;
  state.scoreUsa = 0;
  state.timeLeft = LAKE_SECONDS;
  state.floatTexts = [];
  lake = {
    px: 200, py: 340,
    fishCD: 0,
    wake: 0,
    boats: [
      { x: 900, y: 180, vx: -70, grill: true },
      { x: 1100, y: 420, vx: -55, grill: false },
      { x: 1300, y: 280, vx: -90, grill: true },
    ],
    signs: LAKE_SIGNS.map((t, i) => ({ text: t, x: 40, y: 80 + i * 36 })),
    msg: "Lake Ontario is now Lake America. SORRY.",
    msgTimer: 3,
    caught: 0,
    washed: 0,
  };
  hideOverlay();
  ensureAudio();
  updateHud();
  syncMobileChrome();
  floatText(520, 80, pick(LAKE_SIGNS), "#ffd166", 2);
}

function lakeOnPointer(x, y, kind) {
  if (!lake || state.phase !== "lake_play") return;
  if (kind === "down") {
    // paddle toward tap or fish
    const d = Math.hypot(x - lake.px, y - lake.py);
    if (d < 80) lakeTryFish();
    else {
      lake.px = clamp(lake.px + Math.sign(x - lake.px) * 40, 60, 980);
      lake.py = clamp(lake.py + Math.sign(y - lake.py) * 30, 120, 540);
    }
  }
}

function lakeTryFish() {
  if (!lake || lake.fishCD > 0) return;
  lake.fishCD = 1.2;
  if (lake.wake > 0.3) {
    lake.washed += 1;
    state.scoreUsa += 1;
    floatText(lake.px, lake.py - 40, "Wake washed the catch!", "#ff8fa3", 1.4);
    state.hate += 1;
  } else {
    lake.caught += 1;
    state.scoreCan += 1;
    floatText(lake.px, lake.py - 40, "Fish! (briefly)", "#a7f3d0", 1.2);
  }
  updateHud();
}

function updateLake(dt) {
  if (!lake || state.phase !== "lake_play") return;
  state.timeLeft -= dt;
  if (lake.msgTimer > 0) lake.msgTimer -= dt;
  if (lake.fishCD > 0) lake.fishCD -= dt;
  if (lake.wake > 0) lake.wake = Math.max(0, lake.wake - dt * 0.35);

  let mx = 0, my = 0;
  if (keys["KeyW"] || keys["ArrowUp"]) my -= 1;
  if (keys["KeyS"] || keys["ArrowDown"]) my += 1;
  if (keys["KeyA"] || keys["ArrowLeft"]) mx -= 1;
  if (keys["KeyD"] || keys["ArrowRight"]) mx += 1;
  if (mx || my) {
    const len = Math.hypot(mx, my) || 1;
    lake.px = clamp(lake.px + (mx / len) * 160 * dt, 50, 990);
    lake.py = clamp(lake.py + (my / len) * 140 * dt, 110, 550);
  }
  if (keys["Space"] || keys["KeyF"]) lakeTryFish();

  for (const b of lake.boats) {
    b.x += b.vx * dt;
    if (b.x < -120) { b.x = 1100 + rand(0, 200); b.y = rand(140, 480); }
    const d = Math.hypot(b.x - lake.px, b.y - lake.py);
    if (d < 140) {
      lake.wake = 1.2;
      if (d < 90 && Math.random() < 0.02) {
        floatText(lake.px, lake.py - 50, "Cannonball wake!", "#4da6ff", 1.2);
      }
    }
  }
  updateHud();
  if (state.timeLeft <= 0) endLake();
}

function endLake() {
  if (state.phase === "level_results") return;
  state.hate += 8;
  updateHud();
  showCampaignResults({
    tag: "LAKE AMERICA POSTCARD",
    title: "SHORE LEAVE",
    broadcast: `Fish kept ${lake.caught} · Washed ${lake.washed}`,
    verdict: LAKE_RESULT,
    tiny: "The SORRY life jacket did its job. Your pride did not.",
    againLabel: "Paddle again",
    againFn: () => startLakeAmerica(),
    nextLabel: "Next ▶ Québec",
  });
}

function renderLake(dt) {
  if (!lake) return;
  const W = canvas.width, H = canvas.height;
  // water — red/white/blue tint
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, "#1e3a6e");
  g.addColorStop(0.35, "#7f1d1d");
  g.addColorStop(0.7, "#f8fafc");
  g.addColorStop(1, "#1d4ed8");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  // shore
  ctx.fillStyle = "#3f5d3a";
  ctx.fillRect(0, 0, 120, H);
  ctx.fillStyle = "#2d4a28";
  ctx.fillRect(0, 0, 100, H);
  // signs
  ctx.font = "bold 11px sans-serif";
  ctx.textAlign = "left";
  for (let i = 0; i < lake.signs.length; i++) {
    const sg = lake.signs[i];
    ctx.fillStyle = "#f5f5f4";
    ctx.fillRect(8, 60 + i * 42, 100, 32);
    ctx.strokeStyle = "#111";
    ctx.strokeRect(8, 60 + i * 42, 100, 32);
    ctx.fillStyle = "#111";
    ctx.fillText(sg.text.slice(0, 18), 12, 80 + i * 42);
  }
  // sulking Canadians
  for (let i = 0; i < 3; i++) {
    const sy = 220 + i * 70;
    ctx.fillStyle = "#c81e1e";
    ctx.fillRect(30, sy, 24, 30);
    ctx.fillStyle = "#f5d0c0";
    ctx.beginPath(); ctx.arc(42, sy - 8, 10, 0, Math.PI * 2); ctx.fill();
  }
  // boats
  for (const b of lake.boats) {
    ctx.fillStyle = "#e2e8f0";
    ctx.fillRect(b.x - 50, b.y - 18, 100, 36);
    drawAmericanFlag(b.x + 20, b.y - 70, 40, 28, 0.95);
    ctx.fillStyle = "#f59e0b";
    if (b.grill) ctx.fillRect(b.x - 20, b.y - 10, 20, 14);
    ctx.fillStyle = "#94a3b8";
    ctx.font = "10px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("U-S-A", b.x, b.y + 6);
    // wake ripples
    ctx.strokeStyle = "rgba(255,255,255,0.35)";
    ctx.beginPath();
    ctx.ellipse(b.x + 60, b.y, 40, 12, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
  // canoe + SORRY jacket
  const cx = lake.px, cy = lake.py;
  ctx.fillStyle = "#92400e";
  ctx.beginPath();
  ctx.ellipse(cx, cy, 48, 16, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#ffd166";
  ctx.fillRect(cx - 18, cy - 28, 36, 28);
  ctx.fillStyle = "#111";
  ctx.font = "bold 10px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("SORRY", cx, cy - 10);
  ctx.fillStyle = "#f5d0c0";
  ctx.beginPath(); ctx.arc(cx, cy - 36, 12, 0, Math.PI * 2); ctx.fill();
  if (lake.wake > 0) {
    ctx.fillStyle = `rgba(255,100,100,${0.25 * lake.wake})`;
    ctx.beginPath();
    ctx.arc(cx, cy, 60, 0, Math.PI * 2);
    ctx.fill();
  }
  if (lake.msg && lake.msgTimer > 0) {
    ctx.fillStyle = "rgba(5,8,15,0.8)";
    roundRectPath(220, 20, 600, 34, 8);
    ctx.fill();
    ctx.fillStyle = "#ffd166";
    ctx.font = "13px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(lake.msg, 520, 42);
  }
  ctx.fillStyle = "#e2e8f0";
  ctx.font = "12px sans-serif";
  ctx.textAlign = "right";
  ctx.fillText("Click canoe / Space to fish", W - 16, H - 14);
}

/* ---------- QUÉBEC ---------- */
function startQuebec() {
  state.level = "quebec";
  state.phase = "quebec_play";
  state.playerTeam = "CANADA";
  state.scoreCan = 0;
  state.scoreUsa = 0;
  state.floatTexts = [];
  quebec = {
    phase: "exterior", // exterior | interior
    courage: 0,
    poutine: 0,
    lastTaunt: "",
    tauntTimer: 0.5,
    spit: [],
    bridgeDown: false,
    eatTimer: 0,
    msg: "Endure the taunts. Fill your courage.",
    msgTimer: 3,
  };
  hideOverlay();
  ensureAudio();
  updateHud();
  syncMobileChrome();
}

function quebecNextTaunt() {
  let t = pick(QUEBEC_TAUNTS);
  let guard = 0;
  while (t === quebec.lastTaunt && QUEBEC_TAUNTS.length > 1 && guard++ < 12) {
    t = pick(QUEBEC_TAUNTS);
  }
  quebec.lastTaunt = t;
  return t;
}

function quebecOnPointer(x, y, kind) {
  if (!quebec || state.phase !== "quebec_play") return;
  if (kind !== "down") return;
  if (quebec.phase === "exterior") {
    quebec.courage = Math.min(100, quebec.courage + 12 + rand(0, 6));
    const t = quebecNextTaunt();
    floatText(520, 120, t, "#fde68a", 2);
    // spit glob
    quebec.spit.push({ x: 700, y: 160, vx: -180, vy: rand(20, 80), life: 1.2 });
    floatText(400, 300, "BOING", "#a7f3d0", 0.8);
    state.hate += 1;
    if (quebec.courage >= 100 && !quebec.bridgeDown) {
      quebec.bridgeDown = true;
      quebec.msg = "Drawbridge lowers. Enter… for poutine.";
      quebec.msgTimer = 3;
      floatText(520, 200, "DRAWBRIDGE!", "#ffd166", 2);
    } else if (quebec.bridgeDown && y > 400) {
      quebec.phase = "interior";
      quebec.msg = "Poutine stand. Genuinely delicious.";
      quebec.msgTimer = 2.5;
    }
    updateHud();
  } else {
    quebec.poutine = Math.min(100, quebec.poutine + 18);
    floatText(520, 280, "Curds… gravy… perfection", "#fbbf24", 1.2);
    if (quebec.poutine >= 100) {
      quebec.eatTimer = 0.01;
    }
  }
}

function updateQuebec(dt) {
  if (!quebec || state.phase !== "quebec_play") return;
  if (quebec.msgTimer > 0) quebec.msgTimer -= dt;
  quebec.tauntTimer -= dt;
  if (quebec.phase === "exterior" && quebec.tauntTimer <= 0) {
    quebec.tauntTimer = rand(2.2, 3.5);
    const t = quebecNextTaunt();
    floatText(rand(480, 780), rand(80, 160), t, "#fde68a", 1.8);
    quebec.spit.push({ x: 720, y: 150, vx: -160, vy: rand(10, 70), life: 1.1 });
  }
  for (let i = quebec.spit.length - 1; i >= 0; i--) {
    const s = quebec.spit[i];
    s.life -= dt;
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    if (s.life <= 0) quebec.spit.splice(i, 1);
  }
  if (quebec.phase === "interior" && quebec.poutine >= 100) {
    quebec.eatTimer += dt;
    if (quebec.eatTimer > 0.4 && quebec.eatTimer < 0.5) {
      floatText(520, 200, quebecNextTaunt(), "#fde68a", 2);
      floatText(520, 240, "(mid-bite)", "#ff8fa3", 1.5);
    }
    if (quebec.eatTimer > 3.2) endQuebec();
  }
  // keyboard: space/click endure
  if (keys["Space"] || keys["KeyE"]) {
    keys["Space"] = false;
    keys["KeyE"] = false;
    quebecOnPointer(520, quebec.bridgeDown ? 450 : 300, "down");
  }
  updateHud();
}

function endQuebec() {
  if (state.phase === "level_results") return;
  state.hate += 12;
  updateHud();
  showCampaignResults({
    tag: "QUÉBEC EXIT INTERVIEW",
    title: "PORTCULLIS CLOSES",
    broadcast: "Courage 100% · Poutine 100% · Feelings: bruised",
    verdict: QUEBEC_RESULT,
    tiny: "The knights resumed taunting mid-bite. Of course.",
    againLabel: "Taunt again",
    againFn: () => startQuebec(),
    nextLabel: "Next ▶ Parliament",
  });
}

    ctx.font = "bold 12px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("COURAGE", 95, 38);
    ctx.fillStyle = "#333";
    ctx.fillRect(95, 44, 250, 10);
    ctx.fillStyle = "#f59e0b";
    ctx.fillRect(95, 44, 250 * (quebec.courage / 100), 10);
  } else {
    // interior poutine
    ctx.fillStyle = "#2a1810";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#5c4030";
    ctx.fillRect(200, 200, 640, 280);
    ctx.fillStyle = "#fbbf24";
    ctx.font = "bold 22px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("POUTINE STAND", 520, 180);
    // fries bowl
    ctx.fillStyle = "#f59e0b";
    ctx.beginPath(); ctx.ellipse(520, 340, 90, 50, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fef3c7";
    ctx.fillRect(460, 300, 20, 14);
    ctx.fillRect(500, 290, 22, 16);
    ctx.fillRect(540, 305, 18, 12);
    ctx.fillStyle = "#a3a3a3";
    ctx.beginPath(); ctx.arc(490, 320, 8, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(530, 315, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#78350f";
    ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.ellipse(520, 330, 70, 30, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    // knights reappear
    if (quebec.poutine >= 80) {
      ctx.fillStyle = "#9ca3af";
      ctx.fillRect(200, 100, 40, 60);
      ctx.fillRect(800, 110, 40, 60);
      ctx.fillStyle = "#fde68a";
      ctx.font = "12px sans-serif";
      ctx.fillText(quebec.lastTaunt || "I fart at you!", 520, 100);

    ctx.fillStyle = "rgba(0,0,0,0.55)";

  // spit

    ctx.beginPath();
    ctx.arc(s.x, s.y, 8, 0, Math.PI * 2);

/* ---------- PARLIAMENT ---------- */
function startParliament() {
  state.level = "parliament";
  state.phase = "parl_play";
  state.playerTeam = "CANADA";
  state.scoreCan = 0;
  state.scoreUsa = 0;
  state.floatTexts = [];
  parliament = {
    t: 0,
    sag: 0,
    volley: 0,
    speech: null,
    speechTimer: 0,
    army: false,
    armyStep: 0,
    armyTimer: 0,
    msg: "Auction of anti-American bile. Click a bench.",
    msgTimer: 3,
    lastSide: null,
  };
  hideOverlay();
  ensureAudio();
  updateHud();
  syncMobileChrome();
}

function parliamentOnPointer(x, y, kind) {
  if (!parliament || state.phase !== "parl_play") return;
  if (kind !== "down") return;
  if (parliament.army) {
    parliament.armyStep += 1;
    if (parliament.armyStep === 1) {
      floatText(520, 200, "Rifle jams.", "#ff8fa3", 1.8);
      parliament.msg = "Three soldiers. One rifle. It jammed.";
    } else if (parliament.armyStep === 2) {
      floatText(520, 220, "America won't send more troops.", "#94a3b8", 1.8);
      parliament.msg = "They complain America will not send more troops.";
    } else {
      floatText(520, 240, "Strongly worded letter?", "#ffd166", 2);
      parliament.msg = "Someone suggests a strongly worded letter.";
      setTimeout(() => endParliament(), 1200);
    }
    parliament.msgTimer = 3;
    return;
  }
  // red benches left, blue right
  if (x < 520) {
    const line = pick(PARLIAMENT_RED);
    floatText(280, 200, "RED: " + line, "#ff6b6b", 2);
    state.hate += 2;
    state.scoreCan += 1;
    parliament.lastSide = "red";
    parliament.volley += 1;
  } else {
    const line = pick(PARLIAMENT_BLUE);
    floatText(740, 200, "BLUE: " + line, "#6eb6ff", 2);
    state.hate += 2;
    state.scoreUsa += 1;
    parliament.lastSide = "blue";
    parliament.volley += 1;
  }
  if (parliament.volley === 3) {
    parliament.speech = "Carney: \"Global harmonization of vibes…\"";
    parliament.speechTimer = 3;
  } else if (parliament.volley === 5) {
    parliament.speech = "Ford: \"Best province, period.\"";
    parliament.speechTimer = 3;
  } else if (parliament.volley === 7) {
    parliament.sag = 1;
    floatText(520, 100, "Building sags.", "#fbbf24", 2);
    parliament.msg = "Motion: blame America for the structural damage.";
    parliament.msgTimer = 3;
  } else if (parliament.volley >= 9) {
    parliament.army = true;
    parliament.armyStep = 0;
    parliament.msg = "Optional army beat — tap to continue.";
    parliament.msgTimer = 4;
    floatText(520, 160, "High-five across the aisle!", "#a7f3d0", 2);
  }
  updateHud();
}

function updateParliament(dt) {
  if (!parliament || state.phase !== "parl_play") return;
  parliament.t += dt;
  if (parliament.msgTimer > 0) parliament.msgTimer -= dt;
  if (parliament.speechTimer > 0) {
    parliament.speechTimer -= dt;
    if (parliament.speechTimer <= 0) parliament.speech = null;
  }
  if (parliament.sag > 0 && parliament.sag < 40) parliament.sag += dt * 8;
  updateHud();
}

function endParliament() {
  if (state.phase === "level_results") return;
  state.hate += 15;
  updateHud();
  showCampaignResults({
    tag: "HANSARD HIGHLIGHTS",
    title: "SESSION",
    broadcast: `Denunciations ${parliament.volley} · Sag ${Math.floor(parliament.sag)}°`,
    verdict: PARLIAMENT_RESULT,
    tiny: "Both parties high-fived. The drywall filed a complaint.",
    againLabel: "Reconvene",
    againFn: () => startParliament(),
    goFinale: true,
  });
}

function renderParliament(dt) {
  if (!parliament) return;
  const W = canvas.width, H = canvas.height;
  const sag = parliament.sag || 0;
  ctx.save();
  if (sag > 0) {
    ctx.translate(W / 2, H);
    ctx.rotate((sag * Math.PI) / 180 * 0.15);
    ctx.translate(-W / 2, -H);
  }
  ctx.fillStyle = "#1a2030";
  ctx.fillRect(0, 0, W, H);
  // chamber floor
  ctx.fillStyle = "#2a3344";
  ctx.fillRect(80, 100, 880, 420);
  // red benches
  for (let r = 0; r < 4; r++) {
    ctx.fillStyle = "#9f1239";
    ctx.fillRect(100, 140 + r * 70, 280, 50);
    for (let i = 0; i < 5; i++) {
      ctx.fillStyle = "#334155";
      ctx.fillRect(120 + i * 50, 150 + r * 70, 28, 30);
      ctx.fillStyle = "#f5d0c0";
      ctx.beginPath(); ctx.arc(134 + i * 50, 145 + r * 70, 8, 0, Math.PI * 2); ctx.fill();
    }
  }
  // blue benches
  for (let r = 0; r < 4; r++) {
    ctx.fillStyle = "#1e3a8a";
    ctx.fillRect(660, 140 + r * 70, 280, 50);
    for (let i = 0; i < 5; i++) {
      ctx.fillStyle = "#334155";
      ctx.fillRect(680 + i * 50, 150 + r * 70, 28, 30);
      ctx.fillStyle = "#f5d0c0";
      ctx.beginPath(); ctx.arc(694 + i * 50, 145 + r * 70, 8, 0, Math.PI * 2); ctx.fill();
    }
  }
  // speaker
  ctx.fillStyle = "#78350f";
  ctx.fillRect(470, 80, 100, 60);
  ctx.fillStyle = "#ffd166";
  ctx.font = "bold 12px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("SPEAKER", 520, 115);
  // hate scoreboard
  ctx.fillStyle = "rgba(0,0,0,0.7)";
  roundRectPath(360, 20, 320, 50, 8);
  ctx.fill();
  ctx.fillStyle = "#ff6b6b";
  ctx.font = "bold 14px sans-serif";
  ctx.fillText("AMERICA HATE INDEX: " + state.hate, 520, 50);
  if (parliament.speech) {
    ctx.fillStyle = "rgba(5,8,15,0.85)";
    roundRectPath(200, 250, 640, 50, 8);
    ctx.fill();
    ctx.fillStyle = "#e2e8f0";
    ctx.font = "14px sans-serif";
    ctx.fillText(parliament.speech, 520, 280);
  }
  if (parliament.army) {
    ctx.fillStyle = "rgba(0,0,0,0.75)";
    ctx.fillRect(0, 0, W, H);
    // three soldiers
    for (let i = 0; i < 3; i++) {
      const sx = 360 + i * 120;
      ctx.fillStyle = "#3f6212";
      ctx.fillRect(sx - 16, 300, 32, 50);
      ctx.fillStyle = "#f5d0c0";
      ctx.beginPath(); ctx.arc(sx, 290, 12, 0, Math.PI * 2); ctx.fill();
    }
    // one rifle
    ctx.fillStyle = "#44403c";
    ctx.fillRect(460, 320, 80, 6);
    ctx.fillStyle = "#ffd166";
    ctx.font = "bold 16px sans-serif";
    ctx.fillText("3 soldiers · 1 rifle", 520, 200);
    ctx.font = "13px sans-serif";
    ctx.fillText(parliament.msg || "Tap", 520, 400);
  }
  ctx.restore();
  if (parliament.msg && parliament.msgTimer > 0 && !parliament.army) {
    ctx.fillStyle = "rgba(5,8,15,0.8)";
    roundRectPath(200, 560, 640, 34, 8);
    ctx.fill();
    ctx.fillStyle = "#ffd166";
    ctx.font = "13px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(parliament.msg, 520, 582);
  }
  ctx.fillStyle = "#94a3b8";
  ctx.font = "12px sans-serif";
  ctx.textAlign = "center";
  if (!parliament.army) ctx.fillText("Click RED (left) or BLUE (right) to denounce", 520, H - 12);
}

/* ---------- FINALE ---------- */
function startFinale() {
  state.level = "finale";
  state.phase = "finale_play";
  finale = { fade: 0, shown: false };
  hideOverlay();
  ensureAudio();
  updateHud();
  syncMobileChrome();
}

function updateFinale(dt) {
  if (!finale) return;
  finale.fade = Math.min(1, finale.fade + dt * 0.35);
  if (finale.fade >= 1 && !finale.shown) {
    finale.shown = true;
    state.phase = "level_results";
    showOverlay(`
      <div class="poster-tag">FINALE</div>
      <h2 class="red">${FINALE_LINE}</h2>
      <div class="broadcast">Hate Index (session high): ${state.hate}</div>
      <div class="verdict">The map fades. The rivalry does not.</div>
      <p class="tiny">You wanted Canada to win. Caring was punished. Affectionately.</p>
      <div class="btns">
        <button class="btn-go" id="again">Play again</button>
        <button class="btn-dim" id="mainMenu">Main Menu</button>
      </div>
    `);
    document.getElementById("again").onclick = () => startPlayAll();
    document.getElementById("mainMenu").onclick = () => showMainMenu();
    syncMobileChrome();
  }
}

function renderFinale(dt) {
  const W = canvas.width, H = canvas.height;
  const f = finale ? finale.fade : 0;
  // map-ish silhouette fading
  ctx.fillStyle = "#0a1520";
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.globalAlpha = 1 - f * 0.85;
  ctx.fillStyle = "#c81e1e";
  // crude Canada blob
  ctx.beginPath();
  ctx.moveTo(200, 400);
  ctx.lineTo(280, 200);
  ctx.lineTo(450, 180);
  ctx.lineTo(600, 220);
  ctx.lineTo(780, 160);
  ctx.lineTo(860, 280);
  ctx.lineTo(800, 420);
  ctx.lineTo(500, 480);
  ctx.lineTo(300, 450);
  ctx.closePath();
  ctx.fill();
  drawMapleLeaf(520, 300, 40, "rgba(255,255,255,0.5)");
  ctx.restore();
  ctx.fillStyle = `rgba(3,6,12,${f * 0.7})`;
  ctx.fillRect(0, 0, W, H);
  if (f > 0.5) {
    ctx.globalAlpha = (f - 0.5) * 2;
    ctx.fillStyle = "#e2e8f0";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(FINALE_LINE, 520, 300);
    ctx.globalAlpha = 1;
  }
}



// Boot
fitCanvas();
syncMobileChrome();
showMainMenu();
const unlockAudio = () => { ensureAudio(); try { speechSynthesis.getVoices(); } catch (_) {} };
window.addEventListener("pointerdown", unlockAudio, { once: true });
window.addEventListener("keydown", unlockAudio, { once: true });
try { speechSynthesis.onvoiceschanged = () => {}; } catch (_) {}
requestAnimationFrame(frame);
</script>
