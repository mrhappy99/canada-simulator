<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Canada Simulator — Level 1: The Rink</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: radial-gradient(ellipse at 50% 20%, #1a2740 0%, #070d18 55%, #03060c 100%);
    color: #f5f5f5;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    overflow: hidden;
    user-select: none;
  }
  #wrap {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    width: 100%; height: 100%; gap: 6px;
    padding: 6px 0;
  }
  #titleBar {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    text-align: center; padding: 0 10px;
  }
  #titleBar .logo-leaf { width: 28px; height: 28px; flex-shrink: 0; }
  #titleBar h1 {
    font-size: clamp(16px, 4.2vw, 26px);
    letter-spacing: 0.12em;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 2px 0 #8b0000, 0 0 18px rgba(255,60,60,0.45);
    text-transform: uppercase;
  }
  #titleBar h1 span {
    display: block;
    font-size: 0.48em;
    letter-spacing: 0.28em;
    color: #7eb8ff;
    text-shadow: 0 1px 0 #0a2540;
    font-weight: 700;
    margin-top: 2px;
  }
  #jumbotron {
    display: flex; align-items: stretch; gap: 0;
    background: linear-gradient(180deg, #1c2433 0%, #0d121c 100%);
    border: 3px solid #3a4558;
    border-radius: 10px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 6px 20px rgba(0,0,0,0.55), 0 0 0 2px #0a0e14;
    overflow: hidden;
    max-width: 96vw;
    min-height: 56px;
  }
  #jumbotron .side {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 6px 14px; min-width: 88px;
  }
  #jumbotron .side.can {
    background: linear-gradient(180deg, #c81e1e 0%, #8b0000 100%);
    border-right: 2px solid #3a4558;
  }
  #jumbotron .side.usa {
    background: linear-gradient(180deg, #1e4a8c 0%, #0c2348 100%);
    border-left: 2px solid #3a4558;
  }
  #jumbotron .side .lab { font-size: 10px; font-weight: 800; letter-spacing: 0.18em; opacity: 0.9; }
  #jumbotron .side .num {
    font-family: "Courier New", ui-monospace, monospace;
    font-size: 28px; font-weight: 900; line-height: 1;
    text-shadow: 0 0 8px rgba(255,255,255,0.35);
  }
  #jumbotron .mid {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; padding: 6px 16px; flex: 1; min-width: 160px;
    background: #05080f;
  }
  #jumbotron .clock {
    font-family: "Courier New", ui-monospace, monospace;
    font-size: 22px; font-weight: 900; color: #ffd166;
    letter-spacing: 0.08em;
    text-shadow: 0 0 10px rgba(255,209,102,0.4);
  }
  #jumbotron .team-chip { font-size: 11px; font-weight: 700; color: #a8e6cf; letter-spacing: 0.06em; }
  #hateWrap { width: 100%; max-width: 280px; margin-top: 2px; }
  #hateWrap .hate-lab {
    font-size: 9px; font-weight: 800; letter-spacing: 0.14em;
    color: #ff6b6b; text-align: center; margin-bottom: 2px;
  }
  #hateBar {
    height: 10px; border-radius: 4px;
    background: #1a1020; border: 1px solid #5c2030; overflow: hidden;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.6);
  }
  #hateFill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #7f1d1d, #ff4d4d 60%, #ffd166);
    box-shadow: 0 0 8px rgba(255,77,77,0.6);
    transition: width 0.25s ease-out;
  }
  canvas {
    background: #0a1520;
    border: 4px solid #2a3548;
    border-radius: 14px;
    box-shadow: 0 10px 36px rgba(0,0,0,0.55), inset 0 0 0 2px rgba(255,255,255,0.06);
    max-width: 96vw; max-height: 68vh;
    cursor: crosshair;
    touch-action: none;
    -ms-touch-action: none;
    display: block;
    width: auto; height: auto;
  }
  #hint { font-size: 12px; color: #7a93ad; text-align: center; max-width: 960px; padding: 0 10px; }
  #overlay {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at 50% 30%, rgba(40,20,30,0.55), rgba(4,8,16,0.94));
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
  }
  #overlay.hidden { display: none; }
  .card {
    background: linear-gradient(165deg, #1a283c 0%, #0c1524 55%, #0a101c 100%);
    border: 3px solid #c81e1e;
    border-radius: 16px;
    padding: 28px 32px;
    max-width: 540px; width: 92vw;
    text-align: center;
    box-shadow: 0 0 0 4px #0c2348, 0 20px 60px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,255,255,0.08);
    position: relative; overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute; inset: 0;
    background: repeating-linear-gradient(-12deg, transparent, transparent 18px, rgba(255,255,255,0.015) 18px, rgba(255,255,255,0.015) 19px);
    pointer-events: none;
  }
  .card .poster-tag {
    display: inline-block;
    font-size: 11px; font-weight: 800; letter-spacing: 0.22em;
    color: #ffd166; background: rgba(0,0,0,0.35);
    border: 1px solid #5a4a20; border-radius: 999px;
    padding: 4px 12px; margin-bottom: 10px;
  }
  .card h2 {
    font-size: clamp(26px, 6vw, 36px); margin-bottom: 6px;
    font-weight: 900; letter-spacing: 0.06em;
    color: #fff;
    text-shadow: 0 3px 0 #8b0000, 0 0 20px rgba(255,60,60,0.35);
    text-transform: uppercase;
  }
  .card h2.red { color: #ff6b6b; text-shadow: 0 3px 0 #4a0000, 0 0 18px rgba(255,77,77,0.4); }
  .card h2.blue { color: #6eb6ff; text-shadow: 0 3px 0 #0a2540, 0 0 18px rgba(77,166,255,0.4); }
  .card .subhead {
    font-size: 13px; font-weight: 700; letter-spacing: 0.2em;
    color: #7eb8ff; margin-bottom: 12px; text-transform: uppercase;
  }
  .card p { margin: 10px 0; line-height: 1.45; color: #c8d8ea; font-size: 15px; position: relative; }
  .card .verdict {
    font-size: 17px; font-weight: 800; color: #fff;
    margin: 16px 0; padding: 14px 16px;
    background: linear-gradient(90deg, rgba(200,30,30,0.2), rgba(30,74,140,0.2));
    border: 2px solid #3a4558; border-left: 5px solid #ff4d4d;
    border-radius: 8px; text-align: left; position: relative;
  }
  .card .broadcast {
    font-family: "Courier New", ui-monospace, monospace;
    font-size: 13px; color: #ffd166; letter-spacing: 0.04em;
    background: #05080f; border: 1px solid #2a3548;
    border-radius: 6px; padding: 10px; margin: 12px 0;
  }
  .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 18px; position: relative; }
  button {
    appearance: none; border: none; cursor: pointer;
    font: inherit; font-weight: 800; font-size: 15px;
    padding: 14px 24px; border-radius: 10px;
    transition: transform 0.08s, filter 0.15s;
    letter-spacing: 0.04em; text-transform: uppercase;
    box-shadow: 0 4px 0 rgba(0,0,0,0.35);
    min-height: 48px; min-width: 48px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  button:hover { filter: brightness(1.1); transform: translateY(-1px); }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.35); }
  .btn-ca { background: linear-gradient(180deg, #e63946, #b91c1c); color: #fff; border: 2px solid #ffb4b4; }
  .btn-us { background: linear-gradient(180deg, #3b82f6, #1d4e89); color: #fff; border: 2px solid #93c5fd; }
  .btn-go { background: linear-gradient(180deg, #2dd4a8, #0f766e); color: #fff; border: 2px solid #99f6e4; }
  .btn-dim { background: linear-gradient(180deg, #475569, #334155); color: #e2e8f0; border: 2px solid #64748b; }
  .tiny { font-size: 12px; color: #7a93ad; margin-top: 14px; position: relative; }
  #gameArea { position: relative; display: inline-block; line-height: 0; max-width: 100%; }
  #mobileControls {
    display: none; position: absolute; right: 10px; bottom: 10px;
    flex-direction: column; gap: 10px; z-index: 5; pointer-events: none;
  }
  #mobileControls.visible { display: flex; }
  #mobileControls button {
    pointer-events: auto; min-width: 80px; min-height: 50px;
    padding: 12px 16px; font-size: 14px; letter-spacing: 0.06em;
    opacity: 0.92; box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  }
  #mShoot { background: linear-gradient(180deg, #2dd4a8, #0f766e); color: #fff; border: 2px solid #99f6e4; }
  #mFight { background: linear-gradient(180deg, #e63946, #b91c1c); color: #fff; border: 2px solid #ffb4b4; }
  @media (max-width: 900px), (pointer: coarse) {
    #titleBar h1 { font-size: 15px; }
    #jumbotron .side { min-width: 64px; padding: 4px 8px; }
    #jumbotron .side .num { font-size: 22px; }
    #jumbotron .clock { font-size: 18px; }
    #jumbotron .mid { padding: 4px 8px; min-width: 120px; }
    #hint { font-size: 11px; padding: 0 10px; max-width: 96vw; }
    canvas { max-width: 100vw; max-height: calc(100dvh - 175px); border-width: 3px; border-radius: 10px; }
    .card { padding: 22px 16px; width: 94vw; }
    .card h2 { font-size: 24px; }
    .btns button { min-height: 50px; padding: 14px 20px; font-size: 15px; flex: 1 1 auto; }
  }
</style>
</head>
<body>


<div id="wrap">
  <div id="titleBar">
    <svg class="logo-leaf" viewBox="0 0 24 24" aria-hidden="true"><path fill="#e63946" d="M12 2 L14 8 L20 6 L16 11 L22 14 L15 14 L17 20 L12 16 L7 20 L9 14 L2 14 L8 11 L4 6 L10 8 Z"/></svg>
    <h1>CANADA SIMULATOR<span>Level 1 — Bubble Rink</span></h1>
    <svg class="logo-leaf" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4da6ff" d="M12 2l2.2 6.8H22l-5.5 4 2.1 6.7L12 15.8 5.4 19.5l2.1-6.7L2 8.8h7.8z"/></svg>
  </div>
  <div id="jumbotron" aria-live="polite">
    <div class="side can"><div class="lab">CAN</div><div class="num" id="hudScoreCan">0</div></div>
    <div class="mid">
      <div class="clock" id="hudTime">1:45</div>
      <div class="team-chip" id="hudTeam">PICK A TEAM</div>
      <div id="hateWrap"><div class="hate-lab">AMERICA HATE INDEX</div><div id="hateBar"><div id="hateFill"></div></div></div>
    </div>
    <div class="side usa"><div class="lab">USA</div><div class="num" id="hudScoreUsa">0</div></div>
  </div>
  <div id="gameArea">
    <canvas id="game" width="1040" height="620"></canvas>
    <div id="mobileControls" aria-hidden="true">
      <button type="button" id="mShoot">SHOOT</button>
      <button type="button" id="mFight">FIGHT</button>
    </div>
  </div>
  <div id="hint">WASD / Arrows skate · Mouse aim · Click or F to shoot · Space / click near foe to fight</div>
</div>

<div id="overlay">
  <div class="card" id="card"></div>
</div>

<script>
/* ============================================================================
  CANADA SIMULATOR — Level 1: The Rink
  Aesthetic: Super Chexx / bubble hockey table (hand-painted plastic men).
  Affectionate Canada–US rivalry satire. Punch clichés & institutions, not people.
============================================================================ */

/* ---------- DATA ARRAYS (edit jokes here) ---------- */
const CANADA_FIGHT_LINES = [
  "Sorry about your fist.",
  "That maple leaf is going to stain.",
  "One punch. Historic.",
  "We prefer strongly worded letters.",
  "Helmet: airborne. Dignity: also airborne.",
  "The ref is writing a fake penalty. For vibes.",
  "Wake up on the ice. Apologize to the ice.",
];

const USA_CROWD_LINES = [
  "U-S-A! U-S-A!",
  "PUT IT IN THE NET!",
  "FOUR ARMS! FOUR ARMS!",
  "That puck just got a visa!",
  "BREAKAWAY ENERGY!",
  "Scoreboard goes brrr",
  "Freedom slapshot!",
];

const RESULT_VERDICTS = [
  "You had the puck. The puck did not have you.",
  "Fight record: 0–∞",
  "The scoreboard is not broken. You are.",
  "Effort: Olympic. Outcome: municipal.",
  "Canada played with heart. Heart lost 5–1.",
  "Your stick was wet cardboard. The ice noticed.",
  "Hate Index rising. Maple syrup cannot stop this.",
  "You tried. Trying is not a power play.",
  "Final score certified by people who are not you.",
  "Somewhere a goalie is still on his phone.",
];

const CANADA_MISS_LINES = [
  "Wet cardboard stick…",
  "Puck drowned mid-flight.",
  "Goalie yawned it away.",
  "Almost. Philosophically.",
  "Denied by vibes.",
  "NO GOAL (of course)",
];

const REF_LINES = [
  "Two minutes for… existing too hard!",
  "Penalty! (decorative)",
  "Box time that changes nothing!",
  "I'm writing this down for the scrapbook.",
];

const BOARDROOM_LINES = ["(Level 2 stub — not in v1 slice)"];
const LAKE_SIGNS = ["This used to be ours.", "We had a lake once.", "Sorry about the wake."];
const QUEBEC_TAUNTS = [
  "I fart at you!",
  "I spit in your general direction!",
  "Your mother was a hamster and your father smelt of elderberries!",
];
const PARLIAMENT_RED = ["They stole the lake!"];
const PARLIAMENT_BLUE = ["You didn't denounce it hard enough!"];

/* ============================================================================
  LOSE MULTIPLIER — CRITICAL JOKE ENGINE
  SEARCH STRING: CANADA_LOSE_MULTIPLIER
  FUNCTION: denyCanadianGoal(teamAttacking)
  Also called from: awardGoal()

  If the player picked Team Canada, the scoreboard MUST NEVER award a
  Canadian goal. Shots are visibly attempted, then diverted / swallowed /
  ruled "no goal". USA goals still count. Effort is visible; outcome is not.
============================================================================ */
const CANADA_LOSE_MULTIPLIER = 0; // 0 = Canadian goals never count. Do not raise above 0 for Level 1.

/**
 * denyCanadianGoal — hard gate on Canadian scoring.
 * Returns true if the goal must be denied (Canada team selected + Canada attack).
 * Always returns false for USA goals / when playing as USA.
 */
function denyCanadianGoal(teamAttacking) {
  // CANADA_LOSE_MULTIPLIER gate:
  if (state.playerTeam === "CANADA" && teamAttacking === "CANADA") {
    if (CANADA_LOSE_MULTIPLIER <= 0) return true; // always deny
    return Math.random() > CANADA_LOSE_MULTIPLIER;
  }
  return false;
}

/* ---------- CANVAS / INPUT ---------- */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const overlay = document.getElementById("overlay");
const card = document.getElementById("card");
const mobileControls = document.getElementById("mobileControls");
const hintEl = document.getElementById("hint");

const keys = Object.create(null);
let mouse = { x: 520, y: 310, down: false };
let shootQueued = false;
let fightQueued = false;

/* Mobile: drag-to-skate toward finger; release = coast.
   Short tap = shoot at tap (or fight if near opponent).
   Optional SHOOT / FIGHT buttons bottom-right. */
const touchSkate = { active: false, x: 520, y: 310 };
const activeTouches = new Map(); // id -> { sx, sy, x, y, t0, skating }
const TAP_MOVE_PX = 18;
const TAP_MAX_MS = 320;

function wantsMobileUI() {
  try {
    if (window.matchMedia("(pointer: coarse)").matches) return true;
    if (window.matchMedia("(hover: none)").matches) return true;
    if (window.matchMedia("(max-width: 900px)").matches) return true;
  } catch (_) {}
  return ("ontouchstart" in window) || (navigator.maxTouchPoints > 0);
}

function clientToCanvas(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  return {
    x: (clientX - r.left) * (canvas.width / r.width),
    y: (clientY - r.top) * (canvas.height / r.height),
  };
}

function syncMobileChrome() {
  const show = wantsMobileUI();
  if (mobileControls) {
    const playing = state.phase === "play";
    mobileControls.classList.toggle("visible", show && playing);
    mobileControls.setAttribute("aria-hidden", show && playing ? "false" : "true");
  }
  if (hintEl) {
    hintEl.textContent = show
      ? "Drag on ice to skate · Tap to shoot · Tap near foe or FIGHT · SHOOT button works too"
      : "WASD / Arrows skate · Mouse aim · Click or F to shoot · Space / click near foe to fight";
  }
}

function fitCanvas() {
  const narrow = wantsMobileUI() || window.innerWidth <= 900;
  const maxW = narrow ? window.innerWidth : window.innerWidth * 0.96;
  const reserved = narrow ? 185 : window.innerHeight * 0.30;
  const maxH = Math.max(160, window.innerHeight - reserved);
  const scale = Math.min(maxW / canvas.width, maxH / canvas.height, 1);
  const w = Math.max(1, Math.floor(canvas.width * scale));
  const h = Math.max(1, Math.floor(canvas.height * scale));
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";
}

window.addEventListener("keydown", (e) => {
  keys[e.code] = true;
  if (e.code === "Space") { e.preventDefault(); fightQueued = true; }
  if (e.code === "KeyF") shootQueued = true;
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });
canvas.addEventListener("mousemove", (e) => {
  const p = clientToCanvas(e.clientX, e.clientY);
  mouse.x = p.x; mouse.y = p.y;
});
canvas.addEventListener("mousedown", (e) => {
  mouse.down = true;
  if (e.button === 0) {
    if (state.phase === "play" && nearOpponent()) fightQueued = true;
    else shootQueued = true;
  }
});
canvas.addEventListener("mouseup", () => { mouse.down = false; });

function refreshTouchSkate() {
  let any = false;
  for (const t of activeTouches.values()) {
    if (t.skating) {
      touchSkate.active = true;
      touchSkate.x = t.x;
      touchSkate.y = t.y;
      mouse.x = t.x;
      mouse.y = t.y;
      any = true;
      break;
    }
  }
  if (!any) touchSkate.active = false;
}

function onTouchStart(e) {
  if (state.phase !== "play") return;
  e.preventDefault();
  const now = performance.now();
  for (const touch of e.changedTouches) {
    const p = clientToCanvas(touch.clientX, touch.clientY);
    activeTouches.set(touch.identifier, {
      sx: touch.clientX, sy: touch.clientY,
      x: p.x, y: p.y, t0: now, skating: false,
    });
    mouse.x = p.x; mouse.y = p.y;
  }
}

function onTouchMove(e) {
  if (state.phase !== "play") return;
  e.preventDefault();
  for (const touch of e.changedTouches) {
    const rec = activeTouches.get(touch.identifier);
    if (!rec) continue;
    const p = clientToCanvas(touch.clientX, touch.clientY);
    rec.x = p.x; rec.y = p.y;
    const moved = Math.hypot(touch.clientX - rec.sx, touch.clientY - rec.sy);
    if (moved >= TAP_MOVE_PX) rec.skating = true;
    mouse.x = p.x; mouse.y = p.y;
  }
  refreshTouchSkate();
}

function onTouchEnd(e) {
  e.preventDefault();
  const now = performance.now();
  for (const touch of e.changedTouches) {
    const rec = activeTouches.get(touch.identifier);
    if (!rec) continue;
    activeTouches.delete(touch.identifier);
    if (state.phase !== "play") continue;
    const moved = Math.hypot(touch.clientX - rec.sx, touch.clientY - rec.sy);
    const dtMs = now - rec.t0;
    if (!rec.skating && moved < TAP_MOVE_PX && dtMs <= TAP_MAX_MS) {
      mouse.x = rec.x; mouse.y = rec.y;
      if (nearOpponent()) fightQueued = true;
      else shootQueued = true;
    }
  }
  refreshTouchSkate();
}

canvas.addEventListener("touchstart", onTouchStart, { passive: false });
canvas.addEventListener("touchmove", onTouchMove, { passive: false });
canvas.addEventListener("touchend", onTouchEnd, { passive: false });
canvas.addEventListener("touchcancel", onTouchEnd, { passive: false });

function wireMobileButtons() {
  const shootBtn = document.getElementById("mShoot");
  const fightBtn = document.getElementById("mFight");
  // click covers mouse + touch (avoid touchend+click double-fire)
  if (shootBtn) {
    shootBtn.addEventListener("click", (ev) => {
      ev.preventDefault();
      if (state.phase === "play") shootQueued = true;
    });
  }
  if (fightBtn) {
    fightBtn.addEventListener("click", (ev) => {
      ev.preventDefault();
      if (state.phase === "play") fightQueued = true;
    });
  }
}
wireMobileButtons();
window.addEventListener("resize", () => { fitCanvas(); syncMobileChrome(); });
window.addEventListener("orientationchange", () => { fitCanvas(); syncMobileChrome(); });

/* ---------- RINK GEOMETRY ---------- */
const RINK = { x: 70, y: 48, w: 900, h: 524 };
const GOAL_W = 78, GOAL_D = 20;
const leftGoal = { x: RINK.x - 2, y: RINK.y + RINK.h / 2 - GOAL_W / 2, w: GOAL_D, h: GOAL_W };
const rightGoal = { x: RINK.x + RINK.w - GOAL_D + 2, y: RINK.y + RINK.h / 2 - GOAL_W / 2, w: GOAL_D, h: GOAL_W };

const MATCH_SECONDS = 105; // within 90–120s band

const state = {
  phase: "pick",
  playerTeam: null,
  scoreCan: 0,
  scoreUsa: 0,
  hate: 0,
  timeLeft: MATCH_SECONDS,
  fightLosses: 0,
  floatTexts: [],
  particles: [],
  fight: null,
  windup: 0,
  phoneCheck: 0,
  buzzerDone: false,
  usaPressure: 0,
  crowdFlash: 0,
  goalFlash: 0,
  iceSpray: [],
  puckTrail: [],
};

let player, teammate, enemies, goalieCan, goalieUsa, puck;
let lastTs = 0;

function rand(a, b) { return a + Math.random() * (b - a); }
function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function nearOpponent() {
  if (!player || !enemies) return false;
  return enemies.some((e) => dist(player, e) < 58);
}

function makeSkater(x, y, team, isPlayer) {
  return {
    x, y, vx: 0, vy: 0,
    team, isPlayer: !!isPlayer,
    r: isPlayer ? 18 : 16,
    facing: team === "CANADA" ? 1 : -1,

function updateFight(dt) {
  const f = state.fight;
  if (!f) return;
  f.t += dt;

  for (const h of f.helmets) {
    h.vy += 420 * dt;
    h.x += h.vx * dt;
    h.y += h.vy * dt;
    h.rot += 5 * dt;
  }

  if (f.stage === "grab" && f.t > 0.55) {
    f.stage = "punch";
    f.punchFlash = 0.4;
  }
  if (f.stage === "punch") {
    f.punchFlash -= dt;
    if (f.t > 1.15) {
      f.stage = "ko";

  if (f.stage === "ko" && f.t > 2.1) f.stage = "wake";

    floatText(RINK.x + RINK.w / 2, RINK.y + 90, "(Penalty does nothing. Classic.)", "#8aa4c0", 2);
    const opp = f.opponent;
    const dx = player.x - opp.x || 1;
    player.x += Math.sign(dx) * 36;
    opp.x -= Math.sign(dx) * 36;
    state.phase = "play";
    state.fight = null;
    syncMobileChrome();
  }
}

/* ---------- PHYSICS / AI ---------- */
function rinkClamp(e) {
  e.x = clamp(e.x, RINK.x + e.r + 4, RINK.x + RINK.w - e.r - 4);
  e.y = clamp(e.y, RINK.y + e.r + 4, RINK.y + RINK.h - e.r - 4);
}


function syncAngle(sk) {
  const sp = Math.hypot(sk.vx, sk.vy);
  if (sp > 18) {
    const target = Math.atan2(sk.vy, sk.vx);
    let d = target - (sk.angle || 0);
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    // stiff rod-pivot feel (bubble hockey slots)
    sk.angle = (sk.angle || 0) + d * 0.28;
    sk.facing = Math.cos(sk.angle) >= 0 ? 1 : -1;
  }
}

function addIceSpray(sk) {
  const sp = Math.hypot(sk.vx, sk.vy);
  if (sp < 80) return;
  if (Math.random() > 0.45) return;
  state.iceSpray.push({
    x: sk.x - Math.sign(sk.vx || sk.facing) * 8,
    y: sk.y + 10,
    vx: -sk.vx * 0.15 + rand(-30, 30),
    vy: rand(-20, 10),
    life: rand(0.2, 0.45),
    r: rand(2, 5),
  });
}

function movePlayer(dt) {
  if (player.leafStamp > 0) player.leafStamp -= dt;
  if (player.stunned > 0) {
    player.stunned -= dt;
    player.vx *= 0.88; player.vy *= 0.88;
    player.x += player.vx * dt;
    player.y += player.vy * dt;
    rinkClamp(player);
    return;
  }
  let ax = 0, ay = 0;
  if (keys["KeyW"] || keys["ArrowUp"]) ay -= 1;
  if (keys["KeyS"] || keys["ArrowDown"]) ay += 1;
  if (keys["KeyA"] || keys["ArrowLeft"]) ax -= 1;
  if (keys["KeyD"] || keys["ArrowRight"]) ax += 1;
  if (touchSkate.active && !(ax || ay)) {
    const dx = touchSkate.x - player.x;
    const dy = touchSkate.y - player.y;
    const d = Math.hypot(dx, dy);
    if (d > 12) { ax = dx / d; ay = dy / d; }
  }
  if (ax || ay) {
    const len = Math.hypot(ax, ay) || 1;
    ax /= len; ay /= len;
    const accel = state.playerTeam === "CANADA" ? 520 : 700;
    player.vx += ax * accel * dt;
    player.vy += ay * accel * dt;
  }
  const friction = 3.2;
  player.vx -= player.vx * friction * dt;
  player.vy -= player.vy * friction * dt;
  const maxSpd = state.playerTeam === "CANADA" ? 215 : 270;
  const sp = Math.hypot(player.vx, player.vy);
  if (sp > maxSpd) { player.vx *= maxSpd / sp; player.vy *= maxSpd / sp; }
  player.x += player.vx * dt;
  player.y += player.vy * dt;
  syncAngle(player);
  addIceSpray(player);
  rinkClamp(player);
}

function aiSkate(e, dt, targetX, targetY, speed) {
  if (e.stunned > 0) {
    e.stunned -= dt;
    e.vx *= 0.9; e.vy *= 0.9;
    e.x += e.vx * dt; e.y += e.vy * dt;
    rinkClamp(e);
    return;
  }
  if (e.leafStamp > 0) e.leafStamp -= dt;
  const dx = targetX - e.x, dy = targetY - e.y;
  const d = Math.hypot(dx, dy) || 1;
  e.vx += (dx / d) * speed * dt;
  e.vy += (dy / d) * speed * dt;
  e.vx -= e.vx * 3 * dt;
  e.vy -= e.vy * 3 * dt;
  e.x += e.vx * dt;
  e.y += e.vy * dt;
  syncAngle(e);
  addIceSpray(e);
  rinkClamp(e);
}

function updateAI(dt) {
  if (teammate) {
    const tx = puck.x + (teammate.team === "CANADA" ? -50 : 50);
    const ty = puck.y + Math.sin(performance.now() / 700) * 36;
    aiSkate(teammate, dt, tx, ty, 380);
  }
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    let tx = puck.x, ty = puck.y;
    if (i === 1) { tx = player.x; ty = player.y; }
    if (i === 2) { tx = (puck.x + RINK.x + RINK.w / 2) / 2; ty = puck.y; }
    const spd = e.team === "USA" ? 480 : 350;
    aiSkate(e, dt, tx, ty, spd);

    if (e.team === "USA" && e.hasPuck && Math.random() < 0.015) {
      shootFrom(e, leftGoal.x + 8, leftGoal.y + leftGoal.h / 2 + rand(-10, 10), true);
    }
    if (e.team === "CANADA" && e.hasPuck && Math.random() < 0.01) {
      shootFrom(e, rightGoal.x, rightGoal.y + rightGoal.h / 2 + rand(-20, 20), false);
    }

  updateGoalie(goalieCan, dt, true);

function updateGoalie(g, dt, isCanada) {

  }
  g.y = clamp(g.y, RINK.y + 55, RINK.y + RINK.h - 55);

  if (dist(g, puck) < g.r + puck.r + 8) {
    const saveChance = isCanada ? 0.22 : 0.85;
    if (Math.random() < saveChance || (isCanada && state.playerTeam === "CANADA" && Math.random() < 0.55)) {

      puck.vy = rand(-90, 90);

}

function tryPickup(sk) {
  if (puck.owner) return;
  if (dist(sk, puck) < sk.r + puck.r + 6) {
    puck.owner = sk;
    sk.hasPuck = true;
  }
}

function releasePuckOwner() {
  if (puck.owner) {
    puck.owner.hasPuck = false;
    puck.owner = null;
  }
}

function shootFrom(sk, aimX, aimY, isStrong) {
  if (puck.owner !== sk && dist(sk, puck) > sk.r + 24) return;
  releasePuckOwner();
  const dx = aimX - sk.x, dy = aimY - sk.y;
  const d = Math.hypot(dx, dy) || 1;
  let power = sk.team === "CANADA" ? (isStrong ? 210 : 150) : (isStrong ? 540 : 420);
  if (sk.isPlayer && state.playerTeam === "CANADA") power *= 0.5;
  puck.vx = (dx / d) * power;
  puck.vy = (dy / d) * power;
  puck.lastShooter = sk;
  puck.x = sk.x + (dx / d) * (sk.r + 10);
  puck.y = sk.y + (dy / d) * (sk.r + 10);
  if (sk.team === "CANADA") {
    puck.vx *= 0.72;
    puck.vy *= 0.72;
    puck.vy += rand(-50, 50);
  }
}

function playerShoot() {
  if (state.phase !== "play" || player.stunned > 0) return;
  const need = state.playerTeam === "CANADA" ? 0.38 : 0.06;
  state.windup += 0.1;
  if (state.windup < need) {
    if (state.playerTeam === "CANADA") {
      floatText(player.x, player.y - 26, "winding up…", "#ccc", 0.35);
    }
    return;
  }
  state.windup = 0;
  if (puck.owner === player || dist(player, puck) < 48) {
    shootFrom(player, mouse.x, mouse.y, true);
  }
}

function updatePuck(dt) {
  if (puck.owner) {
    const o = puck.owner;
    const ox = Math.cos(o.angle || 0);
    const oy = Math.sin(o.angle || 0);
    puck.x = o.x + ox * (o.r + 8);
    puck.y = o.y + oy * (o.r + 8) + 2;
    puck.vx = o.vx; puck.vy = o.vy;
    state.puckTrail = [];
    return;
  }
  // High damping for Canada feel (underwater puck)
  const damp = state.playerTeam === "CANADA" ? 1.4 : 0.38;
  puck.vx -= puck.vx * damp * dt;
  puck.vy -= puck.vy * damp * dt;
  puck.x += puck.vx * dt;
  puck.y += puck.vy * dt;

  if (Math.hypot(puck.vx, puck.vy) > 40) {
    state.puckTrail.push({ x: puck.x, y: puck.y, life: 0.28 });
    if (state.puckTrail.length > 10) state.puckTrail.shift();
  }

  if (puck.x < RINK.x + puck.r) { puck.x = RINK.x + puck.r; puck.vx *= -0.72; }
  if (puck.x > RINK.x + RINK.w - puck.r) { puck.x = RINK.x + RINK.w - puck.r; puck.vx *= -0.72; }
  if (puck.y < RINK.y + puck.r) { puck.y = RINK.y + puck.r; puck.vy *= -0.72; }
  if (puck.y > RINK.y + RINK.h - puck.r) { puck.y = RINK.y + RINK.h - puck.r; puck.vy *= -0.72; }

  checkGoals();
}

function collideSkaters(a, b) {
  const d = dist(a, b);
  const min = a.r + b.r;
  if (d > 0 && d < min) {
    const nx = (b.x - a.x) / d, ny = (b.y - a.y) / d;
    const overlap = min - d;
    a.x -= nx * overlap * 0.5; a.y -= ny * overlap * 0.5;
    b.x += nx * overlap * 0.5; b.y += ny * overlap * 0.5;
    const impact = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
    if (impact > 0) {
      a.vx -= impact * nx; a.vy -= impact * ny;
      b.vx += impact * nx; b.vy += impact * ny;
    }
    return true;
  }
  return false;
}

function stealChecks() {
  const all = [player, teammate, ...enemies].filter(Boolean);
  for (const sk of all) {
    if (puck.owner && puck.owner !== sk && dist(sk, puck.owner) < sk.r + puck.owner.r + 4) {
      if (Math.random() < (sk.team === "USA" ? 0.045 : 0.016)) {
        puck.owner.hasPuck = false;
        puck.owner = sk;
        sk.hasPuck = true;
      }
    }
    tryPickup(sk);
  }
}

function canadaMatchScript(dt) {
  if (state.playerTeam !== "CANADA") return;
  state.usaPressure += dt;
  if (state.usaPressure > 20 && state.scoreUsa <= state.scoreCan) {
    state.usaPressure = 0;
    releasePuckOwner();
    puck.x = leftGoal.x + 28;
    puck.y = leftGoal.y + leftGoal.h / 2;
    puck.vx = -80;
    awardGoal("USA");
    floatText(RINK.x + RINK.w / 2, RINK.y + 120, "Breakaway. Of course.", "#4da6ff", 1.8);
  }
  if (state.timeLeft < 9 && state.scoreUsa <= state.scoreCan) {
    releasePuckOwner();
    puck.x = leftGoal.x + 28;
    puck.y = leftGoal.y + leftGoal.h / 2;
    puck.vx = -80;
    awardGoal("USA");
  }
}

function endMatch() {
  if (state.buzzerDone) return;
  state.buzzerDone = true;

  if (state.playerTeam === "CANADA" && state.scoreUsa <= state.scoreCan) {

/* ---------- DRAW (Super Chexx / bubble hockey) ---------- */
function roundRectPath(x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

function drawMapleLeaf(x, y, s, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, -s);
  ctx.lineTo(s * 0.35, -s * 0.25);
  ctx.lineTo(s, -s * 0.45);
  ctx.lineTo(s * 0.4, s * 0.05);
  ctx.lineTo(s * 0.65, s * 0.7);
  ctx.lineTo(0, s * 0.35);
  ctx.lineTo(-s * 0.65, s * 0.7);
  ctx.lineTo(-s * 0.4, s * 0.05);
  ctx.lineTo(-s, -s * 0.45);
  ctx.lineTo(-s * 0.35, -s * 0.25);
  ctx.closePath();
  ctx.fill();
  ctx.fillRect(-1.5, s * 0.3, 3, s * 0.45);
  ctx.restore();
}

function drawStar(x, y, r, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + (i * 2 * Math.PI) / 5;
    const px = Math.cos(a) * r;
    const py = Math.sin(a) * r;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawBoardAd(x, y, w, h, bg, text, fg) {
  ctx.fillStyle = bg;
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = "rgba(255,255,255,0.25)";
  ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  ctx.fillStyle = fg;
  ctx.font = "bold 9px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(text, x + w / 2, y + h / 2);
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
}

function drawRink() {
  const g = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, 80, canvas.width / 2, canvas.height / 2, 560);
  g.addColorStop(0, "#243044");
  g.addColorStop(1, "#0a1018");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#152033";
  roundRectPath(18, 10, canvas.width - 36, canvas.height - 20, 28);
  ctx.fill();

  for (let i = 0; i < 70; i++) {
    const side = i % 4;
    let cx, cy;
    if (side === 0) { cx = 30 + ((i * 47) % (canvas.width - 60)); cy = 14 + (i % 3) * 7; }
    else if (side === 1) { cx = 30 + ((i * 53) % (canvas.width - 60)); cy = canvas.height - 36 + (i % 3) * 6; }
    else if (side === 2) { cx = 22 + (i % 4) * 7; cy = 50 + ((i * 37) % (canvas.height - 100)); }
    else { cx = canvas.width - 52 + (i % 4) * 7; cy = 50 + ((i * 41) % (canvas.height - 100)); }
    const cols = ["#3b4a63", "#4a5a78", "#2a384e", "#c81e1e", "#1d4e89", "#6b7280"];
    ctx.fillStyle = cols[i % cols.length];
    ctx.beginPath();
    ctx.arc(cx, cy, 3 + (i % 3), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = "#1d4e89";
  ctx.fillRect(canvas.width - 78, 16, 42, 14);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 8px sans-serif";
  ctx.fillText("U-S-A", canvas.width - 72, 26);
  ctx.fillStyle = "#c81e1e";
  ctx.fillRect(36, canvas.height - 30, 48, 14);
  ctx.fillStyle = "#fff";
  ctx.fillText("SORRY?", 42, canvas.height - 20);

  // Thick rails / boards
  ctx.fillStyle = "#8b1a1a";
  roundRectPath(RINK.x - 22, RINK.y - 22, RINK.w + 44, RINK.h + 44, 56);
  ctx.fill();
  ctx.fillStyle = "#0c2348";
  roundRectPath(RINK.x - 16, RINK.y - 16, RINK.w + 32, RINK.h + 32, 50);
  ctx.fill();
  ctx.strokeStyle = "#e8b84a";
  ctx.lineWidth = 5;
  roundRectPath(RINK.x - 10, RINK.y - 10, RINK.w + 20, RINK.h + 20, 46);
  ctx.stroke();

  const ice = ctx.createLinearGradient(RINK.x, RINK.y, RINK.x, RINK.y + RINK.h);
  ice.addColorStop(0, "#eef7ff");
  ice.addColorStop(0.45, "#dceaf6");
  ice.addColorStop(1, "#cfdceb");
  ctx.fillStyle = ice;
  roundRectPath(RINK.x, RINK.y, RINK.w, RINK.h, 42);
  ctx.fill();

  ctx.save();
  roundRectPath(RINK.x, RINK.y, RINK.w, RINK.h, 42);
  ctx.clip();
  ctx.fillStyle = "rgba(255,255,255,0.28)";
  ctx.beginPath();
  ctx.ellipse(RINK.x + RINK.w * 0.35, RINK.y + 70, 220, 28, -0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.12)";
  ctx.fillRect(RINK.x + 40, RINK.y + RINK.h - 90, 280, 18);

  ctx.strokeStyle = "#c81e1e";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(RINK.x + RINK.w / 2, RINK.y + 6);
  ctx.lineTo(RINK.x + RINK.w / 2, RINK.y + RINK.h - 6);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(RINK.x + RINK.w / 2, RINK.y + RINK.h / 2, 62, 0, Math.PI * 2);
  ctx.stroke();
  ctx.fillStyle = "rgba(200,30,30,0.12)";
  ctx.beginPath();
  ctx.arc(RINK.x + RINK.w / 2, RINK.y + RINK.h / 2, 40, 0, Math.PI * 2);
  ctx.fill();
  drawMapleLeaf(RINK.x + RINK.w / 2 - 10, RINK.y + RINK.h / 2, 14, "rgba(200,30,30,0.55)");
  drawStar(RINK.x + RINK.w / 2 + 14, RINK.y + RINK.h / 2, 8, "rgba(29,78,137,0.55)");
  ctx.fillStyle = "#c81e1e";
  ctx.beginPath();
  ctx.arc(RINK.x + RINK.w / 2, RINK.y + RINK.h / 2, 5, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = "#1d4e89";
  ctx.lineWidth = 4;
  const bl = RINK.w * 0.25;
  ctx.beginPath();
  ctx.moveTo(RINK.x + bl, RINK.y + 6);
  ctx.lineTo(RINK.x + bl, RINK.y + RINK.h - 6);
  ctx.moveTo(RINK.x + RINK.w - bl, RINK.y + 6);
  ctx.lineTo(RINK.x + RINK.w - bl, RINK.y + RINK.h - 6);
  ctx.stroke();

  const dots = [
    [RINK.x + bl - 70, RINK.y + 110],
    [RINK.x + bl - 70, RINK.y + RINK.h - 110],
    [RINK.x + RINK.w - bl + 70, RINK.y + 110],
    [RINK.x + RINK.w - bl + 70, RINK.y + RINK.h - 110],
  ];
  for (const [dx, dy] of dots) {
    ctx.strokeStyle = "#c81e1e";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(dx, dy, 28, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = "#c81e1e";
    ctx.beginPath();
    ctx.arc(dx, dy, 4, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.strokeStyle = "#c81e1e";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(leftGoal.x + leftGoal.w, RINK.y + RINK.h / 2, 48, -Math.PI / 2, Math.PI / 2);
  ctx.stroke();
  ctx.strokeStyle = "#1d4e89";
  ctx.beginPath();
  ctx.arc(rightGoal.x, RINK.y + RINK.h / 2, 48, Math.PI / 2, -Math.PI / 2);
  ctx.stroke();

  ctx.fillStyle = "#0f172a";
  ctx.fillRect(leftGoal.x, leftGoal.y, leftGoal.w, leftGoal.h);
  ctx.fillRect(rightGoal.x, rightGoal.y, rightGoal.w, rightGoal.h);
  ctx.strokeStyle = "#ff4d4d";
  ctx.lineWidth = 3;
  ctx.strokeRect(leftGoal.x, leftGoal.y, leftGoal.w, leftGoal.h);
  ctx.strokeStyle = "#4da6ff";
  ctx.strokeRect(rightGoal.x, rightGoal.y, rightGoal.w, rightGoal.h);
  ctx.strokeStyle = "rgba(255,255,255,0.2)";
  ctx.lineWidth = 1;
  for (let i = 0; i < 6; i++) {
    const yy = leftGoal.y + 6 + i * 12;
    ctx.beginPath();
    ctx.moveTo(leftGoal.x, yy); ctx.lineTo(leftGoal.x + leftGoal.w, yy); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(rightGoal.x, yy); ctx.lineTo(rightGoal.x + rightGoal.w, yy); ctx.stroke();
  }

  ctx.fillStyle = "rgba(15,23,42,0.35)";
  ctx.fillRect(RINK.x + 180, RINK.y + 4, 160, 10);
  ctx.fillRect(RINK.x + RINK.w - 340, RINK.y + RINK.h - 14, 160, 10);
  ctx.restore();

  drawBoardAd(RINK.x + 80, RINK.y - 20, 110, 14, "#111827", "TIM'S NOT HERE", "#fbbf24");
  drawBoardAd(RINK.x + 220, RINK.y - 20, 100, 14, "#1e3a8a", "FREEDOM SLAPS", "#fff");
  drawBoardAd(RINK.x + 350, RINK.y - 20, 120, 14, "#7f1d1d", "SORRY BEER", "#fecaca");
  drawBoardAd(RINK.x + 500, RINK.y - 20, 110, 14, "#0f172a", "LAKE FOR SALE", "#93c5fd");
  drawBoardAd(RINK.x + 640, RINK.y - 20, 100, 14, "#1d4e89", "U-S-A INC.", "#fff");
  drawBoardAd(RINK.x + 120, RINK.y + RINK.h + 6, 120, 14, "#7f1d1d", "MAPLE DEFENSE", "#fff");
  drawBoardAd(RINK.x + 280, RINK.y + RINK.h + 6, 130, 14, "#0c2348", "FOUR-ARM GLOVE", "#93c5fd");
  drawBoardAd(RINK.x + 450, RINK.y + RINK.h + 6, 120, 14, "#111827", "WET CARDBOARD", "#fcd34d");
  drawBoardAd(RINK.x + 600, RINK.y + RINK.h + 6, 110, 14, "#c81e1e", "HATE INDEX+", "#fff");

  ctx.strokeStyle = "rgba(255,255,255,0.18)";
  ctx.lineWidth = 2;
  roundRectPath(RINK.x + 4, RINK.y + 4, RINK.w - 8, RINK.h - 8, 38);
  ctx.stroke();

  if (state.crowdFlash > 0) {
    ctx.fillStyle = "rgba(77,166,255,0.14)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#4da6ff";
    ctx.font = "bold 26px sans-serif";
    ctx.textAlign = "center";
    ctx.shadowColor = "#1d4e89";
    ctx.shadowBlur = 12;
    ctx.fillText("U-S-A! U-S-A!", canvas.width / 2, 34);
    ctx.shadowBlur = 0;
    ctx.textAlign = "left";
  }
  if (state.goalFlash > 0) {
    ctx.fillStyle = "rgba(255,209,102," + (state.goalFlash * 0.45) + ")";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
}

/** Chunky Super Chexx plastic tabletop player. */
function drawPlasticPlayer(sk, opts) {
  opts = opts || {};
  const isCan = sk.team === "CANADA";
  const jersey = isCan ? "#d62828" : "#f1f5f9";
  const jerseyDark = isCan ? "#9b1c1c" : "#1e3a8a";
  const pants = isCan ? "#111827" : "#1e3a8a";
  const helmet = isCan ? "#7f1d1d" : "#1e3a8a";
  const outline = "#0a0f18";
  const scale = (sk.r / 16) * (opts.big ? 1.35 : 1);
  const ang = sk.angle != null ? sk.angle : (sk.facing >= 0 ? 0 : Math.PI);

  ctx.save();
  ctx.translate(sk.x, sk.y);
  ctx.rotate(ang);

  ctx.fillStyle = "rgba(15,23,42,0.28)";
  ctx.beginPath();
  ctx.ellipse(0, 6 * scale, 14 * scale, 5 * scale, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = "#5c3d2e";
  ctx.lineWidth = 3.2 * scale;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(2 * scale, 2 * scale);
  if (isCan) ctx.quadraticCurveTo(18 * scale, 8 * scale, 26 * scale, 12 * scale);
  else ctx.lineTo(28 * scale, 8 * scale);
  ctx.stroke();
  ctx.lineWidth = 3.5 * scale;
  ctx.beginPath();
  ctx.moveTo(26 * scale, 10 * scale);
  ctx.lineTo(30 * scale, 16 * scale);
  ctx.stroke();

  ctx.fillStyle = "#111";
  ctx.strokeStyle = outline;
  ctx.lineWidth = 1.5;
  roundRectPath(-11 * scale, 8 * scale, 8 * scale, 5 * scale, 1.5); ctx.fill(); ctx.stroke();
  roundRectPath(3 * scale, 8 * scale, 8 * scale, 5 * scale, 1.5); ctx.fill(); ctx.stroke();

  ctx.fillStyle = pants;
  roundRectPath(-10 * scale, 0, 20 * scale, 12 * scale, 3);
  ctx.fill();
  ctx.strokeStyle = outline;
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.fillStyle = jersey;
  roundRectPath(-12 * scale, -14 * scale, 24 * scale, 18 * scale, 5);
  ctx.fill();
  ctx.strokeStyle = outline;
  ctx.lineWidth = 2.2;
  ctx.stroke();

  ctx.fillStyle = jerseyDark;
  ctx.fillRect(-12 * scale, -4 * scale, 24 * scale, 4 * scale);

  if (isCan) drawMapleLeaf(0, -8 * scale, 5.5 * scale, "#fff");
  else {
    ctx.fillStyle = "#1d4e89";
    ctx.fillRect(-12 * scale, -14 * scale, 24 * scale, 5 * scale);
    drawStar(0, -8 * scale, 4.5 * scale, "#1d4e89");
  }

  ctx.fillStyle = jersey;
  ctx.strokeStyle = outline;
  ctx.lineWidth = 1.8;
  roundRectPath(-18 * scale, -10 * scale, 8 * scale, 6 * scale, 2); ctx.fill(); ctx.stroke();
  roundRectPath(10 * scale, -8 * scale, 10 * scale, 5 * scale, 2); ctx.fill(); ctx.stroke();

  ctx.fillStyle = isCan ? "#111" : "#dc2626";
  ctx.beginPath();
  ctx.arc(-18 * scale, -7 * scale, 3.2 * scale, 0, Math.PI * 2);
  ctx.arc(20 * scale, -5 * scale, 3.2 * scale, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = helmet;
  ctx.beginPath();
  ctx.ellipse(0, -18 * scale, 9 * scale, 7.5 * scale, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = outline;
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = "rgba(30,40,60,0.55)";
  ctx.beginPath();
  ctx.ellipse(3 * scale, -17 * scale, 5 * scale, 4 * scale, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = isCan ? "#fff" : "#dc2626";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, -25 * scale);
  ctx.lineTo(0, -12 * scale);
  ctx.stroke();

  ctx.fillStyle = isCan ? "#fff" : "#1d4e89";
  ctx.font = "bold " + Math.floor(8 * scale) + "px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(sk.isPlayer ? "19" : "9", 0, 8 * scale);
  ctx.restore();

  if (sk.isPlayer) {
    ctx.save();
    ctx.translate(sk.x, sk.y);
    ctx.fillStyle = "#ffd166";
    ctx.strokeStyle = "#0a0f18";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -sk.r - 18);
    ctx.lineTo(7, -sk.r - 8);
    ctx.lineTo(-7, -sk.r - 8);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.strokeStyle = "rgba(255,209,102,0.55)";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, sk.r + 8 + Math.sin(performance.now() / 180) * 1.5, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
  if (sk.leafStamp > 0) drawMapleLeaf(sk.x, sk.y - sk.r - 6, 12, "#c1121f");
  if (sk.stunned > 0) {
    ctx.fillStyle = "#ffd166";
    ctx.font = "bold 14px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("* *", sk.x, sk.y - sk.r - 22);
    ctx.textAlign = "left";
  }
}

function drawSkater(sk) { drawPlasticPlayer(sk, { big: false }); }

function drawGoalie(g) {
  const isCan = g.team === "CANADA";
  const facing = isCan ? 1 : -1;
  ctx.save();
  ctx.translate(g.x, g.y);
  ctx.scale(facing, 1);

  ctx.fillStyle = "rgba(15,23,42,0.3)";
  ctx.beginPath();
  ctx.ellipse(0, 10, 16, 6, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = isCan ? "#7f1d1d" : "#1e3a8a";
  ctx.strokeStyle = "#0a0f18";
  ctx.lineWidth = 2;
  roundRectPath(-14, 2, 12, 18, 3); ctx.fill(); ctx.stroke();
  roundRectPath(2, 2, 12, 18, 3); ctx.fill(); ctx.stroke();

  ctx.fillStyle = isCan ? "#c81e1e" : "#f8fafc";
  roundRectPath(-13, -14, 26, 20, 5);
  ctx.fill(); ctx.stroke();

  if (isCan) drawMapleLeaf(0, -6, 6, "#fff");
  else drawStar(0, -6, 5, "#1d4e89");

  ctx.fillStyle = isCan ? "#991b1b" : "#1e3a8a";
  ctx.beginPath();
  ctx.ellipse(0, -18, 10, 8, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#0a0f18";
  ctx.stroke();

  if (isCan && g.phone) {
    ctx.fillStyle = "#111";
    ctx.fillRect(10, -10, 10, 16);
    ctx.fillStyle = "#4ade80";
    ctx.fillRect(11, -8, 8, 10);
    ctx.fillStyle = "#94a3b8";
    ctx.fillRect(13, 4, 4, 1);
    ctx.strokeStyle = "#c81e1e";
    ctx.lineWidth = 4;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(8, -2); ctx.lineTo(14, -2);
    ctx.stroke();
    ctx.fillStyle = "#fff";
    ctx.font = "bold 8px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("...", 0, -28);
  }

  if (!isCan && g.arms >= 4) {
    ctx.strokeStyle = "#93c5fd";
    ctx.lineWidth = 4;
    ctx.lineCap = "round";
    const arms = [[8,-8,22,-18],[8,0,24,-4],[8,4,24,8],[8,10,20,18]];
    for (const [ax, ay, bx, by] of arms) {
      ctx.beginPath();
      ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
      ctx.fillStyle = "#dc2626";
      ctx.beginPath();
      ctx.arc(bx, by, 3.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = "#1d4e89";
    ctx.font = "bold 9px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("x4", 0, 28);
  }
  ctx.restore();

  if (isCan && g.phone && Math.sin(state.phoneCheck * 1.25) > 0.7) {
    ctx.fillStyle = "#ff8fa3";
    ctx.font = "bold 10px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("on phone", g.x, g.y - 34);
    ctx.textAlign = "left";
  }
}

function drawPuck() {
  for (let i = 0; i < state.puckTrail.length; i++) {
    const t = state.puckTrail[i];
    const a = (i + 1) / (state.puckTrail.length + 1) * 0.35;
    ctx.globalAlpha = a;
    ctx.fillStyle = "#111";
    ctx.beginPath();
    ctx.ellipse(t.x, t.y, puck.r * 0.9, puck.r * 0.55, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.beginPath();
  ctx.ellipse(puck.x + 2, puck.y + 4, puck.r * 1.1, puck.r * 0.45, 0, 0, Math.PI * 2);
  ctx.fill();
  const pg = ctx.createRadialGradient(puck.x - 2, puck.y - 2, 1, puck.x, puck.y, puck.r);
  pg.addColorStop(0, "#3f3f46");
  pg.addColorStop(0.6, "#18181b");
  pg.addColorStop(1, "#09090b");
  ctx.fillStyle = pg;
  ctx.beginPath();
  ctx.ellipse(puck.x, puck.y, puck.r, puck.r * 0.72, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#52525b";
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.strokeStyle = "rgba(255,255,255,0.25)";
  ctx.beginPath();
  ctx.ellipse(puck.x, puck.y - 1, puck.r * 0.7, puck.r * 0.35, 0, Math.PI, Math.PI * 2);
  ctx.stroke();
  if (state.playerTeam === "CANADA" && !puck.owner) {
    ctx.strokeStyle = "rgba(30,100,180,0.28)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(puck.x, puck.y, puck.r + 5 + Math.sin(performance.now() / 200) * 2, 0, Math.PI * 2);
    ctx.stroke();
  }
}

function drawAim() {
  if (state.phase !== "play" || !player) return;
  ctx.strokeStyle = "rgba(255,209,102,0.4)";
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 6]);
  ctx.beginPath();
  ctx.moveTo(player.x, player.y);
  ctx.lineTo(mouse.x, mouse.y);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle = "rgba(255,209,102,0.85)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(mouse.x, mouse.y, 9, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(mouse.x - 14, mouse.y); ctx.lineTo(mouse.x - 5, mouse.y);
  ctx.moveTo(mouse.x + 5, mouse.y); ctx.lineTo(mouse.x + 14, mouse.y);
  ctx.moveTo(mouse.x, mouse.y - 14); ctx.lineTo(mouse.x, mouse.y - 5);
  ctx.moveTo(mouse.x, mouse.y + 5); ctx.lineTo(mouse.x, mouse.y + 14);
  ctx.stroke();
}

function drawFightOverlay() {
  const f = state.fight;
  if (!f) return;
  ctx.fillStyle = "rgba(8,10,20,0.42)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = "rgba(255,255,255,0.7)";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(player.x, player.y);
  ctx.lineTo(f.opponent.x, f.opponent.y);
  ctx.stroke();

  const midX = (player.x + f.opponent.x) / 2;
  const midY = (player.y + f.opponent.y) / 2 - 8;
  drawPlasticPlayer({ x: player.x - 8, y: player.y, r: 22, team: player.team, angle: 0.3, facing: 1, isPlayer: false, leafStamp: 0, stunned: 0 }, { big: true });
  drawPlasticPlayer({ x: f.opponent.x + 8, y: f.opponent.y, r: 22, team: f.opponent.team, angle: Math.PI - 0.3, facing: -1, isPlayer: false, leafStamp: 0, stunned: 0 }, { big: true });

  for (const h of f.helmets) {
    ctx.save();
    ctx.translate(h.x, h.y);
    ctx.rotate(h.rot);
    ctx.fillStyle = "#64748b";
    ctx.strokeStyle = "#0a0f18";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(0, 0, 14, 10, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#334155";
    ctx.fillRect(-8, 2, 16, 4);
    ctx.restore();
  }

  if (f.punchFlash > 0) {
    const px = midX, py = midY;
    ctx.fillStyle = "#ffd166";
    ctx.font = "bold 36px sans-serif";
    ctx.textAlign = "center";
    ctx.strokeStyle = "#0a0f18";
    ctx.lineWidth = 4;
    ctx.strokeText("POW!", px, py);
    ctx.fillText("POW!", px, py);
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2 + performance.now() / 120;
      const rr = 28 + (i % 2) * 10;
      drawStar(px + Math.cos(a) * rr, py + 8 + Math.sin(a) * rr, 6, i % 2 ? "#fff" : "#ffd166");
    }
    ctx.textAlign = "left";
  }

  if ((f.stage === "ko" || f.stage === "wake" || f.stage === "ref") && !f.playerWins) {
    drawMapleLeaf(player.x, player.y - 36, 18, "#c1121f");
    ctx.fillStyle = "#fff";
    ctx.font = "bold 22px sans-serif";
    ctx.textAlign = "center";
    ctx.strokeStyle = "#0a0f18";
    ctx.lineWidth = 3;
    ctx.strokeText("KO", player.x, player.y + 6);
    ctx.fillText("KO", player.x, player.y + 6);
    ctx.textAlign = "left";
  }

  if (f.stage === "ref") {
    const rx = RINK.x + RINK.w / 2, ry = RINK.y + 80;
    ctx.fillStyle = "#111";
    ctx.beginPath();
    ctx.arc(rx, ry, 16, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.fillRect(rx - 10, ry - 6, 20, 8);
    ctx.strokeStyle = "#111";
    for (let i = -8; i <= 8; i += 4) {
      ctx.beginPath();
      ctx.moveTo(rx + i, ry - 6);
      ctx.lineTo(rx + i, ry + 2);
      ctx.stroke();
    }
    ctx.font = "bold 12px sans-serif";
    ctx.textAlign = "center";
    ctx.fillStyle = "#fff";
    ctx.fillText("REF", rx, ry + 30);
    ctx.fillStyle = "#ffd166";
    ctx.fillText("(decorative penalty)", rx, ry + 46);
    ctx.textAlign = "left";
  }
}

function drawDomeOverlay() {
  const vg = ctx.createRadialGradient(
    canvas.width / 2, canvas.height * 0.42, canvas.height * 0.15,
    canvas.width / 2, canvas.height * 0.5, canvas.width * 0.62
  );
  vg.addColorStop(0, "rgba(255,255,255,0)");
  vg.addColorStop(0.55, "rgba(255,255,255,0)");
  vg.addColorStop(0.82, "rgba(10,16,28,0.18)");
  vg.addColorStop(1, "rgba(4,8,14,0.55)");
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = "rgba(255,255,255,0.14)";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.ellipse(canvas.width / 2, canvas.height * 0.38, canvas.width * 0.38, canvas.height * 0.22, 0, Math.PI * 1.15, Math.PI * 1.85);
  ctx.stroke();
}

function drawFloats(dt) {
  for (let i = state.floatTexts.length - 1; i >= 0; i--) {
    const t = state.floatTexts[i];
    t.life -= dt;
    t.y += t.vy * dt;
    if (t.life <= 0) { state.floatTexts.splice(i, 1); continue; }
    ctx.globalAlpha = clamp(t.life / t.max, 0, 1);
    ctx.font = "bold 16px sans-serif";
    ctx.textAlign = "center";
    ctx.lineWidth = 3;
    ctx.strokeStyle = "rgba(0,0,0,0.55)";
    ctx.strokeText(t.text, t.x, t.y);
    ctx.fillStyle = t.color;
    ctx.fillText(t.text, t.x, t.y);
    ctx.textAlign = "left";
    ctx.globalAlpha = 1;
  }
  for (let i = state.particles.length - 1; i >= 0; i--) {
    const p = state.particles[i];
    p.life -= dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 220 * dt;
    if (p.life <= 0) { state.particles.splice(i, 1); continue; }
    ctx.globalAlpha = clamp(p.life, 0, 1);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  for (let i = state.iceSpray.length - 1; i >= 0; i--) {
    const p = state.iceSpray[i];
    p.life -= dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.life <= 0) { state.iceSpray.splice(i, 1); continue; }
    ctx.globalAlpha = clamp(p.life * 2, 0, 0.7);
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, p.r, p.r * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  for (let i = state.puckTrail.length - 1; i >= 0; i--) {
    state.puckTrail[i].life -= dt;
    if (state.puckTrail[i].life <= 0) state.puckTrail.splice(i, 1);
  }
}

function render(dt) {
  drawRink();
  if (state.phase === "pick") {
    ctx.fillStyle = "rgba(0,0,0,0.2)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    drawDomeOverlay();
    return;
  }

  drawGoalie(goalieCan);
  drawGoalie(goalieUsa);
  if (teammate) drawSkater(teammate);
  for (const e of enemies) drawSkater(e);
  drawSkater(player);
  drawPuck();
  drawAim();

  if (state.phase === "fight") drawFightOverlay();
  drawFloats(dt);
  drawDomeOverlay();

  if (state.phase === "play" && state.playerTeam === "CANADA" && state.windup > 0) {
    const need = 0.38;
    ctx.fillStyle = "rgba(0,0,0,0.45)";
    ctx.fillRect(player.x - 22, player.y + 26, 44, 6);
    ctx.fillStyle = "#ffd166";
    ctx.fillRect(player.x - 22, player.y + 26, 44 * clamp(state.windup / need, 0, 1), 6);
  }
}

/* ---------- MAIN LOOP ---------- */
function update(dt) {
  if (state.phase === "pick" || state.phase === "results") return;

  if (state.phase === "fight") {
    updateFight(dt);
    // still draw floats
    return;
  }

  // play
  state.timeLeft -= dt;
  if (state.crowdFlash > 0) state.crowdFlash -= dt;
  if (state.goalFlash > 0) state.goalFlash -= dt;
  updateHud();

  if (state.timeLeft <= 0) {
    endMatch();
    return;
  }

  movePlayer(dt);
  updateAI(dt);

  const all = [player, teammate, ...enemies].filter(Boolean);
  for (let i = 0; i < all.length; i++) {
    for (let j = i + 1; j < all.length; j++) collideSkaters(all[i], all[j]);
  }

  stealChecks();
  updatePuck(dt);
  canadaMatchScript(dt);

  // Input queues
  if (shootQueued) {
    shootQueued = false;
    playerShoot();
  } else {
    // decay windup if not shooting
    state.windup = Math.max(0, state.windup - dt * 0.5);
  }

  if (fightQueued) {
    fightQueued = false;
    let best = null, bestD = 60;
    for (const e of enemies) {
      const d = dist(player, e);
      if (d < bestD) { bestD = d; best = e; }
    }
    if (best) startFight(best);
    else floatText(player.x, player.y - 30, "Nobody to fight (yet)", "#aaa", 0.9);
  }
}

function frame(ts) {
  if (!lastTs) lastTs = ts;
  let dt = (ts - lastTs) / 1000;
  lastTs = ts;
  dt = Math.min(dt, 0.05);
  update(dt);
  render(dt);
  requestAnimationFrame(frame);
}

// Boot
fitCanvas();
syncMobileChrome();
showTeamPick();
requestAnimationFrame(frame);
</script>
</body>
